<div class="huelle" [class.huelle--spalte]="breit()">
  <app-bottom-nav
    class="huelle__nav"
    [eintraege]="eintraege()"
    [aktiv]="aktiv()"
    [beschriftung]="'nav.beschriftung' | t"
    [variante]="breit() ? 'spalte' : 'unten'"
  />
  <main class="huelle__inhalt" [class.huelle__inhalt--unter]="breit() && !aufDerKarte()">
    <router-outlet />
  </main>
  @if (aufDerKarte()) {
    <app-avatar-button
      class="huelle__avatar"
      [name]="avatarName()"
      [beschriftung]="avatarBeschriftung()"
      (klick)="zumKonto()"
    />
  }
</div>
