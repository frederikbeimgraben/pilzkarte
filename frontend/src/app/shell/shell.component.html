<div class="shell" [class.shell--column]="wide()">
  @if (wide()) {
    @defer (when wide()) {
      <app-map class="shell__map" [surfaceOnly]="!onTheMap()" />
    }
  }
  <app-bottom-nav
    class="shell__nav"
    [eintraege]="eintraege()"
    [active]="active()"
    [label]="'nav.beschriftung' | t"
    [variant]="wide() ? 'spalte' : 'unten'"
  />
  <main
    class="shell__content"
    [class.shell__content--off]="wide() && onTheMap()"
    [class.shell__content--full]="wide() && fullWidth()"
  >
    <router-outlet />
  </main>
  @if (onTheMap() || wide()) {
    <app-avatar-button
      class="shell__avatar"
      [name]="avatarName()"
      [label]="avatarLabel()"
      (pressed)="toAccount()"
    />
  }
</div>
