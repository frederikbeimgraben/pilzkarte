<button class="series" type="button" (click)="chosen.emit()">
  <span class="row__tile"><app-svg-icon [name]="icon()" [size]="22" /></span>
  <span class="row__stack">
    <span class="row__title">{{ titel() }}</span>
    @if (subline()) {
      <span class="row__sub">{{ subline() }}</span>
    }
  </span>
</button>
