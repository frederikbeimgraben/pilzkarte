<button class="artzeile" type="button" [class.artzeile--aktiv]="aktiv()" (click)="auswahl.emit()">
  <span class="artzeile__name">{{ name() }}</span>
  <span class="artzeile__kurve"><ng-content select="[kurve]" /></span>
  <span class="artzeile__latein">{{ latein() }}</span>
  <span class="artzeile__tags"><ng-content select="[tags]" /></span>
</button>
