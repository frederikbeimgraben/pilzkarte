<app-overlay-host [open]="open()" [modal]="true" [cover]="true" (closed)="closed.emit()">
  <section class="filtersheet" role="dialog" aria-modal="true" [attr.aria-label]="title()">
    <div class="filtersheet__handle"><span class="filtersheet__handle-line"></span></div>
    <header class="filtersheet__head">
      @if (back()) {
        <button
          class="filtersheet__back tap"
          type="button"
          data-press="scale"
          [attr.aria-label]="'common.back' | t"
          (click)="backClick.emit()"
        >
          <app-svg-icon name="back" [size]="20" />
        </button>
      }
      <h2 class="filtersheet__title">{{ title() }}</h2>
      @if (!back() && resetEnabled()) {
        <button class="filtersheet__reset tap" type="button" data-press="scale" (click)="resetClick.emit()">
          {{ 'common.reset' | t }}
        </button>
      }
    </header>
    <div #content class="filtersheet__content" appScrollFade><ng-content /></div>
    @if (primaryLabel(); as label) {
      <footer class="filtersheet__foot">
        <button
          class="filtersheet__primary tap"
          type="button"
          data-press="scale"
          (click)="primaryClick.emit()"
        >
          {{ label }}
        </button>
      </footer>
    }
  </section>
</app-overlay-host>
