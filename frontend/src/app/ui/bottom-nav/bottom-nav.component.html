<nav class="nav" [class.nav--column]="variant() === 'spalte'" [attr.aria-label]="label()">
  @for (entry of eintraege(); track entry.path) {
    <a
      class="nav__entry"
      [class.nav__entry--active]="entry.path === active()"
      [routerLink]="entry.path"
      [attr.aria-current]="entry.path === active() ? 'page' : null"
    >
      <span class="nav__pill"><app-svg-icon [name]="entry.icon" /></span>
      <span class="nav__label">{{ entry.label }}</span>
    </a>
  }
</nav>
