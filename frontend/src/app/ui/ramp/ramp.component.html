<p class="ramp__label">{{ label() }}</p>
<div class="ramp" role="img" [attr.aria-label]="label() + ': ' + von() + ' – ' + bis()">
  @for (farbe of colors(); track farbe) {
    <i class="ramp__step" [style.background]="farbe"></i>
  }
</div>
<div class="ramp__ends">
  <span>{{ von() }}</span>
  <span>{{ bis() }}</span>
</div>
