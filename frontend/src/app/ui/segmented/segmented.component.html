<div class="seg" role="tablist" [class.seg--locked]="locked()" [attr.aria-label]="label()">
  @for (option of options(); track option.value; let i = $index) {
    <button
      class="seg__choice"
      type="button"
      role="tab"
      [class.seg__choice--active]="option.value === value()"
      [attr.aria-selected]="option.value === value()"
      [attr.tabindex]="option.value === value() ? 0 : -1"
      [disabled]="locked()"
      (click)="valueChange.emit(option.value)"
      (keydown)="onKey($event, i)"
    >
      {{ option.label }}
    </button>
  }
</div>
