<label
  class="field__label"
  [class.field__label--section]="section()"
  [class.sr-only]="hideLabel()"
  [attr.for]="readOnly() ? null : fieldId"
  >{{ label() }}</label
>
@if (readOnly()) {
  <button
    class="field field--button tap"
    type="button"
    data-press="scale"
    [class.field--empty]="empty()"
    [class.field--multiline]="multiline()"
    (click)="displayClick.emit()"
  >
    @if (icon(); as glyph) {
      <app-svg-icon class="field__lead" [name]="glyph" [size]="22" [strokeWidth]="1.8" />
    }
    {{ empty() ? placeholder() : value() }}
    @if (chevron()) {
      <app-svg-icon class="field__trail" name="chevron" [size]="18" />
    }
  </button>
} @else if (multiline()) {
  <textarea
    class="field field--multiline tap"
    data-press="scale"
    [id]="fieldId"
    [value]="value()"
    [attr.placeholder]="placeholder() || null"
    [attr.inputmode]="mode()"
    [attr.enterkeyhint]="hint()"
    (input)="onInput($event)"
  ></textarea>
} @else if (kind() === 'date') {
  <span class="field field--date tap" data-press="scale" [class.field--empty]="empty()">
    <span class="field__shown">{{ shown() }}</span>
    <input
      class="field__date"
      type="date"
      [id]="fieldId"
      [value]="value()"
      [attr.enterkeyhint]="hint()"
      (input)="onInput($event)"
    />
  </span>
} @else if (icon()) {
  <span class="field field--icon tap" data-press="scale">
    <app-svg-icon class="field__icon" [name]="icon()!" [size]="18" />
    <input
      class="field__input"
      type="text"
      [id]="fieldId"
      [value]="value()"
      [attr.placeholder]="placeholder() || null"
      [attr.inputmode]="mode()"
      [attr.enterkeyhint]="hint()"
      (input)="onInput($event)"
    />
  </span>
} @else {
  <input
    class="field tap"
    data-press="scale"
    [type]="kind()"
    [id]="fieldId"
    [value]="value()"
    [attr.placeholder]="placeholder() || null"
    [attr.inputmode]="mode()"
    [attr.enterkeyhint]="hint()"
    (input)="onInput($event)"
  />
}
