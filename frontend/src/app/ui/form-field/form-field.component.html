<label class="field__label" [class.sr-only]="hideLabel()" [attr.for]="readOnly() ? null : fieldId">{{
  label()
}}</label>
@if (readOnly()) {
  <button
    class="field field--button"
    type="button"
    [class.field--empty]="empty()"
    (click)="displayClick.emit()"
  >
    {{ empty() ? placeholder() : value() }}
  </button>
} @else if (multiline()) {
  <textarea
    class="field field--multiline"
    [id]="fieldId"
    [value]="value()"
    [attr.placeholder]="placeholder() || null"
    (input)="onInput($event)"
  ></textarea>
} @else if (icon()) {
  <span class="field field--icon">
    <app-svg-icon class="field__icon" [name]="icon()!" [size]="18" />
    <input
      class="field__input"
      type="text"
      [id]="fieldId"
      [value]="value()"
      [attr.placeholder]="placeholder() || null"
      (input)="onInput($event)"
    />
  </span>
} @else {
  <input
    class="field"
    [type]="kind()"
    [id]="fieldId"
    [value]="value()"
    [attr.placeholder]="placeholder() || null"
    (input)="onInput($event)"
  />
}
