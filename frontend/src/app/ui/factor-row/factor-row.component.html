<app-checkbox
  class="factor__switches"
  [id]="fieldId"
  [ngModel]="active()"
  (ngModelChange)="activeChange.emit($event)"
>
  <span class="factor__stack">
    <span class="factor__name">{{ name() }}</span>
    @if (subline()) {
      <span class="factor__sub">{{ subline() }}</span>
    }
  </span>
</app-checkbox>
<button class="factor__condition" type="button" (click)="conditionClick.emit()">{{ condition() }}</button>
