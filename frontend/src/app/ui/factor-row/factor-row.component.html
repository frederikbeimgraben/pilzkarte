<app-checkbox
  class="faktor__schalter"
  [id]="feldId"
  [ngModel]="aktiv()"
  (ngModelChange)="aktivChange.emit($event)"
>
  <span class="faktor__stapel">
    <span class="faktor__name">{{ name() }}</span>
    @if (unter()) {
      <span class="faktor__unter">{{ unter() }}</span>
    }
  </span>
</app-checkbox>
<button class="faktor__bedingung" type="button" (click)="bedingungKlick.emit()">{{ bedingung() }}</button>
