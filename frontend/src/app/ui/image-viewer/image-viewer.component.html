@if (image()) {
  <app-page-header class="viewer__head" [title]="title()" [back]="true" (backClick)="back.emit()">
    @if (count() > 0) {
      <span class="viewer__count">{{ counter() }}</span>
    }
  </app-page-header>
  <div class="viewer__body">
    <app-private-image class="viewer__image" [path]="path() ?? ''" [alt]="alt()" />
    @if (image()?.caption; as caption) {
      <p class="viewer__caption">{{ caption }}</p>
    }
    <div class="viewer__facts">
      @for (row of details(); track row.labelKey) {
        <app-list-row kind="catalogue" [title]="row.labelKey | t" [value]="row.text">
          @if (row.badgeKey || row.badgeText) {
            <app-badge trail variant="primary">{{
              row.badgeKey ? (row.badgeKey | t) : row.badgeText
            }}</app-badge>
          }
        </app-list-row>
      }
    </div>
  </div>
}
