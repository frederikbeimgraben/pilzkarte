<button
  #button
  class="week"
  type="button"
  [class.week--active]="active()"
  [class.week--forecast]="forecast()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="active()"
  [attr.tabindex]="inTabOrder() ? 0 : -1"
  [disabled]="locked()"
  (click)="chosen.emit()"
>
  @if (yearMark()) {
    <span class="week__year" aria-hidden="true">{{ jahr() }}</span>
  }
  <span class="week__kw" aria-hidden="true">{{ 'zeitleiste.kw' | t }}</span>
  <span class="week__number" aria-hidden="true">{{ woche() }}</span>
  <span class="week__track" aria-hidden="true"><i class="week__bar" [style.inline-size]="bars()"></i></span>
</button>
