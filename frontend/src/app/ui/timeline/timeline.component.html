<div
  class="leiste"
  role="group"
  [class.leiste--gedaempft]="gedaempft()"
  [attr.aria-label]="beschriftung()"
  (keydown)="beiTaste($event)"
>
  @for (woche of angezeigt(); track woche.schluessel; let i = $index) {
    <app-week-button
      [jahr]="woche.jahr"
      [woche]="woche.woche"
      [anteil]="woche.anteil"
      [prognose]="woche.prognose"
      [jahresmarke]="woche.jahresmarke"
      [aktiv]="istAktiv(woche)"
      [gesperrt]="gedaempft()"
      [imTabWeg]="i === aktivIndex()"
      (auswahl)="auswahl.emit(woche)"
    />
  }
</div>
