<div
  #bar
  class="bar"
  role="group"
  [class.bar--dimmed]="dimmed()"
  [attr.aria-label]="label()"
  (keydown)="onKey($event)"
>
  @for (woche of shown(); track woche.schluessel; let i = $index) {
    <app-week-button
      [jahr]="woche.jahr"
      [woche]="woche.woche"
      [share]="woche.share"
      [forecast]="woche.forecast"
      [yearMark]="woche.yearMark"
      [active]="isActive(woche)"
      [locked]="dimmed()"
      [inTabOrder]="i === activeIndex()"
      (chosen)="chosen.emit(woche)"
    />
  }
</div>
