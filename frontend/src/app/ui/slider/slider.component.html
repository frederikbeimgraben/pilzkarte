<p class="slider__head">
  <span class="slider__label">{{ label() }}</span>
  @if (valueText()) {
    <span class="slider__value">{{ valueText() }}</span>
  }
</p>
<div class="slider">
  <span class="slider__track"></span>
  <span class="slider__chosen" [style.inline-size]="share()"></span>
  <input
    class="slider__handle"
    type="range"
    [attr.aria-label]="label()"
    [attr.aria-valuetext]="valueText()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    (input)="onInput($event)"
  />
</div>
