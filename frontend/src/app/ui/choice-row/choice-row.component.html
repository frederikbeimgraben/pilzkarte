<label class="row tap" data-press="tint">
  <input class="row__input" type="checkbox" [checked]="checked()" (change)="onChange($event)" />
  <span class="row__box" aria-hidden="true">
    @if (checked()) {
      <app-svg-icon name="check" [size]="tick()" [strokeWidth]="2.5" />
    }
  </span>
  <span class="row__label">{{ label() }}</span>
  @if (count()) {
    <span class="row__count">{{ count() }}</span>
  }
</label>
