<svg
  [attr.viewBox]="viewBox()"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.role]="role()"
  [attr.aria-label]="label() ?? null"
  [attr.aria-hidden]="hidden()"
  [class.filled]="filled()"
  [style.stroke-width.px]="strich()"
>
  @switch (name()) {
    @case ('karte') {
      <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" />
      <path d="M9 4v14M15 6v14" />
    }
    @case ('arten') {
      <path d="M4 11a8 6 0 0 1 16 0H4z" />
      <path d="M9 11v7a3 3 0 0 0 6 0v-7" />
    }
    @case ('funde') {
      <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z" />
      <circle cx="12" cy="10" r="2.5" />
    }
    @case ('mehr') {
      <circle cx="5" cy="12" r="1.6" />
      <circle cx="12" cy="12" r="1.6" />
      <circle cx="19" cy="12" r="1.6" />
    }
    @case ('plus') {
      <path d="M12 5v14M5 12h14" />
    }
    @case ('ort') {
      <circle cx="12" cy="12" r="3" />
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      <circle cx="12" cy="12" r="8" />
    }
    @case ('ebenen') {
      <path d="M12 4l9 5-9 5-9-5z" />
      <path d="M3 14l9 5 9-5" />
    }
    @case ('zurueck') {
      <path d="M15 5l-7 7 7 7" />
    }
    @case ('vor') {
      <path d="M9 5l7 7-7 7" />
    }
    @case ('zu') {
      <path d="M6 6l12 12M18 6L6 18" />
    }
    @case ('haken') {
      <path d="M5 12l5 5 9-10" />
    }
    @case ('zone') {
      <path d="M5 8l7-4 7 5-2 8-8 3-4-6z" />
      <circle cx="5" cy="8" r="1.5" />
      <circle cx="12" cy="4" r="1.5" />
      <circle cx="19" cy="9" r="1.5" />
      <circle cx="17" cy="17" r="1.5" />
      <circle cx="9" cy="20" r="1.5" />
    }
    @case ('suche') {
      <circle cx="11" cy="11" r="7" />
      <path d="M20 20l-4-4" />
    }
    @case ('schloss') {
      <rect x="5" y="11" width="14" height="9" rx="2" />
      <path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11v5M12 7.8v.1" />
    }
    @case ('leer') {
      <!-- Ein Korb: was in den Listen der App fehlt, sammelt man hinein. -->
      <path d="M4 10h16l-1.6 9H5.6z" />
      <path d="M4 10l4-6M20 10l-4-6" />
      <path d="M10 13.5v2M14 13.5v2" />
    }
    @case ('warnung') {
      <path d="M12 3.5 2.5 20h19z" />
      <path d="M12 10v4M12 17.2v.1" />
    }
    @case ('links') {
      <path d="M8.5 1.5 3.5 6l5 4.5z" />
    }
    @case ('rechts') {
      <path d="M3.5 1.5 8.5 6l-5 4.5z" />
    }
    @case ('abspielen') {
      <path d="M3 1.4 10 6 3 10.6Z" />
    }
    @case ('pause') {
      <path d="M2.5 1.5h2.5v9h-2.5zM7 1.5h2.5v9h-2.5z" />
    }
    @case ('wolke') {
      <path d="M7 15.5a4.2 4.2 0 0 1 .5-8.4A5.8 5.8 0 0 1 18.6 8a3.6 3.6 0 0 1-.4 7.5" />
      <path d="M9 18.5l-.8 2M13 18.5l-.8 2M17 18.5l-.8 2" />
    }
    @case ('kalender') {
      <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
      <path d="M3.5 10h17M8 3v4M16 3v4" />
      <rect x="7" y="13" width="3" height="3" rx="0.6" />
    }
    @case ('ausschlag') {
      <path d="M3 12h4l3-6 4 12 3-6h4" />
    }
    @case ('thermometer') {
      <path d="M14 14.2V5.5a2 2 0 1 0-4 0v8.7a3.8 3.8 0 1 0 4 0z" />
      <path d="M12 9v5" />
    }
    @case ('frost') {
      <path d="M14 14.2V5.5a2 2 0 1 0-4 0v8.7a3.8 3.8 0 1 0 4 0z" />
      <path d="M17 4l3 3M20 4l-3 3" />
    }
    @case ('wald') {
      <path d="M12 3l4.5 6.5h-2.6L18 15H6l4.1-5.5H7.5z" />
      <path d="M12 15v5.5" />
      <path d="M4 20.5h16" />
    }
    @case ('nadelbaum') {
      <path d="M12 2.5l3.6 5.4h-2L17 13h-2.2l3 4.5H6.2l3-4.5H7l3.4-5.1h-2z" />
      <path d="M12 17.5v4" />
    }
    @case ('blatt') {
      <path d="M12 21c0-6 1.5-9.5 6-12.5C20 11 19 17 13.5 18.6" />
      <path d="M12 21c0-4-1-7-5-9" />
    }
    @case ('hoehe') {
      <path d="M3 19h18" />
      <path d="M4.5 19l5.5-9 3 4.5 2.5-3.5L20 19" />
      <path d="M8 10.5h4" />
    }
    @case ('hang') {
      <path d="M3.5 19.5h17" />
      <path d="M4.5 19.5L15 6.5l5.5 13" />
      <path d="M9 19.5v-3.5h3.5" />
    }
    @case ('kompass') {
      <path d="M12 2.5l2.2 6.3H21l-5.4 4 2 6.4L12 15.2 6.4 19.2l2-6.4-5.4-4h6.8z" />
    }
    @case ('relief') {
      <path d="M3 16c2.5-4 4-4 6.5 0M7 20c3-6 6.5-6 10 0M11 12c1.6-2.6 3.2-2.6 4.8 0" />
    }
    @case ('kuppe') {
      <path d="M4 18h16" />
      <path d="M5 18c2-7 5-10 7-10s5 3 7 10" />
      <circle cx="12" cy="8" r="1.8" />
    }
    @case ('kolben') {
      <path d="M8 3v6.5L4.6 17A3 3 0 0 0 7.3 21h9.4a3 3 0 0 0 2.7-4L16 9.5V3" />
      <path d="M7 3h10" />
      <path d="M6.2 14.5h11.6" />
    }
    @case ('koerner') {
      <circle cx="7" cy="9" r="1.4" />
      <circle cx="13" cy="7.5" r="1" />
      <circle cx="17.5" cy="10.5" r="1.4" />
      <circle cx="9.5" cy="14" r="1" />
      <circle cx="15" cy="15.5" r="1.4" />
      <path d="M3.5 19.5h17" />
    }
    @case ('bodenschichten') {
      <path d="M3.5 9.5h17" />
      <path d="M4 13h16M4.5 16.5h15" />
      <path d="M9 9.5c0-3 1.5-5 3-6 1.5 1 3 3 3 6" />
    }
    @case ('hutbreite') {
      <!-- Die Hutkuppel, darunter die Maßlinie mit Endmarken. -->
      <path d="M3.6 12.4a8.4 8.4 0 0 1 16.8 0z" />
      <path d="M3.6 17.2h16.8M3.6 15.8v2.8M20.4 15.8v2.8" />
    }
    @case ('stielhoehe') {
      <!-- Der Stiel von der Seite, die Maßlinie steht senkrecht daneben. -->
      <path d="M9.6 5.4h4.8v13.2H9.6z" />
      <path d="M5.4 5.4v13.2M4 5.4h2.8M4 18.6h2.8" />
    }
    @case ('stieldicke') {
      <!-- Der Stiel im Schnitt, der Doppelpfeil läuft quer hindurch. -->
      <path d="M8.4 4.6v14.8M15.6 4.6v14.8" />
      <path d="M8.4 12h7.2M10.2 10.4 8.6 12l1.6 1.6M13.8 10.4 15.4 12l-1.6 1.6" />
    }
    @case ('sporenlaenge') {
      <!-- Eine gekippte Spore, an beiden Enden der langen Achse eine Marke.
           Nicht dasselbe Zeichen wie die Hutbreite: eine Spore ist kein Hut. -->
      <ellipse cx="12" cy="12" rx="8" ry="4.5" transform="rotate(-30 12 12)" />
      <path d="M4.3 14.6 5.9 17.4M18.1 6.6 19.7 9.4" />
    }
    @case ('wandelt') {
      <path d="M5 12h13M13.5 7.5 18 12l-4.5 4.5" />
    }
    @case ('dauer') {
      <!-- Sanduhr: wie lange es dauert, bis die Farbe umschlägt. -->
      <path d="M7 4h10M7 20h10M8 4c0 4 4 5 4 8s-4 4-4 8M16 4c0 4-4 5-4 8s4 4 4 8" />
    }
  }
</svg>
