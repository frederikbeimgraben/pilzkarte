@if (from().length) {
  <app-colour-field [colours]="from()" [label]="fromLabel()" />
}
@if (changes()) {
  <app-svg-icon name="wandelt" [size]="17" [label]="arrowLabel()" />
  <app-colour-field [colours]="to()" [label]="toLabel()" />
}
<span class="change__speed">
  <app-svg-icon name="dauer" [size]="14" />
  {{ duration() }}
</span>
