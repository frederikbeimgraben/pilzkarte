@if (from().length) {
  <app-colour-field class="change__from" [colours]="from()" [label]="fromLabel()" />
}
@if (changes()) {
  <app-svg-icon class="change__arrow" name="wandelt" [size]="arrowSize()" [label]="arrowLabel()" />
}
@if (to().length) {
  <app-colour-field class="change__to" [colours]="to()" [label]="toLabel()" />
}
<span class="change__speed">
  <app-svg-icon name="dauer" [size]="hourglassSize()" />
  {{ duration() }}
</span>
