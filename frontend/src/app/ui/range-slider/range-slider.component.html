<div class="rangeslider">
  <span class="rangeslider__track"></span>
  <span
    class="rangeslider__chosen"
    [style.inset-inline-start]="fromShare()"
    [style.inset-inline-end]="'calc(100% - ' + toShare() + ')'"
  ></span>
  @if (showsFrom()) {
    <input
      class="rangeslider__handle"
      type="range"
      [attr.aria-label]="text('schieber.untereGrenze')"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="von()"
      (input)="beiVon($event)"
    />
  }
  @if (showsTo()) {
    <input
      class="rangeslider__handle"
      type="range"
      [attr.aria-label]="text('schieber.obereGrenze')"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="bis()"
      (input)="beiBis($event)"
    />
  }
</div>
