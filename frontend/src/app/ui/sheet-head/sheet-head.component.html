<div class="head">
  <div class="head__row">
    <p class="head__title">
      @if (titleAsLink()) {
        <button class="head__species head__species--link" type="button" (click)="titleClick.emit()">
          {{ titel() }}
        </button>
      } @else {
        <span class="head__species">{{ titel() }}</span>
      }
      @if (woche()) {
        <span class="head__divider" aria-hidden="true">·</span>
        <span class="head__week">{{ woche() }}</span>
      }
      @if (hint()) {
        <span class="head__hint">{{ hint() }}</span>
      }
    </p>
    @if (arrows()) {
      <div class="head__arrows">
        <button
          class="head__arrow"
          type="button"
          [attr.aria-label]="text('zeitleiste.zurueck')"
          (click)="back.emit()"
        >
          <app-svg-icon name="links" [size]="12" />
        </button>
        <button
          class="head__arrow"
          type="button"
          [attr.aria-label]="text('zeitleiste.abspielen')"
          (click)="playback.emit()"
        >
          <app-svg-icon name="abspielen" [size]="12" />
        </button>
        <button
          class="head__arrow"
          type="button"
          [attr.aria-label]="text('zeitleiste.vor')"
          (click)="vor.emit()"
        >
          <app-svg-icon name="rechts" [size]="12" />
        </button>
      </div>
    }
  </div>
  <div class="head__bar"><ng-content /></div>
</div>
