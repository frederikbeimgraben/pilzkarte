<div class="chips" [class.chips--back]="zurueckMoeglich()" [class.chips--next]="vorMoeglich()">
  @if (zurueckMoeglich()) {
    <button
      class="chips__button chips__button--back"
      type="button"
      [attr.aria-label]="backText()"
      (click)="schiebe(-1)"
    >
      <app-svg-icon name="zurueck" [size]="16" />
    </button>
  }
  <div #series class="chips__row" role="group" [attr.aria-label]="label()" (scroll)="validate()">
    @for (chip of chips(); track chip.value) {
      <button
        class="chip"
        type="button"
        [class.chip--active]="chip.value === value()"
        [attr.aria-pressed]="chip.value === value()"
        (click)="valueChange.emit(chip.value)"
      >
        {{ chip.label }}
      </button>
    }
  </div>
  @if (vorMoeglich()) {
    <button
      class="chips__button chips__button--next"
      type="button"
      [attr.aria-label]="vorText()"
      (click)="schiebe(1)"
    >
      <app-svg-icon name="vor" [size]="16" />
    </button>
  }
</div>
