<div class="ebenen" role="group" [attr.aria-label]="beschriftung()">
  @for (gruppe of gruppen(); track gruppe.titel) {
    <h3 class="ebenen__gruppe">{{ gruppe.titel | t }}</h3>
    @for (ebene of gruppe.ebenen; track ebene.id) {
      <app-list-row
        class="ebenen__zeile"
        [class.ebenen__zeile--aktiv]="ebene.id === gewaehlt()"
        [titel]="ebene.label"
        [wert]="ebene.einheit"
        [anklickbar]="true"
        [gewaehlt]="ebene.id === gewaehlt()"
        (auswahl)="auswahl.emit(ebene)"
      />
    }
  }
</div>
