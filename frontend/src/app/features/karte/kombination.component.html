<app-segmented
  [optionen]="regeln()"
  [wert]="regel()"
  [beschriftung]="'kombination.regel' | t"
  (wertChange)="setzeRegel($event)"
/>

<app-note variante="unter">{{ hinweis() }}</app-note>

@if (zeilen().length > 0) {
  <div class="kombination__faktoren" role="group" [attr.aria-label]="'kombination.faktoren' | t">
    @for (zeile of zeilen(); track zeile.faktor.quelle) {
      <app-factor-row
        [name]="zeile.name"
        [unter]="zeile.unter"
        [bedingung]="zeile.bedingung"
        [aktiv]="zeile.faktor.aktiv"
        (aktivChange)="aktivChange.emit({ faktor: zeile.faktor, aktiv: $event })"
        (bedingungKlick)="faktorOeffnen.emit(zeile.faktor)"
      />
    }
  </div>
} @else {
  <app-note>{{ 'kombination.leer' | t }}</app-note>
}

<app-action-bar
  class="kombination__fuss"
  [haupt]="'kombination.speichern' | t"
  [hauptDeaktiviert]="true"
  [unter]="'kombination.speichernSpaeter' | t"
  [sekundaer]="'kombination.hinzufuegen' | t"
  (sekundaerKlick)="hinzufuegen.emit()"
/>
