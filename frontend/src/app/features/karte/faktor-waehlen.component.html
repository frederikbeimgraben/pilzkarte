<app-sheet [beschriftung]="'faktor.hinzufuegen' | t" [raste]="2" [modal]="true">
  <div class="waehlen" role="group" [attr.aria-label]="'faktor.hinzufuegen' | t">
    @for (gruppe of gruppen(); track gruppe.titel) {
      <h3 class="waehlen__gruppe">{{ gruppe.titel | t }}</h3>
      @for (ebene of gruppe.ebenen; track ebene.id) {
        <app-list-row
          [titel]="ebene.label"
          [unter]="unter(ebene)"
          [wert]="ebene.einheit"
          [anklickbar]="!vergeben().has(ebene.id)"
          [class.waehlen__zeile--aus]="vergeben().has(ebene.id)"
          (auswahl)="auswahl.emit(ebene)"
        />
      }
    }
  </div>
  <app-action-bar [sekundaer]="'faktor.abbrechen' | t" (sekundaerKlick)="schliessen.emit()" />
</app-sheet>
