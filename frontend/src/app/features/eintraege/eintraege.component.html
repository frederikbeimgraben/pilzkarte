<app-page-header [titel]="'eintraege.titel' | t">
  <app-button variant="primary" (click)="eintragen()">
    <app-svg-icon name="plus" [groesse]="16" />
    {{ 'eintragen.knopf' | t }}
  </app-button>
</app-page-header>
<div class="eintraege">
  <app-chip-group
    [chips]="chips()"
    [wert]="chip()"
    [beschriftung]="'eintraege.filter' | t"
    (wertChange)="waehleChip($event)"
  />
  @if (zeilen().length === 0) {
    <div class="eintraege__leer">
      <app-note>{{ leerText() | t }}</app-note>
      @if (braucheAnmeldung()) {
        <app-button variant="primary" (click)="anmelden()">{{ 'konto.anmelden' | t }}</app-button>
      }
    </div>
  } @else {
    <app-card class="randlos">
      @for (zeile of zeilen(); track zeile.schluessel) {
        <app-list-row
          [titel]="zeile.titel"
          [unter]="zeile.unter"
          [notiz]="zeile.notiz"
          [anklickbar]="zeile.objekt !== null"
          (auswahl)="oeffne(zeile)"
        >
          <span vorn class="eintraege__punkt" [style.background]="zeile.farbe"></span>
          @if (zeile.marke; as marke) {
            <app-badge hinten [variant]="marke.variant">{{ marke.text }}</app-badge>
          }
        </app-list-row>
      }
    </app-card>
  }
</div>
