<div class="artwahl">
  <app-form-field
    icon="suche"
    [label]="'melden.artSuche' | t"
    [labelVerstecken]="true"
    [platzhalter]="'melden.artSuche' | t"
    [wert]="suche()"
    (wertChange)="suche.set($event)"
  />
  <div class="artwahl__liste" role="list" [attr.aria-label]="'melden.artWaehlen' | t">
    @for (art of treffer(); track art.slug) {
      <app-list-row
        role="listitem"
        [titel]="art.name"
        [unter]="art.lateinisch"
        [anklickbar]="true"
        [wert]="art.slug === gewaehlt() ? ('melden.gewaehlt' | t) : ''"
        (auswahl)="auswahl.emit(art)"
      />
    }
    @if (treffer().length === 0) {
      <p class="empty-state">{{ 'arten.leer' | t }}</p>
    }
  </div>
</div>
