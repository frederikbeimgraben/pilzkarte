<div class="layers" role="group" [attr.aria-label]="label()">
  @for (gruppe of groups(); track gruppe.titel) {
    <h3 class="layers__group">{{ gruppe.titel | t }}</h3>
    @for (layer of gruppe.layers; track layer.id) {
      <app-list-row
        class="layers__row"
        [class.layers__row--active]="layer.id === selected()"
        [titel]="layer.label"
        [value]="layer.unit"
        [clickable]="true"
        [selected]="layer.id === selected()"
        (chosen)="chosen.emit(layer)"
      />
    }
  }
</div>
