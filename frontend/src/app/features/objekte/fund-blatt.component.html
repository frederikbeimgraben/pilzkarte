@if (bearbeitet()) {
  <app-fund-formular
    [ort]="ort()"
    [start]="fund()"
    [mitFotos]="false"
    [titel]="'fund.bearbeiten' | t"
    [hauptText]="'eintragen.speichern' | t"
    [beschaeftigt]="beschaeftigt()"
    (absenden)="speichere($event)"
    (abbruch)="bearbeitet.set(false)"
  />
} @else {
  <div class="fundblatt">
    <div>
      <div class="fundblatt__kopf">
        <h2 class="fundblatt__titel">{{ artName() }}</h2>
        @if (geteilt()) {
          <app-badge variant="success">{{ 'eintraege.badge.geteilt' | t }}</app-badge>
        }
      </div>
      <p class="fundblatt__unter">{{ unterzeile() }}</p>
    </div>
    <app-foto-galerie [fundId]="fund().id" [fotos]="fund().fotos" />
    @if (fund().notiz) {
      <p class="fundblatt__notiz">{{ fund().notiz }}</p>
    }
    @if (wertText(); as wert) {
      <app-card class="randlos">
        <app-metric-row [beschriftung]="'fund.vorhersage' | t" [unter]="wertBezug()" [wert]="wert" />
      </app-card>
    }
  </div>
  <app-action-bar
    hauptIcon="karte"
    [haupt]="'fund.aufDerKarte' | t"
    [sekundaer]="'fund.bearbeiten' | t"
    [gefahr]="'fund.loeschen' | t"
    (hauptKlick)="zeigeAufKarte.emit(ort())"
    (sekundaerKlick)="bearbeitet.set(true)"
    (gefahrKlick)="loeschFrage.set(true)"
  />
}
<app-dialog
  [open]="loeschFrage()"
  [title]="'fund.loeschenFrage' | t"
  [closeLabel]="'objekt.schliessen' | t"
  (closed)="loeschFrage.set(false)"
>
  <app-note>{{ 'fund.loeschenText' | t }}</app-note>
  <div dialog-footer class="fundblatt__dialogfuss">
    <app-action-bar
      [gefahr]="'objekt.loeschen' | t"
      [sekundaer]="'objekt.abbrechen' | t"
      (gefahrKlick)="loesche()"
      (sekundaerKlick)="loeschFrage.set(false)"
    />
  </div>
</app-dialog>
