<div class="objektblatt">
  <div class="objektblatt__kopf">
    <h2 class="objektblatt__titel">{{ zone().name }}</h2>
    <p class="objektblatt__unter">{{ unterzeile() }}</p>
  </div>
  @if (bearbeitetEcken()) {
    <app-note>{{ 'zone.eckpunkteHinweis' | t }}</app-note>
  } @else {
    @if (vorhersageZeile(); as zeile) {
      <app-card class="randlos">
        <app-key-value-table>
          <app-metric-row
            [beschriftung]="zeile.beschriftung"
            [unter]="'zone.vorhersageUnter' | t"
            [wert]="zeile.wert"
          />
          <app-metric-row
            [beschriftung]="'zone.funde' | t"
            [unter]="'zone.fundeUnter' | t"
            [wert]="zeile.funde"
          />
        </app-key-value-table>
      </app-card>
    } @else {
      <app-note>{{ 'zone.wertFehlt' | t }}</app-note>
    }
    <app-objekt-formular
      [ohneName]="true"
      [start]="start()"
      [nameLabel]="'zone.name' | t"
      [namePlatzhalter]="'zone.namePlatzhalter' | t"
      [nameFehltText]="'zone.nameFehlt' | t"
    />
  }
</div>
@if (bearbeitetEcken()) {
  <app-action-bar
    [haupt]="'zone.eckpunkteFertig' | t"
    [geist]="'objekt.abbrechen' | t"
    (hauptKlick)="uebernimmEcken()"
    (geistKlick)="brichEckenAb()"
  />
} @else {
  <app-action-bar
    [haupt]="'eintragen.speichern' | t"
    [hauptDeaktiviert]="beschaeftigt()"
    [sekundaer]="'zone.eckpunkteBearbeiten' | t"
    [gefahr]="'zone.loeschen' | t"
    (hauptKlick)="speichere()"
    (sekundaerKlick)="bearbeiteEcken()"
    (gefahrKlick)="loeschFrage.set(true)"
  />
}
<app-dialog
  [open]="loeschFrage()"
  [title]="'zone.loeschenFrage' | t"
  [closeLabel]="'objekt.schliessen' | t"
  (closed)="loeschFrage.set(false)"
>
  <app-note>{{ 'zone.loeschenText' | t }}</app-note>
  <div dialog-footer class="objektblatt__dialogfuss">
    <app-action-bar
      [gefahr]="'objekt.loeschen' | t"
      [sekundaer]="'objekt.abbrechen' | t"
      (gefahrKlick)="loesche()"
      (sekundaerKlick)="loeschFrage.set(false)"
    />
  </div>
</app-dialog>
