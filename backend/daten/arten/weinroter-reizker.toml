milch = "Blutrot bis weinrot, nach etwa 20 Minuten grün verfärbend."
stiel = "Auf weinrotem Grund weißlich bereift, wasserfleckig und mit Grübchen. Innen wattig, später hohl, bei Verletzung rötend."
fleisch = "Blassbeige, hellorange bis cremegelb, fest, brüchig."
geruch = "Angenehm pilzig, dabei etwas obstartig."
geschmack = "Mild, leicht schärflich."
sporenpulver = "Hell ockergelb."
vorkommen = "Symbiosepilz, wie alle Reizker nur bei Nadelholz, hier bei Kiefer. Häufiger im Mittelmeerraum, bei uns sehr selten."
zeit = "Sommer bis Spätherbst."

