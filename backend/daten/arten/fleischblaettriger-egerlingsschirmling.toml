[merkmale]
hut = "3 bis 11, selten bis 14 cm breit, schmutzig weiß, cremefarben bis sehr hellbraun oder ockerbraun, seidig, jung matt. Beim Aufschirmen reißt die Huthaut schuppenartig in feine bräunliche Felder auf und fleckt gelbbräunlich. Rand meist heller und nur jung überhängend, alt nach oben gebogen, Mitte teils leicht gebuckelt."
lamellen = "Weiß bis gelb oder gelbbraun, im Alter leicht rosa bis orangerot, frei, dicht, unregelmäßig untermischt und bauchig."
stiel = "Weiß, cremeweiß bis gelb, hohl, Basis knollig verdickt. Ring schmal und häutig, nach oben abziehbar. Die Spitze lässt sich leicht vom Hutfleisch trennen."
fleisch = "Gelb, im Hut heller bis weißlich."
geruch = "Neutral bis angenehm pilzig."
geschmack = "Mild."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer in Parks, Gärten und Wäldern, auf Wiesen und an Gebüschrändern, gern an lichten sonnigen Stellen auf kalkreichem Boden. Sehr selten."
zeit = "Frühling bis Spätherbst."

