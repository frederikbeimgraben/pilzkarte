stiel = "Mit rötlicher, rotbrauner bis dunkelbrauner Netzzeichnung. Jung nur im oberen Bereich genetzt, im Alter verschiebt sich das Netz in die Mitte und nach unten."
fleisch = "Gelb, sofort schwarzblau verfärbend. In der Stielbasis rötlich, das Stielfleisch stark weinrot, bisweilen auch im Hut."
geruch = "Angenehm pilzig."
geschmack = "Mild."
sporenpulver = "Goldgelb bis olivgelb."
vorkommen = "Symbiosepilz in Laubwäldern und Parkanlagen, wärmeliebend. Zum Boden gibt es widersprüchliche Angaben, teils kalkhaltig, teils sauer."
zeit = "Frühling bis Spätherbst."

