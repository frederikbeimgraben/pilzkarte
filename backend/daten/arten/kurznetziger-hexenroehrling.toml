hut = "3 bis 15, selten bis 22 cm breit, dunkelbraun, weinrot, olivbraun oder graubraun, samtig und klebrig. Zwischen Hutfleisch und Röhren liegt eine rote Zone, ein gutes Erkennungsmerkmal."
