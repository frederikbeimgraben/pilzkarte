name = "Kiefernsteinpilz"
lateinisch = "Boletus pinophilus"
gruppe = "roehrling"
speisewert = "speisepilz"
geschuetzt = true
jahreszeiten = ["fruehling", "herbst"]
baeume = ["kiefer", "fichte"]
schutzHinweis = "Die Verordnung nennt Boletus edulis und Boletus aereus. Diese App behandelt die nahen Verwandten gleich, weil sie im Wald kaum zu trennen sind."

[merkmale]
hut = "8 bis 20 cm, dunkel rotbraun bis kupferfarben, oft höckerig und leicht bereift."
roehren = "Weiß, dann gelblich bis oliv, am Stiel ausgebuchtet."
stiel = "Dick, bauchig, rötlich überhaucht, mit rotbraunem Netz im oberen Teil."
fleisch = "Weiß, fest, unter der Huthaut weinrötlich."
geruch = "Angenehm pilzig."
geschmack = "Mild, nussig."
sporenpulver = "Olivbraun."
vorkommen = "Mykorrhiza mit Kiefer, seltener Fichte, auf sauren Sandböden und in Bergwäldern."
zeit = "Mai bis Juni und wieder September bis Oktober."

[[verwechslungen]]
name = "Gallenröhrling"
merkmal = "Röhren jung weiß, bald rosa. Netz am Stiel dunkel und grob. Schon ein Krümel schmeckt bitter."
essbar = "ungeniessbar"

[[verwechslungen]]
name = "Steinpilz"
merkmal = "Hut heller und gleichmäßiger braun, Netz weiß statt rotbraun."
essbar = "speisepilz"

