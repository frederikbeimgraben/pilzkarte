[merkmale]
hut = "4 bis 25, selten bis 30 cm breit, rotbraun, weinrot bis purpurbraun, der Rand lange eingerollt und meist heller. Jung halbkugelig, knubbelig runzelig, weißlich grau bereift und feinsamtig, später polsterförmig, kahler und meist uneben bis grubig. Bei feuchtem Wetter leicht klebrig."
roehren = "Zuerst weißlich bis schmutzig gelblich, später olivgrün, am Stiel ausgebuchtet angewachsen. Auf Druck ohne Verfärbung."
stiel = "5 bis 15 cm lang und bis 6 cm dick, bräunlich, hellbraun, rotbräunlich bis nussbraun, mit weißem Netz. Jung dickbäuchig knollig und oft fast so breit wie lang, später etwas gestreckt, an der Basis meist dicklich."
fleisch = "Weiß, nicht verfärbend, unter der Huthaut mit einer kurzen rotbräunlichen Zone."
geruch = "Angenehm, etwas pilzig."
geschmack = "Mild, nussig und typisch steinpilzartig."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz meist bei Kiefer, nur gelegentlich bei Weißtanne und Fichte. Wo die Wälder mit Stickstoff gedüngt wurden, fehlt er fast ganz."
zeit = "Frühsommer bis Spätherbst."

[[verwechslungen]]
