unterschied = "Hut hell lederbraun bis milchkaffeebraun, Fleisch unter der Huthaut weiß ohne Rottöne, Netz am Stiel stark erhaben."

[[verwechslungen]]
slug = "steinpilz"
unterschied = "Hut wildlederbraun bis haselnussbraun statt rotbraun, Rand weiß, Netz am Stiel weiß und erst im Alter bräunlich."
eigenerUnterschied = "Hut rotbraun, weinrot bis purpurbraun, Stiel nuss- bis rotbräunlich."

