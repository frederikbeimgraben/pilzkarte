hut = "2,5 bis 8, selten bis 10 cm breit, orangebraun, filzig schuppig, feucht schmierig, jung mit Schleier. Der Rand ist lange eingerollt und meist mit Velumresten behaftet. Eine Varietät hat eine abstehend wollig filzige Oberfläche."
lamellen = "Gelborange bis rotbraun, etwas herablaufend, aber weniger weit als beim Kupferroten Gelbfuß, dicklich, entfernt stehend, weich und leicht ablösbar."
stiel = "6 bis 8, selten bis 12 cm hoch, 0,6 bis 1,5, selten bis 2 cm dick, lebhaft orangegelb, bei Verletzung rötend, voll und fest, sehr lang gezogen und tief im Moos steckend."
