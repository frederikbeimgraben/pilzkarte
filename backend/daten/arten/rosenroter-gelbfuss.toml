geruch = "Neutral."
geschmack = "Mild."
sporenpulver = "Dunkelbraun bis schwarzbraun."
vorkommen = "Bei Kiefer auf sandigem, saurem Boden. Wächst parasitisch auf dem Myzel des Kuhröhrlings. Selten."
zeit = "Sommer bis Herbst."

