geschmack = "Ranzig mehlig, mild, leicht erdig."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz mit verschiedenen Sträuchern, im Mischwald, auf Wiesen sowie in Parks und Gärten. Sehr selten."
zeit = "Frühsommer bis Spätherbst."

