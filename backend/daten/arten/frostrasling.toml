lamellen = "Weißlich bis grau, im Alter aschgrau, breit angewachsen, abtrennbar, manchmal aderig verbunden."
stiel = "Weißlich bis blassbraun, längsfaserig, Spitze bereift. Die Stiele stehen meist einzeln nebeneinander und stecken tief in der Erde."
fleisch = "Weißlich bis hellgrau, fest, zäh und elastisch, im Hut dickfleischig."
geruch = "Neutral."
geschmack = "Mild, etwas bitterlich."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer auf Wegen, an Wegrändern und in Parks, gern an Distelwurzeln. Meist büschelig aus einem Strunk."
zeit = "Spätsommer bis Spätherbst."

