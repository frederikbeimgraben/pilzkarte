[merkmale]
hut = "4 bis 17, selten bis 21 cm breit, rotbraun, ziegelfarben bis rot, feinfilzig. Die Huthaut ist meist verkürzt, anders als bei der fast gleichen Espenrotkappe mit ihrer über die Röhren eingerollten Huthaut."
roehren = "Weißlich, grauweiß bis gelbbraun, später bräunlich, am Stiel stark ausgebuchtet angewachsen."
stiel = "6 bis 20, selten bis 22 cm hoch und 1 bis 4, selten bis 5 cm dick, mit rötlichen bis rotgrauen Schüppchen auf weißem Grund, nicht mit schwärzlichen wie bei der Birkenrotkappe."
fleisch = "Weiß, im Schnitt etwas rötlich bis rosalila."
geruch = "Pilzig."
geschmack = "Mild und angenehm."
sporenpulver = "Gelbbraun."
vorkommen = "Symbiosepilz im Laubwald, überwiegend bei Eiche, selten bei Buche, Hasel und anderen Laubbäumen. Selten, in der Schweiz gefährdet."
zeit = "Sommer bis Herbst."

