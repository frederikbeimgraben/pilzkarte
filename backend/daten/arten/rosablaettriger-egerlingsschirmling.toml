[merkmale]
hut = "3 bis 11, selten bis 15 cm breit, weiß bis cremefarben, seidig, Rand überhängend. Scheibe im Alter oft blassocker und stumpf gebuckelt."
lamellen = "Weiß, später blass fleischfarben, alt rosa, frei, dicht stehend, Schneiden heller und fein gezahnt."
stiel = "6 bis 7, selten bis 9 cm lang, 1 bis 2, selten bis 2,5 cm dick, cremeweiß, von der Basis her hohl werdend, Basis knollig verdickt, aber nie in einer Scheide. Ring weiß, schmal häutig, nach oben abziehbar."
fleisch = "Weiß, in der Hutmitte dick, zum Rand dünner, nicht gilbend."
geruch = "Neutral bis angenehm pilzartig."
geschmack = "Mild."
sporenpulver = "Zuerst weiß, im Abwurf am nächsten Tag rosa."
vorkommen = "Folgezersetzer in Parks, Gärten, Wäldern und auf Wiesen, oft zwischen Wiesenchampignons."
zeit = "Frühling bis Spätherbst."

