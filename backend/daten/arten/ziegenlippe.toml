name = "Ziegenlippe"
lateinisch = "Xerocomus subtomentosus"
gruppe = "roehrling"
speisewert = "essbar"
geschuetzt = false
jahreszeiten = ["sommer", "herbst"]
baeume = ["buche", "eiche", "fichte"]

[merkmale]
hut = "4 bis 12 cm, ocker- bis olivbraun, trocken und samtig wie Wildleder."
roehren = "Leuchtend gelb, weit und eckig, auf Druck kaum blauend."
stiel = "Gelbbraun, längsfaserig, oben oft mit groben Rippen."
fleisch = "Weißlich bis blassgelb, im Schnitt allenfalls schwach blauend."
geruch = "Unauffällig."
geschmack = "Mild."
sporenpulver = "Olivbraun."
vorkommen = "Mykorrhiza mit Laub- und Nadelbäumen, gern an moosigen Wegrändern."
zeit = "Juni bis Oktober."

[[verwechslungen]]
name = "Rotfußröhrling"
merkmal = "Hut felderig rissig mit rotem Fleisch in den Rissen, Stiel rot gefasert."
essbar = "essbar"

