sporenpulver = "Weiß bis hell cremefarben."
vorkommen = "Folgezersetzer auf Komposthaufen und wärmeerzeugendem Substrat, häufiger in Gewächshäusern sowie in wind- und kältegeschützten Gartenanlagen. Im Wald selten und dann bei Kompostablagerungen."
zeit = "Sommer bis Herbst."

