[merkmale]
hut = "4 bis 20, selten bis 25 cm breit, dunkelbraun, teils gelb gescheckt oder mit olivem Ton, samtig, feucht leicht klebrig. Halbkugelig bis polsterförmig. Nach Schneckenfraß erscheint darunter Rötliches."
roehren = "Röhrenmündungen rot, Röhrenboden gelb, am Stiel ausgebuchtet angewachsen. Ganz junge Pilze können noch gelbe Röhren haben."
stiel = "5 bis 15 cm lang, 2 bis 5 cm dick, mit rötlichen Flöckchen auf gelbem Grund, ohne Netz."
fleisch = "Gelb, im Schnitt sofort schwarzblau, nach Stunden graugelb."
geruch = "Angenehm pilzartig."
geschmack = "Mild."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz im Mischwald, gern bei Fichte und Buche, auf saurem Boden. Meist sehr häufig."
zeit = "Frühling bis Spätherbst, oft schon ab April."

