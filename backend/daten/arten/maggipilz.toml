speisewertHinweis = "In größeren Mengen verursacht er heftige Magen-Darm-Störungen. Erkennbar am Geruch nach Maggi oder Liebstöckel und an der glasklaren, milden Milch. Früher als Würzpilz benutzt, heute besser stehen lassen."

