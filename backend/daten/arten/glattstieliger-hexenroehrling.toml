[merkmale]
hut = "5 bis 15, selten bis 25 cm breit, sehr verschieden gefärbt: braun, rötlich, kupfer-karminrot, lebhaft orange, rubin-, granat- bis braunrot, aber ohne Olivton. Samtig, alt kahl, auf Druck blauend."
roehren = "Gelblich, rötlich, orange bis orangerot, im Alter olivgrünlich. Mündungen jung orange, alt gelblich, auf Druck sofort blauend."
stiel = "4 bis 8, selten bis 10 cm lang und 1 bis 3, selten bis 3,5 cm dick. Hellgelb bis zitronengelb, zur Basis stärker rötlich bis tiefrot oder schwarzrot, rillig-labyrinthisch, ohne Netz, bei Berührung schnell blauend."
fleisch = "Hellgelb bis zitronengelb, schnell stark blauend, in der Basis rötlich. Nach einigen Stunden verschwindet das Blau und es bleibt ein gelblicher Ton."
geruch = "Angenehm pilzig bis unbedeutend."
geschmack = "Mild, roh giftig."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz im Laubwald, gern bei Eiche und Buche. Selten."
zeit = "Sommer bis Herbst."

