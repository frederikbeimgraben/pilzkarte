[merkmale]
hut = "4 bis 10, selten bis 15 cm breit, mit braunen bis kastanienbraunen, sternförmig auseinanderlaufenden Schuppen auf weißlichem Grund. Mitte schwarzbraun und gebuckelt, jung in Paukenschlägerform."
lamellen = "Weißlich bis cremefarben, bei Sporenreife oft rosa überhaucht oder rosa gefleckt, gedrängt stehend, frei, weich."
stiel = "5 bis 25, selten bis 35 cm lang, 1 bis 6, selten bis 8 cm dick, fein braun genattert auf hellem Grund, später dunkelbraun bis rotbraun, Basis heller und zwiebelknollig, faserig-zäh. Ring oben weißlich, unten bräunlich, mit doppeltem Rand, am Stiel verschiebbar."
fleisch = "Weiß, rötet nie; an Schneckenfraßstellen und in der Stielrinde teils leichtes Röten."
geruch = "Unbedeutend bis neutral, mitunter leicht fruchtig."
geschmack = "Mild, leicht säuerlich."
sporenpulver = "Blass rosa."
vorkommen = "Folgezersetzer in Wäldern, Parks, auf Wiesen, in Gärten und Heiden sowie am Waldrand."
zeit = "Frühsommer bis Spätherbst."

