[merkmale]
hut = "5 bis 20, selten bis 25 cm breit, bräunlich, feinfilzig, später kahl. In der Mitte ein Buckel, der oft nur mit den Fingern zu ertasten ist. Rand jung weit eingerollt und gekrempelt, alt unregelmäßig wellig."
lamellen = "Weiß bis cremefarben, herablaufend, eng stehend."
stiel = "6 bis 15, selten bis 17 cm lang, 1 bis 3, selten bis 4 cm dick, bräunlich wie der Hut, Basis keulig verdickt."
fleisch = "Weißlich bis cremefarben, in der Hutmitte dick, in der Stielrinde bräunlich, außen ziemlich hart und innen weich, im Alter wässrig und zäh faserig."
geruch = "Süßlich, etwas nach Lavendel, teils stechend alkalisch wie Bittermandel. Im Alter muffig mehlartig."
geschmack = "Mild, jung nach längerem Kauen etwas bitterlich."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer im Mischwald, gern auf kalkreichem Boden, oft in Hexenringen. Häufig."
zeit = "Sommer bis Spätherbst."

