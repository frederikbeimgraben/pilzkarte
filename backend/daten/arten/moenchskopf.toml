name = "Mönchskopf"
lateinisch = "Infundibulicybe geotropa"
gruppe = "trichterling"
speisewert = "essbar"
geschuetzt = false
jahreszeiten = ["herbst"]
baeume = ["buche", "fichte"]
speisewertHinweis = "Nur die Hüte, die Stiele sind zäh."

[merkmale]
hut = "8 bis 20 cm, blass lederfarben bis ockerbraun, tief trichterig mit einem stumpfen Buckel in der Mitte."
lamellen = "Cremeweiß, dicht, weit am Stiel herablaufend."
stiel = "Lang, kräftig, keulig verdickt, in Hutfarbe."
fleisch = "Weiß, zäh und faserig, besonders im Stiel."
geruch = "Angenehm, schwach süßlich."
geschmack = "Mild."
sporenpulver = "Weiß."
vorkommen = "Zersetzer in Laub- und Nadelwäldern, an Waldrändern und Hecken, in großen Hexenringen."
zeit = "September bis November."

[[verwechslungen]]
name = "Bleiweißer Trichterling"
merkmal = "Deutlich kleiner, rein weiß, ohne Buckel."
essbar = "giftig"

[[verwechslungen]]
name = "Nebelkappe"
merkmal = "Hut grau, Lamellen kaum herablaufend, Geruch süßlich dumpf."
