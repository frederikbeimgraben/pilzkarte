sporenpulver = "Weiß bis farblos."
vorkommen = "Folgezersetzer an Laubholzästen, gern in Auwäldern bei Erle, Weide und Espe, seltener Linde. Gern auf sandigem, kalkreichem Boden."
zeit = "Winter bis Mai."

