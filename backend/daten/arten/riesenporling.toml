[merkmale]
hut = "4 bis 30, selten bis 200 cm breit, jung fast weiß, später hell- bis gelbbraun, zuletzt mit vielen kleinen braunen flachen Schuppen, fein samtig bis kahl, oft radial gestreift und konzentrisch gezont. Die fächerförmigen Hüte überlappen sich und wachsen aus einem gemeinsamen Strunk. Ganz jung färben sich Druckstellen sofort braunschwarz."
poren = "Weißlich bis gelblich, eckig, herablaufend, auf Druck schwärzend. Röhren bis 8 mm tief."
stiel = "Verbogen, gern seitlich angesetzt, Basis weißlich und bräunlich getupft."
fleisch = "Weiß bis leicht gelblich, weich, im Schnitt langsam braunschwarz verfärbend."
geruch = "Pilzig, angenehm."
geschmack = "Jung mild, später scharf und bitter."
sporenpulver = "Weiß bis cremeweiß."
vorkommen = "Folgezersetzer im Mischwald, im Nadelwald gern an Weißtanne, im Laubwald an Buchenstümpfen."
zeit = "Sommer bis Herbst."

