[masse]
hutBreiteCm = { von = 4.0, bis = 8.0, seltenBis = 10.0 }
sporenLaengeUm = { von = 4.4, bis = 6.5 }
sporenBreiteUm = { von = 2.9, bis = 4.3 }

[merkmale]
hut = "4 bis 8, selten bis 10 cm breit, Grundfarbe weiß bis gelb, mit braunen Schuppen von hellbräunlich über rot- bis dunkelbraun. Zum Rand hin werden die Schuppen meist größer und stehen weiter auseinander."
lamellen = "Jung cremegrau, später blassrosa, graurosa bis graubraun, im Alter braun, frei und sehr gedrängt."
stiel = "Weißlich bis rosa, vom Rand ausgehend rötlich verfärbend, die Spitze löst sich leicht vom Hutfleisch. Ring weiß, 1 bis 2 cm breit, dünnhäutig und hängend, oft mit doppelter Randzone, nach oben abziehbar, oberseits schwach gerieft."
fleisch = "Weiß, bei Verletzung gelborange, später blutrot verfärbend."
geruch = "Pilzig, angenehm, leicht fruchtig."
geschmack = "Mild, süßlich."
sporenpulver = "Dunkelbraun bis purpurbraun."
vorkommen = "Folgezersetzer im sauren Mischwald, meist Nadelwald, auf Nadelstreu."
zeit = "Frühsommer bis Spätherbst."

[[verwechslungen]]
