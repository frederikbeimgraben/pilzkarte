speisewertHinweis = "Nicht roh essen, roh ist er möglicherweise unverträglich. Durchgaren, und früh sammeln, denn er wird schnell madig. Riecht ein Champignon nach Karbol, Tinte oder Fisch, oder gilbt er an der Stielbasis ohne Anisgeruch, bleibt er stehen."
