unterschied = "Größer, Hut ockerbräunlich bis dunkelbraun mit rostbraunen Fasern, Lamellen rosa, im Alter dunkel rotbraun, Ring doppelrandig."

[[verwechslungen]]
slug = "kompostegerling"
unterschied = "Größer, Hut braun bis gelbbraun und breitschuppig, Lamellen später lilabraun bis schwarzbraun, Stiel rotbraun auf hellem Grund."

