name = "Netzstieliger Hexenröhrling"
lateinisch = "Suillellus luridus"
gruppe = "roehrling"
speisewert = "bedingtEssbar"
geschuetzt = false
jahreszeiten = ["sommer", "herbst"]
baeume = ["eiche", "buche", "linde"]
karte = "hexen_netz"
speisewertHinweis = "Roh giftig. Gut durchgaren und nicht mit Alkohol zusammen essen."

[merkmale]
hut = "5 bis 20 cm, oliv- bis graubraun, oft mit rötlichem Ton, matt und feinfilzig."
roehren = "Röhren gelb, Mündungen orange bis rot. Über den Röhren liegt im Schnitt eine rote Linie."
stiel = "Gelb bis rötlich, mit grobem rotem Netz über die ganze Länge."
fleisch = "Gelb, im Schnitt kräftig blauend."
geruch = "Angenehm pilzig."
geschmack = "Mild. Roh nicht kosten."
sporenpulver = "Olivbraun."
vorkommen = "Kalkliebend, bei Eiche, Buche und Linde, auch in Parks und Alleen."
zeit = "Mai bis Oktober, beginnt früh im Jahr."

[[verwechslungen]]
name = "Flockenstieliger Hexenröhrling"
merkmal = "Stiel geflockt statt genetzt, saure Böden."
essbar = "bedingtEssbar"

[[verwechslungen]]
name = "Satansröhrling"
merkmal = "Hut kreidig hellgrau, Stiel dick mit rotem Netz, Fleisch blaut. Auf Kalk unter Eiche und Buche."
essbar = "giftig"

