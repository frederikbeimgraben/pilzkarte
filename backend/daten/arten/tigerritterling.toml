[merkmale]
hut = "4 bis 11, selten bis 16 cm breit, weiß mit silbergrauen, graubraunen bis schwarzbraunen Schüppchen, Rand lange eingerollt."
lamellen = "Weißlich, später etwas gelblich, breit, mäßig dicht stehend, am Stiel ausgebuchtet angewachsen, Schneiden rissig, jung tränend, alt bräunend."
stiel = "5 bis 8, selten bis 9 cm lang, 1 bis 4, selten bis 5 cm dick, weißlich gelblich bis creme, Basis keulig, oft kupferrötlich gefleckt, fest und vollfleischig, Spitze gern mit Tröpfchen."
fleisch = "Weiß, sehr dick."
geruch = "Mehlartig."
geschmack = "Mild und mehlig, aber giftig."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz im Mischwald, meist Laubwald, selten Nadelwald, gern auf kalkreichem Boden, regional häufig."
zeit = "Sommer bis Spätherbst."

