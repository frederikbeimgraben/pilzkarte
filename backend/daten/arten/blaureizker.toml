[merkmale]
hut = "4 bis 9, selten bis 12 cm breit, orange, grauorange, graurosa, rosa-lehmfarben, ziegelfarben bis braunrot, dunkler und blaugrün gezont, oft weißlich bereift. Jung gewölbt und genabelt, später trichterförmig, Rand weißlich und lange eingebogen."
lamellen = "Orangeocker bis blassocker, herablaufend, später grünlich, weinrot bis violett verfärbend."
milch = "Orange, erst nach etwa 20 Minuten weinrötlich bis grünlich verfärbend."
stiel = "Außen blass lachsfarben bis rosagrau mit blass grünlichen Grübchen, innen weißlich bis blass cremefarben, wattig, später hohl."
fleisch = "Orangerot, gelblichbraun bis bräunlich weinrot, bei Verletzung korallen- bis orangerot, später grünlich, weinrötlich bis violett. Fest und brüchig."
geruch = "Angenehm pilzig."
geschmack = "Mild, etwas bitterlich."
sporenpulver = "Blass rosa-ockergelb."
vorkommen = "Symbiosepilz bei Kiefern auf saurem Boden. Sehr selten, in der Schweiz stark gefährdet."
zeit = "Sommer bis Spätherbst."

