vorkommen = "Folgezersetzer an lebenden und abgestorbenen Laubbäumen, vor allem Buche und Eiche, vereinzelt an Nadelholz. Wächst bis zehn Meter hoch am Stamm."
zeit = "Herbst bis Frühjahr. Er braucht einen Kältereiz und ist ab Mitte November häufig."

