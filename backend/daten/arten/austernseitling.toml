name = "Austernseitling"
lateinisch = "Pleurotus ostreatus"
gruppe = "seitling"
speisewert = "speisepilz"
geschuetzt = false
jahreszeiten = ["herbst", "winter"]
baeume = ["buche", "pappel", "weide"]

[merkmale]
hut = "5 bis 20 cm, muschel- bis austernförmig, grau, blaugrau bis braun, glatt."
lamellen = "Weiß bis cremefarben, weit am kurzen Stiel herablaufend."
stiel = "Kurz, seitlich angesetzt, an der Basis weißfilzig, oft fehlend."
fleisch = "Weiß, im Hut weich, am Ansatz zäh."
geruch = "Angenehm pilzig."
geschmack = "Mild."
sporenpulver = "Weißlich mit lila Ton."
vorkommen = "Zersetzer an geschwächtem Laubholz, vor allem Buche und Pappel, in dachig übereinanderstehenden Büscheln. Braucht einen Kältereiz."
zeit = "Oktober bis März."

[[verwechslungen]]
name = "Ohrförmiger Seitling"
merkmal = "Kleiner, zäh, an Nadelholz."
essbar = "ungeniessbar"

[[verwechslungen]]
name = "Grünblättriger Schwefelkopf"
merkmal = "Lamellen grünlich, Geschmack bitter, an Stümpfen."
essbar = "giftig"

