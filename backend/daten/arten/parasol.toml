[[verwechslungen]]
slug = "ackerschirmpilz"
unterschied = "Stiel ohne Natterung, von der Spitze bis zum Ring fein gerieft, auf Äckern, Wiesen und Brachflächen."
eigenerUnterschied = "Deutlich größer, Stiel mit dunkelbrauner Natterung."

[[verwechslungen]]
slug = "jungfernschirmling"
unterschied = "Stiel ohne Natterung, Lamellen gilben leicht, Fleisch rötet nicht. Im Nadelwald auf saurem Boden."
eigenerUnterschied = "Stiel mit dunkelbrauner Natterung, Hut bis 25, selten 30 cm breit, Geruch nussartig."

[[verwechslungen]]
slug = "safranschirmling"
unterschied = "Fleisch läuft bei Verletzung sofort rötlich an und wird später weinbraun, Stiel ohne Natterung, Basis mit gerandeter Knolle."
eigenerUnterschied = "Stiel deutlich dunkelbraun genattert, Fleisch rötet nicht, wächst im Wald."

[[verwechslungen]]
slug = "sternschuppiger-riesenschirmpilz"
unterschied = "Hutschuppen kastanienbraun und sternförmig auseinanderlaufend, Mitte schwarzbraun und gebuckelt."
eigenerUnterschied = "Hutschuppen weich und wollig, nicht sternförmig aufreißend, Sporenpulver weiß."

[[verwechslungen]]
slug = "zitzen-riesenschirmling"
unterschied = "Hut braunocker mit grob schollig abreißenden Schuppen und braunem Buckel, Natterung am Stiel nur schwach."
eigenerUnterschied = "Deutlich größer, Stiel kräftig genattert, Doppelring stark ausgeprägt, Buckel meist nur stumpf."

