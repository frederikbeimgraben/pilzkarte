[merkmale]
hut = "4 bis 12, selten bis 18 cm breit, gelb, gelbocker, ockerbraun bis olivocker. Huthaut matt, koernig filzig bis feinschuppig, teils etwas felderig aufreissend, erst nach laengerem Regen schmierig. Rand jung leicht ueberstehend, eingerollt und scharfkantig."
roehren = "Braeunlich, rostgelb, rostbraun, senffarben bis blass ockerfarben, alt schmutzig olivbraun, kurz, rundlich bis leicht eckig, kaum vom Fleisch loesbar, etwas herablaufend, auf Druck etwas blauend und spaeter wieder entfaerbend."
stiel = "5 bis 10, selten bis 12 cm lang und 1,5 bis 2, selten bis 3 cm dick, heller als der Hut, gelblich, fein braunkoernig ueberreift, ohne Ringzone. Kraeftig, zylindrisch bis keulig, zur Basis verdickt, bei Verletzung leicht bis mittelstark blauend."
fleisch = "Gelblich bis blassgelb, in der Stielbasis leicht orange, vor allem im dickfleischigen Hut leicht bis mittelstark blauend."
geruch = "Sehr pilzig angenehm bis etwas saeuerlich."
geschmack = "Mild, angenehm pilzartig bis etwas saeuerlich."
sporenpulver = "Olivbraun, ockerbraun, walnussbraun bis sienabraun."
vorkommen = "Symbiosepilz der Kiefer auf saurem, sandigem Boden."
zeit = "Sommer bis Herbst."

