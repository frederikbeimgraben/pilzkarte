speisewertHinweis = "Essbar, aber zäh und ohne Wert. Wird leicht mit giftigen Trichterlingen verwechselt."

[merkmale]
hut = "3 bis 9 cm, fuchsig orangebraun, trichterig, dünnfleischig, Rand wellig."
lamellen = "Blass ockerfarben, sehr dicht, weit herablaufend, leicht ablösbar."
stiel = "Dünn, zäh, in Hutfarbe, Basis filzig."
fleisch = "Dünn, wässrig, blass."
geruch = "Schwach säuerlich."
geschmack = "Mild bis leicht bitter."
sporenpulver = "Cremeweiß bis blass rosa."
vorkommen = "Zersetzer in der Nadel- und Laubstreu, in Reihen und dichten Hexenringen."
zeit = "September bis Dezember."

[[verwechslungen]]
name = "Ockerbrauner Trichterling"
