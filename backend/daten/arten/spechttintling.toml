[merkmale]
hut = "1 bis 4, selten bis 8 cm breit, braun, mit weißen flockigen Schuppen besetzt. Im Alter rollt sich der Rand nach oben und der Pilz zerfließt schwarz."
lamellen = "Schmutzig weiß bis grauweiß, später rosa und schließlich schwarz tintenartig zerfließend, Schneiden leicht flockig."
stiel = "10 bis 15, selten bis 25 cm lang, 1 bis 3, selten bis 4 cm dick, weißlich, etwas schuppig genattert, feinfaserig, zerbrechlich, hohl, nach oben verjüngt."
fleisch = "Weiß, dünn, schwarz zerfließend."
geruch = "Muffig, im Alter teerähnlich oder nach Mottenpulver."
geschmack = "Muffig, unangenehm."
sporenpulver = "Schwarz."
vorkommen = "Folgezersetzer im Laubwald, gern auf humus- und kalkreichem Boden."
zeit = "Sommer bis Herbst."

