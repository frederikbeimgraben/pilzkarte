[merkmale]
hut = "3 bis 8, selten bis 10 cm breit, bräunlich, samtig filzig, später aufreißend. Unter der Huthaut liegt immer eine Rotfärbung. Oberfläche feucht klebrig. Gelbliche Fraßstellen werden nach einigen Stunden rötlich."
roehren = "Gelb, alt dunkler braun bis rostbraun, auf Druck kaum blauend, dicker als das Hutfleisch."
stiel = "3 bis 10, selten bis 13 cm lang und 1 bis 4, selten bis 5 cm dick, rötlich punktiert und flockig, ohne Netz. Spitze verjüngt, Basis bauchig, spindelig bis rübenknollig, Myzel hellgelb."
fleisch = "Gelblich, manchmal blauend und etwas rötend. Die Gelbfärbung ist stärker als bei den anderen Rotfußarten."
geruch = "Pilzig, etwas säuerlich bis neutral."
geschmack = "Säuerlich."
sporenpulver = "Olivbraun bis senfgelb."
vorkommen = "Symbiosepilz im Mischwald. Sehr häufig."
zeit = "Frühsommer bis Herbst."

