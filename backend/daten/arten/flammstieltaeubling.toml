geschmack = "Brennend scharf und bitter."
sporenpulver = "Hellocker bis cremefarben."
vorkommen = "Symbiosepilz in feuchten Nadelwäldern, oft im Moos saurer Bergwälder, gern bei Fichte. Sehr selten, in Deutschland gefährdet."
zeit = "Frühsommer bis Spätherbst."

