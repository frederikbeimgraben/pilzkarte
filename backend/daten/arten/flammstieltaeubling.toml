stiel = "2 bis 7, selten bis 8 cm lang, 0,6 bis 1,5, selten bis 2,5 cm dick, weiß mit roter Flammung, hart und voll, Basis gelblich fleckend."
fleisch = "Weiß, fest und brüchig, später weich, unter der Huthaut rosenrot, alt leicht gelblich."
