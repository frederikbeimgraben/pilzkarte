[merkmale]
hut = "4 bis 10, selten bis 13 cm breit, blut- bis kirschrot, Mitte meist dunkler, selten cremefarben bis gelb. Die Haut lässt sich zu zwei Dritteln abziehen, feucht glänzend und schmierig. Rand glatt, lange eingerollt und unregelmäßig gelappt."
lamellen = "Weiß, im Alter gelblich, ziemlich gedrängt, mit vielen kürzeren Zwischenlamellen."
stiel = "2 bis 7, selten bis 8 cm lang, 0,6 bis 1,5, selten bis 2,5 cm dick, weiß mit roter Flammung, hart und voll, Basis gelblich fleckend."
fleisch = "Weiß, fest und brüchig, später weich, unter der Huthaut rosenrot, alt leicht gelblich."
geruch = "Schwach obstartig."
geschmack = "Brennend scharf und bitter."
sporenpulver = "Hellocker bis cremefarben."
vorkommen = "Symbiosepilz in feuchten Nadelwäldern, oft im Moos saurer Bergwälder, gern bei Fichte. Sehr selten, in Deutschland gefährdet."
zeit = "Frühsommer bis Spätherbst."

