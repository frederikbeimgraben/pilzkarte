name = "Körnchenröhrling"
lateinisch = "Suillus granulatus"
gruppe = "schmierroehrling"
speisewert = "bedingtEssbar"
geschuetzt = false
jahreszeiten = ["sommer", "herbst"]
baeume = ["kiefer"]
speisewertHinweis = "Roh unverträglich, er enthält Xerocomsäure. Mindestens 15 bis 20 Minuten garen und die schleimige Huthaut abziehen. Die DGfM nennt Magen-Darm-Beschwerden mit starkem Durchfall und mögliche Allergien; wer darauf reagiert, meidet alle Schmierröhrlinge."

[quelle]
url = "https://www.123pilzsuche.de/daten/details/Koernchenroehrling.htm"
geprueftAm = "2026-09-10"

[merkmale]
hut = "4 bis 12, selten bis 15 cm breit, kastanienbraun, hellbraun bis ockerbraun, bei Nässe sehr schmierig."
roehren = "Zitronengelb bis ockergelb, jung milchig tropfend, rundlich verzogen bis eckig."
stiel = "5 bis 13, selten bis 15 cm lang, 1 bis 3, selten bis 4 cm dick, gelblichweiß, ohne Ring, bräunlich gesprenkelt und punktiert."
fleisch = "Gelblich bis hellgelb, jung fest, alt weich und schwammig. Unter der Huthaut immer gelblich und ohne Faserung."
geruch = "Würzig, leicht fruchtig."
geschmack = "Schwach säuerlich, mild."
sporenpulver = "Braun bis ockerbraun."
vorkommen = "Symbiosepilz bei Kiefer, auf kalkhaltigem oder saurem Boden, oft zusammen mit dem Butterpilz. Regional sehr häufig."
zeit = "Sommer bis Herbst."

