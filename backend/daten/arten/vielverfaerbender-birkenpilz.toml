[merkmale]
hut = "4 bis 12, selten bis 16 cm breit, braungrau, schwarzbraun, mausgrau, ocker marmoriert, oft gefleckt, halbkugelig bis polsterförmig, feucht schmierig. Huthaut nur leicht überstehend."
roehren = "Bis etwa 1,4 cm lang, weißlich, cremebeige bis hellrosa, später gelblich bis schmutzig cremefarben, olivbraun, alt graubraun, leicht vom Hutfleisch lösbar."
stiel = "Mit tabakbraunen bis schwarzbraunen Schüppchen auf hellem Grund, nach oben verjüngt, an der Basis bei Verletzung blaugrün verfärbend."
fleisch = "Weißlich, später cremefarben, bei Verletzung zuerst hellrosa, dann stark blau bis kornblumenblau, beim Kochen schwarz, jung fest, später schnell schwammig und wässrig."
geruch = "Pilzig."
geschmack = "Mild, angenehm."
sporenpulver = "Olivbraun bis ockerbraun."
vorkommen = "Symbiosepilz in Laub- und Mischwald, nur bei Birke, auf saurem Boden, nie auf kalkreichem. Sehr selten."
zeit = "Frühsommer bis Herbst."

[[verwechslungen]]
slug = "hainbuchenroehrling"
unterschied = "Bei Hainbuche und Hasel, Huthaut wie gehämmert, Fleisch im Anschnitt erst rötlich, dann grauviolett bis schwarzlila statt kornblumenblau."

[[verwechslungen]]
slug = "roetender-birkenpilz"
