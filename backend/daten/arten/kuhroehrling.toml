geruch = "Unauffällig."
geschmack = "Mild."
sporenpulver = "Olivbraun."
vorkommen = "Mykorrhiza mit Kiefer, auf sauren, feuchten Sandböden und in Moorrandwäldern."
zeit = "Juli bis Oktober."

[[verwechslungen]]
name = "Butterpilz"
merkmal = "Mit Ring, Röhren fein statt weit."
essbar = "essbar"

