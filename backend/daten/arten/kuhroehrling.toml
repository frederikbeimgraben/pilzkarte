[merkmale]
hut = "2 bis 12, selten bis 15 cm breit, bräunlich, glatt, kahl und ledrig, feucht schmierig, trocken glänzend. Halbkugelig bis polsterförmig oder gebuckelt, Rand scharfkantig und wellig verbogen."
roehren = "Graugelb, bräunlich bis später rotbraun, selten mit hellblauen Flecken, schwer vom Fleisch lösbar, angewachsen und etwas herablaufend. Mündungen schnell groß, länglich bis unregelmäßig eckig."
stiel = "4 bis 6, selten bis 10 cm lang, 4 bis 15, selten bis 18 mm dick, hellbraun, voll, oft verbogen, zur Basis oft rötlich bis rosa."
fleisch = "Hellgelb bis gelb, alt kupferrötlich, elastisch, zäh und dünn. Meist nicht blauend, allenfalls im Hut und über den Röhren, nie im Stiel."
geruch = "Pilzig angenehm, leicht obstartig."
geschmack = "Säuerlich bis süßlich, meist mild, selten mit einem Hauch Bitternote, die beim Garen vergeht."
sporenpulver = "Olivgrün bis blass olivbraun."
vorkommen = "Symbiosepilz bei Kiefer, gern auf sandigem, nährstoffarmem Boden, einzeln oder mit mehreren aus einem Strunk. Oft zusammen mit dem Rosenroten Gelbfuß, der auf seinem Myzel wächst."
zeit = "Sommer bis Spätherbst."

[[verwechslungen]]
slug = "erlengruebling"
unterschied = "Hut gelblich bis olivgelb mit grübchenartig vertiefter Oberfläche, Röhren auf Druck grünblau, nur bei Erle."
eigenerUnterschied = "Röhren weiter und nicht so fein, Hut ohne Grübchen, wächst bei Kiefer."

[[verwechslungen]]
slug = "hohlfussroehrling"
unterschied = "Hut schuppig filzig und rostbraun, Stiel hohl mit angedeuteter Ringzone, bei Lärche."

[[verwechslungen]]
slug = "koernchenroehrling"
unterschied = "Röhren zitronengelb und jung milchig tropfend, Stiel bräunlich punktiert."

[[verwechslungen]]
slug = "sandroehrling"
unterschied = "Röhren fein und eng statt grob und eckig, Stielfleisch gelblich und blauend, Basis meist keulig verdickt."
eigenerUnterschied = "Hut ockerbraun und schmierig, Roehren weitloecherig und herablaufend, Fleisch kaum blauend."

[[verwechslungen]]
slug = "ziegenlippe"
unterschied = "Hut wildlederartig filzig, Röhren jung leuchtend gelb, Stiel fast weiß, lang und schlank."
eigenerUnterschied = "Hut bräunlich, schmierig, glatt und kahl, Röhren graugelb bis rotbraun, Stiel deutlich dünner."

