baeume = ["kiefer"]
speisewertHinweis = "Etwas säuerlich, guter Mischpilz und Trockenpilz. Beim Kochen läuft das Fleisch rosa bis leicht violett an."
weitereNamen = ["Kuhpilz"]
synonyme = ["Mariaella bovina", "Ixocomus bovinus", "Boletus bovinus"]

