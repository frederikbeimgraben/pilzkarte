[merkmale]
fruchtkoerper = "5 bis 15, selten bis 35 cm breit, rostbraun bis gelbbraun, alt fast schwarzbraun, am Rand heller. Flach konsolen- bis fächerförmig, meist waagerecht vom Holz abstehend, weich, schwammig bis weichkorkig, Oberfläche rauhaarig und filzig."
poren = "Gelb, graugelb bis gelbbraun, jung schillernd, später rostbraun, sehr fein, jung auf Druck etwas bräunend."
stiel = "Fehlt. Der Fruchtkörper wächst konsolenförmig am Substrat an, etwa zwei bis fünf Stück je Quadratmeter."
fleisch = "Bräunlich."
geruch = "Neutral bis angenehm pilzartig."
geschmack = "Mild, aromatisch pilzartig."
sporenpulver = "Gelbbraun bis zimtbraun."
vorkommen = "An lebenden alten Laubbäumen, meist Eiche und Buche. Parasit und Folgezersetzer, löst Weißfäule aus. Meist selten."
zeit = "Sommer bis Herbst."

