[merkmale]
fruchtkoerper = "3 bis 9, selten bis 11 cm breit und bis 25 cm hoch, aus Stiel und kugeligem Kopfteil aufgebaut. Außenhaut zuerst weiß bis grauweiß mit spitzen, leicht ablösbaren Warzen, später gelblich bis ockerfarben und glatt mit feinkörniger Hülle. Der untere bauchig zylindrische Teil ist steril und bekommt bald eine faltige Haut. Ausgewachsen mörser-, stößel- oder birnenförmig."
fleisch = "Innen zuerst weiß, dann gelb, alt purpurbraun bis lilabraun. Der Stielteil bleibt ocker bis ockerbraun."
geruch = "Angenehm."
geschmack = "Mild und angenehm."
sporenpulver = "Olivbraun, purpurbraun bis lilabraun."
vorkommen = "Folgezersetzer im Mischwald, auf Wiesen und Weiden sowie in Hecken."
zeit = "Frühsommer bis Herbst."

[[verwechslungen]]
name = "Hasenstäubling"
merkmal = "Ballon-, sack- oder kreiselförmig und meist viel größer, ohne abgesetzten Stielteil, auf Wiesen und Weiden."
