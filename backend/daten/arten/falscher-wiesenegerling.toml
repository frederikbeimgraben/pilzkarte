geschmack = "Mild, widerlich und muffig."
sporenpulver = "Purpurbraun, fast schwarz."
vorkommen = "Folgezersetzer auf Wiesen und in Parkanlagen, seltener im Misch- und Nadelwald, auf sauren, gern sandigen Böden. In Deutschland extrem selten."
