[merkmale]
fruchtkoerper = "1 bis 9, selten bis 12 cm breit, haselnussbraun, kandisbraun, kastanienbraun, gelb bis schwarzbraun, gallertartig. Zuerst kopfig gestielt und scheibenförmig oder gewölbt, später kreisel- bis leicht becherförmig und flach ausgebreitet. Oberseite jung glatt, später runzlig-uneben, Rand scharf wie abgeschnitten und oberhalb kerbig gerieft, Unterseite körnig-warzig. Fast nie ohrförmig, wächst einzeln und verschmilzt nicht."
stiel = "Jung meist kurz und kopfig, schief, mit kleinflächigem Kontakt zum Holz."
fleisch = "Bräunlich bis gelbbraun, weich, schwabbelig-gallertartig."
geruch = "Neutral bis leicht unangenehm."
geschmack = "Mild bis geschmacklos, gallertartig."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer an Totholz von Laubbäumen, größtenteils an Weiden. Sehr selten."
zeit = "Ganzjährig, bevorzugt bei feuchter Witterung im Frühjahr oder Spätherbst."

[[verwechslungen]]
name = "Blattartiger Zitterling"
merkmal = "Wellig und blattartig gekräuselt, nicht kreiselförmig, die ganze Oberfläche bildet Sporen."
essbar = "essbar"

