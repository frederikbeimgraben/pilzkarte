[merkmale]
hut = "1 bis 8, selten bis 12 cm breit, ockerbraun bis gelbbraun, ocker bis dunkelbraun, kahl und ohne Schüppchen, Rand meist heller und teils mit feinen Schleierresten."
lamellen = "Grau, rauchgrau bis graulila, niemals gelb oder grün, angeheftet bis angewachsen, fast gedrängt."
stiel = "2 bis 8, selten bis 10 cm lang, 4 bis 10, selten bis 12 mm dick, schmutzig weiß bis gelbweiß, zur Basis bräunlich, faserig, hohl, schlank. Jung oft mit angedeutetem Ring aus Velumresten."
fleisch = "Weißlich bis gelblich, in der Stielbasis gern gelborange, faserig."
geruch = "Etwas stechend, an Blausäure erinnernd, aber nicht unangenehm, oft mit einem Hauch obstartigem Duft."
geschmack = "Mild, angenehm pilzig, würzig und nussig."
sporenpulver = "Dunkel lilabraun, violettbraun bis lilaschwarz."
vorkommen = "Folgezersetzer auf Nadelholzstümpfen, gern Kiefer, Fichte und Douglasie, auch an vergrabenen Wurzeln und Ästen. In Gruppen wachsend."
zeit = "Herbst bis Spätherbst, selten im Frühjahr."

