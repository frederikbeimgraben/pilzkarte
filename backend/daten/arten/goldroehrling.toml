[merkmale]
hut = "3 bis 12, selten bis 15 cm breit, hellgelb, später orangerötlich, schleimig schmierig, Mitte oft etwas gebuckelt. Der gelbliche Schleim lässt sich feucht gut abziehen, die Haut selbst nur schwer. Junge Pilze sind ganz von einer häutigen Teilhülle umschlossen."
roehren = "Gelb, später braungelb, auf Druck rosalila fleckend."
stiel = "5 bis 10, selten bis 12 cm lang, 0,5 bis 2, selten bis 2,5 cm dick, gelb, ganz schmierig schleimig. Mit gelblichem Ring, darunter bräunlich gefasert, darüber gelblich wie die Röhren."
fleisch = "Zitronengelb bis satt gelb, im Hut oft heller, weich, rosalila verfärbend, selten etwas blauend."
geruch = "Angenehm pilzig."
geschmack = "Mild, säuerlich, roh fade, im Alter etwas muffig."
sporenpulver = "Gelblich braun."
vorkommen = "Symbiosepilz fast ausschließlich bei Lärche, extrem selten unter Douglasie oder Weymouthskiefer."
zeit = "Sommer bis Herbst."

[[verwechslungen]]
slug = "dottergelber-klumpfuss"
unterschied = "Lamellen statt Röhren, Stiel mit gerandeter Knolle und rostbraunem Sporenpulver, Geruch widerlich erdig."
eigenerUnterschied = "Röhren statt Lamellen, Stiel mit Ring und ohne gerandete Knolle, Geruch angenehm."

[[verwechslungen]]
slug = "elfenbeinroehrling"
unterschied = "Hut weiß bis cremefarben, Stiel mit braunen harzigen Pünktchen, bei Zirbel- und Weymouthskiefer."

[[verwechslungen]]
slug = "gelber-hohlfussroehrling"
unterschied = "Hut kanariengelb und bräunlich schuppig filzig, Stiel hohl, Röhren wabenartig und schwer vom Hut trennbar."
eigenerUnterschied = "Stiel voll und mit häutigem Ring, Hut feucht schmierig statt filzig-schuppig."

[[verwechslungen]]
slug = "goldporiger-roehrling"
unterschied = "Hut gelbrosa bis beigerosa, Röhren grobporig, Fleisch weiß mit rosaviolettem Ton, im Laubwald."
eigenerUnterschied = "Bei Lärche, Hut goldgelb und schleimig, Stiel mit Ring."

[[verwechslungen]]
slug = "kuhroehrling"
unterschied = "Hut bräunlich, Röhren graugelb bis rotbraun mit weiten Mündungen, kein Ring, bei Kiefer."

