roehren = "Weißlich, hellgelb bis cremegelb, nicht blauend oder nur leicht grünblau verfärbend."
stiel = "Ockerbraun, hellbraun bis blass lederbraun, faserig rillig, vor allem an der Spitze mit weißlicher bis brauner Netzzeichnung. Basis weißlich und verdickt."
fleisch = "Weiß, nicht blauend, selten etwas rötlich werdend, fest und fleischig."
geruch = "Mandelartig, nussig."
geschmack = "Mild, pilzig, nussig."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz im Laubwald, meist bei Eiche und Edelkastanie. Selten."
zeit = "Sommer bis Herbst."

