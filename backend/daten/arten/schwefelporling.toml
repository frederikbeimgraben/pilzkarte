sporenBreiteUm = { von = 3.5, bis = 5.0, einheit = "um" }

[zeitraum]
vonMonat = 5
bisMonat = 9

[farben]
hut = [{ name = "gelbbraun", hex = "#a3813f" }, { name = "weiß", hex = "#ffffff" }, { name = "gelb", hex = "#e8c33a" }, { name = "orange", hex = "#e08a2e" }]
sporenlager = [{ name = "weiß", hex = "#ffffff" }, { name = "gelb", hex = "#e8c33a" }]
