sporenpulver = [{ name = "weiß", hex = "#ffffff" }]

[geruch]
tags = ["obstartig", "saeuerlich", "pilzig"]
text = "Aromatisch, säuerlich, pilzig, obstartig."

[geschmack]
tags = ["mild", "saeuerlich", "bitter"]
text = "Säuerlich, alt nach Käse. An Hartholz wie Buche und Eiche oft bitterlich, an Weide und Birke immer mild."

[schutz]
status = "keiner"
quelle = "Bundesartenschutzverordnung, Anlage 1"

[merkmale]
fruchtkoerper = "5 bis 30, selten bis 50 cm breit, orange, hellgelb, gelbbraun bis blass gelblich, alt weiß. Fächerförmig und dachziegelartig übereinander, samtig."
poren = "Gelb, alt weiß."
stiel = "Kein Stiel. Der Fruchtkörper sitzt waagrecht am Stamm."
fleisch = "Gelb, alt weiß ausbleichend, jung weich und elastisch, im Alter hart, trocken, brüchig und zäh."
geruch = "Aromatisch, säuerlich, pilzig, obstartig."
geschmack = "Säuerlich, alt nach Käse. An Hartholz wie Buche und Eiche oft bitterlich, an Weide und Birke immer mild."
sporenpulver = "Weiß."
vorkommen = "An Laubbäumen, in höheren Lagen auch bei Lärche. Parasit oder Folgezersetzer, löst Braunfäule aus, Fruchtkörper einjährig. Auf Nadelholz wächst stattdessen der Nadelholzschwefelporling."
zeit = "Mai bis September."

[[verwechslungen]]
slug = "duftender-goldporling"
unterschied = "Liegt dem Holz flach auf, ohne abstehende Fächer, Myzel orangerot."
eigenerUnterschied = "Bildet dachziegelige Konsolen mit Hutkante, wächst an Laubholz."

[[verwechslungen]]
slug = "leuchtender-weichporling"
unterschied = "Flach am Substrat angewachsen, Fleisch gelblich bis orangerot, jung weich und saftig."
eigenerUnterschied = "Hüte fächerförmig und dachziegelartig, gelb bis orange, Poren gelb, Geruch säuerlich obstartig."

[[verwechslungen]]
slug = "nadelholzschwefelporling"
unterschied = "Sieht gleich aus, wächst aber an Nadelholz, meist Fichte und Tanne."

[[verwechslungen]]
slug = "riesenporling"
unterschied = "Hut jung fast weiß, später hellbraun, Fleisch weiß und im Schnitt langsam braunschwarz anlaufend."

[[verwechslungen]]
slug = "zimtfarbener-weichporling"
unterschied = "Fleisch dickfleischig, weich und zimtbraun bis rosabraun, nicht gelb."

