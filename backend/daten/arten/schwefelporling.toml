name = "Schwefelporling"
lateinisch = "Laetiporus sulphureus"
gruppe = "porling"
speisewert = "bedingtEssbar"
geschuetzt = false
jahreszeiten = ["fruehling", "sommer"]
baeume = ["buche", "eiche", "weide", "birke", "laerche", "obstbaum"]
speisewertHinweis = "Roh unverträglich wegen Oxalsäure. Nur junge Stücke, in etwa 1 cm dicke Scheiben schneiden, zehn Minuten in Salzwasser kochen und das Kochwasser weggießen. Funde an Eibe und Goldregen stehen lassen, der Pilz kann das Gift des Baumes aufnehmen. Auch Funde aus Obstplantagen meiden, wegen der Spritzmittel. Die DGfM nennt gelegentlich Magen-Darm-Beschwerden und allergische Reaktionen."

[quelle]
url = "https://www.123pilzsuche.de/daten/details/Schwefelporling.htm"
geprueftAm = "2026-09-10"

[[reagenzien]]
reagenz = "koh"
reaktion = "Ohne Reaktion auf Fleisch, Poren und Hut."

[merkmale]
fruchtkoerper = "5 bis 30, selten bis 50 cm breit, orange, hellgelb, gelbbraun bis blass gelblich, alt weiß. Fächerförmig und dachziegelartig übereinander, samtig."
poren = "Gelb, alt weiß."
stiel = "Kein Stiel. Der Fruchtkörper sitzt waagrecht am Stamm."
fleisch = "Gelb, alt weiß ausbleichend, jung weich und elastisch, im Alter hart, trocken, brüchig und zäh."
geruch = "Aromatisch, säuerlich, pilzig, obstartig."
geschmack = "Säuerlich, alt nach Käse. An Hartholz wie Buche und Eiche oft bitterlich, an Weide und Birke immer mild."
sporenpulver = "Weiß."
vorkommen = "An Laubbäumen, in höheren Lagen auch bei Lärche. Parasit oder Folgezersetzer, löst Braunfäule aus, Fruchtkörper einjährig. Auf Nadelholz wächst stattdessen der Nadelholzschwefelporling."
zeit = "Mai bis September."

