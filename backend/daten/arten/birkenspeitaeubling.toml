[merkmale]
hut = "4 bis 8, selten bis 12 cm breit, weißlich, blass rosa, rötlich bis rosenrot, kräftige Rottöne fast nie. Mitte oft blass gelblich bis ocker, Rand schwach kammartig gerieft. Die Huthaut lässt sich ganz abziehen."
lamellen = "Weiß, teils mit cremefarbenem Schimmer, sehr zerbrechlich, ausgebuchtet angewachsen, Schneiden etwas gesägt."
stiel = "3 bis 8, selten bis 9 cm lang und 1 bis 1,8, selten bis 2,3 cm dick, weiß und sehr brüchig."
fleisch = "Weiß, spröde und brüchig."
geruch = "Leicht obstartig."
geschmack = "Extrem scharf."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz in feuchten Birkenwäldern, oft in höheren Lagen, gern bei Torfmoos auf feuchtem Boden."
zeit = "Frühsommer bis Herbst."

[[verwechslungen]]
slug = "buchenspeitaeubling"
unterschied = "Hut zinnoberrot bis karminrot, Huthaut matt samtig und kaum abziehbar, bei Buche auf kalkhaltigem Boden."

