[[verwechslungen]]
slug = "gallenroehrling"
unterschied = "Röhren jung weiß, später rosa, Stiel mit braunem Netz. Schon ein kleines Stück Fleisch schmeckt sehr bitter."

[[verwechslungen]]
slug = "rotfussroehrling"
unterschied = "Huthaut aufreißend, darunter eine rote Zone, Stiel rötlich punktiert, Fleisch nur stellenweise blauend."
eigenerUnterschied = "Hut glatt und feucht schmierig, Röhren auf Druck blaugrün, ohne Rotfärbung unter der Huthaut."

[[verwechslungen]]
slug = "schoenfussroehrling"
unterschied = "Hut lehmgrau und samtig, Stiel zur Basis rot mit Netz, Fleisch sofort blauend, Geruch säuerlich muffig."

[[verwechslungen]]
