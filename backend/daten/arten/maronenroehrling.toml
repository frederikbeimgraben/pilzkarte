eigenerUnterschied = "Hut dunkel- bis hellbraun und feucht glatt, Röhren auf Druck blaugrün, Stiel ohne Netz."

[[verwechslungen]]
slug = "ziegenlippe"
unterschied = "Hut wildlederartig filzig, Röhren jung leuchtend gelb und höchstens leicht blauend, Stiel fast weiß und schlank."

