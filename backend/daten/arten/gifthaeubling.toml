[merkmale]
hut = "1 bis 6, selten bis 7,5 cm breit, hellbraun, gelbbraun bis dunkelbraun, hygrophan, größtenteils mit Buckel, teils spitz gebuckelt. Rand glatt bis durchscheinend gerieft."
lamellen = "Hellbraun, gelbbraun bis zimtbraun, angeheftet bis leicht herablaufend, schmal und gedrängt, Schneiden heller."
stiel = "2 bis 7, selten bis 9 cm lang und 3 bis 8, selten bis 18 mm dick. Haselnussbraun, gelbbraun bis schwarzbraun, weiß-silbrig bis hellflockig überfasert, größtenteils hohl, Spitze meist heller, Basis oft weißfilzig. Ring bräunlich, dünn und vergänglich, oft nur angedeutet."
fleisch = "Bräunlich, gelbbraun bis rostbraun, im Hut gelblich, zur Basis dunkler braun, dünn."
geruch = "Muffig und widerlich, an verfaulendes Holz erinnernd, meist etwas mehlartig oder leicht rettichartig."
geschmack = "Mild bis widerlich holzartig. Niemals probieren."
sporenpulver = "Rostbraun, rostocker bis zimtbraun."
vorkommen = "Folgezersetzer an Baumstümpfen und vergrabenem Holz, größtenteils bei Nadelhölzern, inzwischen auch auf Laubbaumstümpfen gemeinsam mit dem Stockschwämmchen. Einzeln bis gesellig."
zeit = "Winterende bis Spätherbst."

