[merkmale]
hut = "4 bis 16, selten bis 19 cm breit, ockerbraun, kastanienbraun bis braunorange, meist trocken und filzig. Im Alter reißt die Huthaut auf."
roehren = "Hellgelb bis zitronengelb, ausgebuchtet angewachsen, nicht blauend."
stiel = "Gelblich mit hellgelbem Netz, Basis bräunend, an der Stielwurzel oft ein Wurmfortsatz."
fleisch = "Weiß, hellgelb bis zitronengelb, unter den Röhren schwefelgelb, am Rand manchmal rosalich, nie blauend."
geruch = "Neutral bis angenehm, nicht pilzig."
geschmack = "Mild."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz im Nadelwald, größtenteils bei Fichte, gern auf saurem Boden, wärmeliebend. Selten."
zeit = "Frühsommer bis Herbst."

