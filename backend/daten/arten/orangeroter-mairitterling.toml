[merkmale]
hut = "3 bis 8, selten bis 10 cm breit, zuerst rotbraun, cremeockerbraun bis ockerorange, später schmutzig weiß bis gelblich, fast immer mit rötlichem Unterton. Huthaut glatt, Rand jung eingerollt, manchmal ausbleichend, alt von der Mitte her bräunlich schuppig."
lamellen = "Weiß, später gelblich, sehr dicht stehend, ausgebuchtet angewachsen, manchmal mit Zahn etwas herablaufend."
stiel = "3 bis 6 cm lang, weißlich bis gelblich, zylindrisch, faserig."
fleisch = "Weiß, teils etwas gelblich, dick, fest, faserig, bei Verletzung ohne Verfärbung."
geruch = "Mehlig bis gurkenartig, schwächer und weniger angenehm als beim Maipilz."
geschmack = "Mehlig, mild."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer auf Wiesen und in Parks, gern bei Lärche. Gesellig in Hexenringen, sehr selten."
zeit = "Frühling bis Frühsommer."

[[verwechslungen]]
slug = "riesenroetling"
unterschied = "Lamellen jung gelblich und später rotocker, Sporenpulver fleischrötlich, Geruch unangenehm säuerlich."

[[verwechslungen]]
slug = "ziegelroter-risspilz"
unterschied = "Hut ziegelrot bis rotbraun und radialfaserig aufreißend, Lamellen und Sporenpulver braun."

