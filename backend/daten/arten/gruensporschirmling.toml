[merkmale]
hut = "3 bis 9, selten bis 13 cm breit, weiß und wollig, jung mit hellbraunen landkartenartigen Zonen und abstehenden Schüppchen, Rand flockig."
lamellen = "Weiß, im Alter grünlich, immer mit einem Hauch Blaugrün."
stiel = "Glatt, weißlich bis hellgelblich, später gilbend und bräunend, bei Verletzung etwas rötend. Basis kaum knollig, nur etwas verdickt, mit weißen Myzelresten. Ring verschiebbar und kräftig, mit doppeltem gezahntem Rand."
fleisch = "Weißlich, bei Verletzung etwas rötend."
geruch = "Angenehm pilzig, ähnlich dem Parasol."
geschmack = "Mild. Roh sehr unverträglich."
sporenpulver = "Grünlich."
vorkommen = "In Gewächshäusern, botanischen Gärten, Treibhäusern und auf Komposthaufen. In warmen Gebieten auch auf Rasenflächen und an Waldrändern. In Deutschland bisher nur unter Glas gefunden."
zeit = "Die Seite nennt keine Jahreszeit."

