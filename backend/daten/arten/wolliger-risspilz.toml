hutBreiteCm = { von = 2.0, bis = 7.0, seltenBis = 9.0 }

[merkmale]
hut = "2 bis 7, selten bis 9 cm breit, braun bis orangebraun, wollig filzig, nicht sparrig, Rand fransig überstehend, Mitte teils dunkler."
lamellen = "Hellgrau bis graubraun, alt dunkel rostbraun, mehr oder weniger angewachsen, Schneiden weißlich bewimpert."
stiel = "Jung grauweißlich, später wollig braun- bis rostbraunschuppig auf hellem Grund, Spitze heller und weniger geschuppt, nur ganz oben bereift, im Alter hohl."
fleisch = "Schmutzig weißlich bis hellbräunlich, im Alter bräunend, im Stiel holzbraun."
geruch = "Moderig, erdig, säuerlich, spermatisch."
geschmack = "Mild, etwas muffig."
sporenpulver = "Tabakbraun bis dunkelbraun."
vorkommen = "Symbiosepilz im Mischwald, gern im feuchten Nadelwald, auf verrottetem Holz."
zeit = "Sommer bis Herbst."

[[verwechslungen]]
