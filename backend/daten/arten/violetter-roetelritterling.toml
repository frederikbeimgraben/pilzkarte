[merkmale]
hut = "4 bis 18, selten bis 22 cm breit, lilaviolett bis rosaviolett, alt bräunlich bis fleischlila, Mitte etwas violettbraun. Matt bis leicht glänzend, hygrophan, Huthaut kahl und glatt, Rand lange eingerollt."
lamellen = "Lila bis blaulila, nie bräunlich, am Stiel ausgebuchtet angewachsen, leicht ablösbar und vom Fleisch verschiebbar."
stiel = "4 bis 13, selten bis 16 cm lang, 1 bis 3, selten 4 cm dick, kahl, blass lila, flockig weiß bereift, leicht faserig, wattig voll. Basis oft keulig verdickt."
fleisch = "Lila bis weißlich lila, im Zentrum weiß, zum Stielrand hin mehr violett, alt gelbbraun."
geruch = "Parfümiert, fruchtig, angenehm würzig, selten etwas rettichartig. In der Hand zerkrümelt und angewärmt erinnert er an Multivitaminsaft."
geschmack = "Mild, nussig, pilzig. Roh giftig."
sporenpulver = "Blassrosa bis zartrosa."
vorkommen = "Folgezersetzer von verrottetem Laub im Mischwald, gern im Laubwald. Oft zusammen mit Nebelkappen."
zeit = "Herbst bis Winteranfang. Die Fruchtkörper kommen oft erst nach einem Temperatursturz und stehen bis in den Dezember."

