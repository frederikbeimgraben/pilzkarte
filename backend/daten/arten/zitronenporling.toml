[[reagenzien]]
reagenz = "koh"
reaktion = "Fleisch rasch gelb, später orange bis rot."

[merkmale]
hut = "3 bis 18, selten bis 20 cm breit, jung weißlich, schnell zitronengelb, später gilbend, alt und getrocknet orange bis ockerbraun. Oberfläche glatt und matt, im Alter braunschuppig aufreißend, Rand scharf eingebogen. Jung mit graubrauner bis grauvioletter Marmorierung."
poren = "Weißlich, auf Druck gilbend, am Stiel etwas herablaufend."
stiel = "Weißlich, strunkartig, mehrere Stiele oft verwachsen, voll, fein filzig, zur Basis verjüngt, etwas braunfleckig."
fleisch = "Weiß bis cremefarben, im Schnitt langsam schwach rotbraun anlaufend, fest und brüchig."
geruch = "Angenehm pilzig."
geschmack = "Mild, nussartig."
sporenpulver = "Weiß bis farblos."
vorkommen = "In Nadel- und Mischwäldern auf Nadelstreu oder nacktem Boden, gern in höheren Lagen. Vermutlich Symbiosepilz, nach anderen Autoren auch Folgezersetzer. Er kann zusammen mit dem Schafporling auftreten."
zeit = "Sommer bis Spätherbst."

