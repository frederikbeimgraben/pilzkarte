[merkmale]
hut = "2 bis 9, selten bis 14 cm breit, flach gewölbt oder leicht gebuckelt, weiß und schimmelartig glasig bereift."
lamellen = "Zuerst weiß, später leicht cremegelb bis rosabraun, etwas herablaufend, leicht ablösbar, mit kürzeren Zwischenlamellen."
stiel = "3 bis 7, selten bis 9 cm lang und 3 bis 9, selten bis 13 mm dick, weiß, cremefarben bis beige, meist weißlich bereift, voll, oft gekrümmt, zäh und elastisch. Basis meist verdickt und in ein weißes Myzelgeflecht auslaufend."
fleisch = "Weiß bis cremeweiß, im Hut etwas graubraun, dünn und wässrig zäh."
geruch = "Pilzig und süßlich aromatisch, schwach fruchtig bis parfümiert, alt muffig."
geschmack = "Mild, etwas ranzig."
sporenpulver = "Weiß, selten mit einem Hauch Cremeweiß bis Cremerosa."
vorkommen = "Folgezersetzer meist im Nadelwald, selten im Laubwald, oft im Hexenring. Häufig."
zeit = "Sommer bis Herbst."

