eigenerUnterschied = "Hut weißlich bis cremefarben, Stiel sehr kurz und seitlich, ohne Längsrillen."

[[verwechslungen]]
slug = "rosenseitling"
unterschied = "Hut und Lamellen gelblich bis rosenrot, Geruch beißend nitratartig. In Europa nur als Zuchtpilz."
eigenerUnterschied = "Hut milchweiss bis cremeweiss und duennfleischig, im Sommer an Laubholz."

