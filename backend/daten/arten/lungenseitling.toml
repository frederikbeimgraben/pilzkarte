[merkmale]
hut = "4 bis 15, selten bis 20 cm breit, nie reinweiß, sondern milchweiß, elfenbeinweiß, cremeweiß, grauweiß bis hellbeige, fettig glänzend. Kleiner, zarter und dünnfleischiger als der Austernseitling. Rand lange eingerollt, später gewellt."
lamellen = "Weißlich bis cremefarben, im Alter gilbend, gedrängt und untermischt, Schneiden glatt, am Stiel meist nur kurz herablaufend, selten mit aderigen Querverbindungen."
stiel = "1 bis 4, selten bis 5 cm lang, 0,5 bis 1, selten bis 1,2 cm dick, weiß, meist kurz seitlich bis außermittig angesetzt, striegelig, Basis weißfilzig. Selten fehlt er ganz."
fleisch = "Weiß, etwas wässrig, jung weich, alt zäh elastisch, zum Stiel korkig bis lederig. Bei Verletzung ohne Farbwechsel."
geruch = "Angenehm pilzig, süßlich, anisartig oder neutral."
geschmack = "Mild. Roh zersetzt er rote Blutkörperchen."
sporenpulver = "Weiß, schmutzigweiß bis leicht cremefarben."
vorkommen = "Folgezersetzer an Laubholz, gern Buche, Esche, Pappel und Birke. In Deutschland relativ häufig, im Bayerischen Wald mit vielen Fundstellen."
zeit = "Frühling bis Herbst."

[[verwechslungen]]
slug = "rosenseitling"
unterschied = "Hut und Lamellen gelblich bis rosenrot, Geruch beißend nitratartig. In Europa nur als Zuchtpilz."

[[verwechslungen]]
slug = "rillstieliger-seitling"
unterschied = "Lamellen queradrig netzig verbunden und bis zur Stielbasis herablaufend, Stiel längsrillig, Geruch mehlartig."

[[verwechslungen]]
slug = "austernseitling"
unterschied = "Hut silbergrau bis graubraun statt cremeweiß, dickfleischiger. Er braucht einen Kältereiz und kommt erst im Winter."

