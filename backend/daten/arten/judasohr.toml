fleisch = "Bräunlich, schwarzbraun bis schwarz, durchscheinend, zäh, elastisch gallertartig. Trocknet auf etwa ein Drittel zusammen und quillt bei Feuchtigkeit wieder auf."
geruch = "Neutral bis muffig erdig."
geschmack = "Mild bis geschmacklos, gallertartig."
sporenpulver = "Weiß bis cremegelblich."
vorkommen = "Meist an Laubholz, vor allem Holunder, auch Birke und anderes Laubholz, fast nie an Nadelholz. Parasitisch und folgezersetzend, Auslöser von Weißfäule, frostbeständig."
zeit = "Ganzjährig, Schwerpunkt Winter und Frühjahr bei feuchtem Wetter."

