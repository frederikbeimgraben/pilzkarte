[merkmale]
fruchtkoerper = "3 bis 10 cm, ohrförmig, rotbraun bis olivbraun, gallertig elastisch. Trocknet zu einer harten Scholle ein und quillt bei Nässe wieder auf."
fleisch = "Gallertig, zäh, mit feinem Flaum auf der Außenseite."
geruch = "Unauffällig."
geschmack = "Mild, fast neutral."
sporenpulver = "Weiß."
vorkommen = "Zersetzer an totem Holunder, seltener an anderem Laubholz. Wächst das ganze Jahr, auch im Frost."
zeit = "Ganzjährig, Schwerpunkt Oktober bis April."

[[verwechslungen]]
