geschmack = "Mild-saeuerlich."
sporenpulver = "Hellbraun bis ockerbraun."
vorkommen = "Symbiosepilz an Waldraendern und in Parks unter Fichten und Kiefern, gern auf kalkreichem Boden. Im Mittelmeerraum unter der Aleppo-Kiefer."
zeit = "Sommer bis Herbst."

