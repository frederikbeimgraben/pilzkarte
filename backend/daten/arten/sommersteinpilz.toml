[merkmale]
hut = "4 bis 22, selten bis 28 cm breit, hell lederbraun, ockerbraun, blass bräunlich, milchkaffee- bis haselnussbraun, Huthaut oft uneben. Jung halbkugelig und fest geschlossen, später polsterförmig bis flach. Matt, feinfilzig bis samtig und trocken, bei Nässe feucht, aber nie schleimig. Bei Trockenheit reißt die Huthaut felderig auf und lässt in den Rissen das weiße Fleisch sehen."
roehren = "Weißlich, gelblich, gelbgrün, alt olivgrün."
stiel = "5 bis 15 cm lang, 2 bis 5 cm dick, weißlich, blassbraun, bräunlich überfasert. Mit weißem, im Alter bräunlichem Netz, das erhaben fühlbar ist und von der Spitze bis weit zur Basis reicht. Die Maschen sind weißlich bis hellbraun."
fleisch = "Weißlich, nicht verfärbend, unter der Huthaut weiß und nicht rotbräunlich wie beim Fichtensteinpilz."
geruch = "Nussig, der typische Steinpilzgeruch."
geschmack = "Mild, pilzig, nussig."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz im Mischwald, gern bei Eiche, Buche, Linde und Esskastanie."
zeit = "Frühsommer bis Spätherbst."

[[verwechslungen]]
slug = "gallenroehrling"
unterschied = "Röhren jung weiß, später rosa, Stiel mit grobem braunem Netz, Geschmack bitter."

[[verwechslungen]]
slug = "steinpilz"
unterschied = "Netz nur im oberen Stielteil, unter der Huthaut eine rotbräunliche Zone."

[[verwechslungen]]
slug = "maronenroehrling"
unterschied = "Hut glatt und feucht, Röhren gelblich bis grüngelb und auf Druck blaugrün, Stiel ohne Netz."

[[verwechslungen]]
slug = "schwarzhuetiger-steinpilz"
unterschied = "Hut kastanien- bis schwarzbraun oder hell bronzefarben, Stiel faserig rillig."

