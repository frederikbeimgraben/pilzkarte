name = "Schafporling"
lateinisch = "Albatrellus ovinus"
gruppe = "porling"
speisewert = "bedingtEssbar"
geschuetzt = true
jahreszeiten = ["sommer", "herbst"]
baeume = ["fichte"]
speisewertHinweis = "Besonders geschützt. Roh löst er Unverträglichkeiten aus: durchgaren und Kostproben wieder ausspucken."
marktfaehig = true
wertigkeit = 2
weitereNamen = ["Schofferl", "Echter Schafporling", "Schafeuter", "Schafsporling"]
synonyme = ["Scutiger ovinus", "Polyporus limonius", "Polyporus lutescens", "Caloporus ovinus", "Albatrellus albidus"]

[quelle]
url = "https://www.123pilzsuche.de/daten/details/Schafporling.htm"
geprueftAm = "2026-09-10"

[[reagenzien]]
reagenz = "koh"
reaktion = "Fleisch ockergelb bis olivgelb."

[masse]
hutBreiteCm = { von = 3.0, bis = 18.0, seltenBis = 30.0 }

[merkmale]
hut = "3 bis 18, selten bis 30 cm breit, weiß, später gelblich, braungelb, graugelb oder schmutzig weiß, filzig, im Alter aufreißend."
poren = "Weiß bis grünlich weißlich, rund, auf Druck gilbend."
stiel = "Weißlich mit graubraunen bis dunkelbraunen Flecken, voll, unregelmäßig dick und keilförmig, meist viel länger als beim Semmelporling."
fleisch = "Weiß, fest, brüchig, Druckstellen gilben leicht. Er wird im Alter langsamer bitter als der Semmelporling."
geruch = "Angenehm pilzig."
geschmack = "Fast immer mild, erst im späten Alter vereinzelt bitterlich. Roh unverträglich."
sporenpulver = "Weiß."
vorkommen = "Im Mischwald, überwiegend bei Nadelbäumen und dort gern bei Fichte, auf kalkreichem, saurem und neutralem Boden. Wahrscheinlich Symbiosepilz, nach einigen Autoren auch Folgezersetzer. Tritt meist zusammen mit dem Semmelporling auf."
zeit = "Sommer bis Spätherbst."

