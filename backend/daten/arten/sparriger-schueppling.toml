[merkmale]
hut = "1 bis 5, selten bis 10 cm breit, strohgelb, trocken, mit abstehenden sparrigen Schüppchen auf gelbbraunem bis hellbraunem Grund."
lamellen = "Jung blass olivgelb, später olivbraun, ausgebuchtet und breit angewachsen."
stiel = "2 bis 18, selten bis 25 cm lang, 0,6 bis 4, selten bis 5 cm dick, hellbraun, über der Ringzone kahl, darunter mit rotbraunen Schuppen, zur Basis dunkler."
fleisch = "Weißlich bis blassgelb, dick, hart, faserig."
geruch = "Rettichartig, rübenartig, angenehm."
geschmack = "Rübenartig, rettichartig."
sporenpulver = "Rostbraun."
vorkommen = "Folgezersetzer und Weißfäuleerreger, gern an Laubholz und Obstbäumen, seltener an Nadelholz wie Fichte."
zeit = "Spätsommer bis Spätherbst."

[[verwechslungen]]
name = "Hochthronender Schüppling"
merkmal = "Schuppen angedrückt statt abstehend und zonig verteilt, Stiel schleimig, an Nadelholz."
essbar = "giftig"

[[verwechslungen]]
