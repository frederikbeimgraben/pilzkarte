jahreszeiten = ["sommer", "herbst"]
baeume = ["obstbaum", "fichte"]
speisewertHinweis = "Verursacht gelegentlich Magen-Darm-Beschwerden; vom Verzehr wird abgeraten. Zu erkennen an den abstehenden sparrigen Schuppen auf Hut und Stiel und am rettichartigen Geruch."

[quelle]
url = "https://www.123pilzsuche.de/daten/details/SparrigerSchueppling.htm"
