[merkmale]
hut = "5 bis 20, selten bis 25 cm breit, weiß bis hellgrau, grauoliv oder ockerlederfarben, jung halbkugelig, später polsterförmig ausgebreitet, im Alter unregelmäßig verbogen. Rand eingebogen, Oberfläche nicht blauend."
