fleisch = "Weißlich grau bis hell gelblich, im Anschnitt meist nur schwach blauend."
geruch = "Neutral bis unangenehm, im Alter aasartig."
geschmack = "Mild."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz im Laubwald, gern bei Buche, auf kalkreichem Boden. Selten."
zeit = "Sommer bis Spätherbst."

