[merkmale]
hut = "3 bis 8, selten bis 13 cm breit, kastanienbraun, hellbraun bis olivgelb. Die Haut wirkt gehämmert und runzelig, alt felderig rissig. Rand jung eingebogen, alt verkürzt, dann quellen die Röhren hervor."
roehren = "Schmutzigweiß, creme bis ockergelb, später blass grauocker, auf Druck bräunlich bis violettschwärzlich."
stiel = "4 bis 12, selten bis 14 cm lang und 0,6 bis 1,2, selten bis 1,4 cm dick, weißlich, mit braunschwarzen bis grauschwarzen Schüppchen. Nach Verletzung grauviolett und nach kurzer Zeit schwarz."
fleisch = "Grauweiß, im Anschnitt zuerst rötlich, nach wenigen Minuten grauviolett bis schwarzlila, fest. Beim Kochen schwarz, nahe der Basis bläulich."
geruch = "Angenehm pilzig."
geschmack = "Mild, pilzig."
sporenpulver = "Ockerbraun bis schmutzig braun."
vorkommen = "Symbiosepilz im Laubwald, meist unter Hainbuche, seltener bei Hasel. Gern zusammen mit dem Hainbuchenmilchling."
zeit = "Frühsommer bis Herbst."

