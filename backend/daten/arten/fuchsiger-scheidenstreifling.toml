name = "Fuchsiger Scheidenstreifling"
lateinisch = "Amanita fulva"
gruppe = "wulstling"
speisewert = "bedingtEssbar"
geschuetzt = false
jahreszeiten = ["sommer", "herbst"]
baeume = ["birke", "fichte"]
speisewertHinweis = "Roh giftig. Nur für sichere Kenner: jeder Fruchtkörper muss mit ganzer Stielbasis ausgegraben und geprüft werden."

[merkmale]
hut = "4 bis 10 cm, fuchsig orangebraun, glatt, mit deutlich gerieftem Rand, ohne Flocken."
lamellen = "Weiß, frei, dicht."
stiel = "Schlank, blass, ohne Ring, Basis in einer hohen, häutigen, rostfleckigen Scheide."
fleisch = "Weiß, dünn, zerbrechlich."
geruch = "Unauffällig."
geschmack = "Mild. Roh nicht kosten."
sporenpulver = "Weiß."
vorkommen = "Mykorrhiza mit Birke und Fichte, auf sauren, feuchten Böden, oft einzeln."
zeit = "Juni bis Oktober."

[[verwechslungen]]
name = "Grüner Knollenblätterpilz"
merkmal = "Lamellen bleiben weiß, häutiger Ring, Stielbasis in einer häutigen Scheide. Jeder weiße Lamellenpilz mit Ring und Scheide bleibt stehen."
essbar = "toedlichGiftig"

[[verwechslungen]]
