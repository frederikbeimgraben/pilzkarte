roehren = "Gelb, später goldgelb bis rötlich, auf Druck blauend. Der Porenboden ist erst goldgelb, dann orangerot; im Alter verliert sich das Rot und die Röhren werden wieder olivgelb."
stiel = "7 bis 14, selten bis 16 cm hoch, an der Basis 3 bis 6, selten bis 8 cm dick, an der Spitze 2 bis 4, selten bis 5 cm. Gelblich mit feinem Netz, das oft nur mit der Lupe zu sehen ist, rötlich fleckig, Basis dunkelrot bis purpurbraun."
fleisch = "Schwefelgelblich, auf Druck schwarzblau, zur Stielbasis nur wenig rötlich, faserig und fest."
geruch = "Angenehm pilzig, nach Ananas oder Apfel, alt fast geruchlos."
geschmack = "Mild, pilzig."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz meist im Laubwald, gern bei Eiche und Buche. In südlichen Ländern häufiger, hier sehr selten."
zeit = "Sommer bis Herbst."

