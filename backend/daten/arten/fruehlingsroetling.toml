[merkmale]
hut = "1 bis 4, selten bis 6 cm breit, jung fast schwarzbraun bis graubraun, feucht kastanienbraun, später rosagrau bis rosabräunlich, beim Abtrocknen verblassend. Gebuckelt und schnell ausgebreitet, Rand meist überstehend und schwach gerieft."
lamellen = "Grau, schmutzig weißlich, graurötlich bis lilarötlich, alt rotbraun, angeheftet und frei wirkend, Schneiden alt gezahnt und wellig."
stiel = "4 bis 7, selten bis 9 cm lang, 4 bis 11, selten bis 13 mm dick, graubraun, meist bereift, längsfaserig und gefurcht, zerbrechlich, oft verdreht, zur Basis etwas verdickt, alt hohl, Basalmyzel weiß."
fleisch = "Gelbbraun, schmutzig gelbbeige bis graubräunlich, dünn, faserig, längs brechend."
geruch = "Neutral, nicht mehlig."
geschmack = "Pilzig und mild, nicht mehlig."
sporenpulver = "Rotbraun, rosabraun bis pink."
vorkommen = "Symbiosepilz an Hecken, in Gärten, auf Wiesen, Heiden und Weiden an grasigen Stellen, selten im Mischwald, gern auf saurem Boden. Meist häufig."
zeit = "Frühling bis Frühsommer, nach der Schneeschmelze."

