hut = "3 bis 8, selten bis 12 cm breit, blut- bis kirschrot, älter mattrot bis karminrot, Mitte niedergedrückt. Haut fast ganz abziehbar, feucht schmierig glänzend, trocken matt. Darunter ist das Fleisch weiß."
