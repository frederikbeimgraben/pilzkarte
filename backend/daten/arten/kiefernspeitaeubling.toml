stiel = "3 bis 7, selten bis 9 cm lang und 0,5 bis 1,5, selten bis 2 cm dick, weiß ohne Rottöne, etwas wattig hohl, Rinde längsaderig. Basis alt gelblich verfärbend."
fleisch = "Weiß und brüchig, unter der Huthaut weiß."
geruch = "Obstartig, nach Kokos."
geschmack = "Brennend scharf."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz im trockenen Mischwald, gern bei Kiefer, auf sandigem saurem Boden."
zeit = "Frühsommer bis Spätherbst."

