[[reagenzien]]
reagenz = "koh"
reaktion = "Auf der Oberfläche ohne Reaktion."

[merkmale]
fruchtkoerper = "1 bis 10, selten bis 12 cm breit, orange, gelborange oder gelb, kahl. Schüssel- bis kelchförmig, später abgeflacht und unregelmäßig. Außenseite blasser rosalich und weißlich körnig kleiig, im Alter fast kahl."
stiel = "Sehr kurz bis meist fehlend, nur ein wurzelartiges Ende."
fleisch = "Hellgelb bis orangegelb, mit wachsartiger Oberfläche, sonst dünn, spröde und sehr brüchig."
geruch = "Neutral."
geschmack = "Mild und neutral, roh essbar."
sporenpulver = "Weiß bis farblos."
vorkommen = "Folgezersetzer in Wäldern, Gärten und Parks, auf nackter trockener Erde, oft sandig oder lehmig, selten auf Holzabfällen wie Hackschnitzeln. Oft büschelig."
zeit = "Sommer bis Spätherbst."

