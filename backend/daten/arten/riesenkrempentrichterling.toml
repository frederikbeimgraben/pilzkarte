[merkmale]
hut = "4 bis 30, selten bis 40 cm breit, weiß, grau, cremeweiß, elfenbeinweiß, hellbraun bis blassocker, im Alter mit braunen Flecken und kreisförmigen Rissen. Oberfläche glatt, ledersamtig bis feinfilzig, alt bereift. Huthaut abziehbar, Form konvex bis trichterförmig, Rand gerollt."
lamellen = "Weiß bis cremefarben, dicht stehend, mit vielen Zwischenlamellen, zum Stiel gegabelt, angewachsen und meist etwas herablaufend, leicht ablösbar."
stiel = "Weiß, später ockerlich, fest, Basis meist verdickt und mit weißem Myzelfilz fest im Boden verwachsen."
fleisch = "Weiß, alt gelblich, dick und fest."
geruch = "Mehlig und pilzig, meist nicht unangenehm."
geschmack = "Mild, nussig."
sporenpulver = "Weiß bis hell cremefarben."
vorkommen = "Folgezersetzer im Nadelwald, auf Waldwiesen, Wiesen, Weiden, in Parks und Gärten. Bildet Hexenringe."
zeit = "Sommer bis Herbst."

