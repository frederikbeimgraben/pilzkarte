lamellen = "Weißlich bis blassgrau, erst später rosa bis rosabräunlich, ausgebuchtet und mit Zähnchen angewachsen, mit Zwischenlamellen, Schneiden wellig und gekerbt."
stiel = "2 bis 5, selten bis 6 cm lang, 0,5 bis 0,8, selten bis 1,2 cm dick, weißlich, feinfaserig, zylindrisch, längsgerieft, zur Basis teils verdreht und verjüngt."
fleisch = "Weißlich bis etwas grau, fest und starr, im Scheitel dick. Insektenfraßgänge höchstens ockerlich, nie rotbraun wie beim Schlehenrötling."
geruch = "Mehlig oder gurkenartig."
geschmack = "Mild, mehlig oder gurkenartig."
sporenpulver = "Rosa."
vorkommen = "Symbiosepilz bei Rosengewächsen, in Parks, auf Wiesen und Obstwiesen, an Waldrändern und grasigen Stellen, büschelig. Regional selten, in Deutschland auf der Vorwarnliste."
zeit = "Frühjahr bis Frühsommer."

[[verwechslungen]]
slug = "fruehlingsroetling"
unterschied = "Nur 1 bis 4 cm breit, Lamellen grau bis lilarötlich, Fleisch gelbbraun, Geruch und Geschmack nicht mehlig."
eigenerUnterschied = "Größer, Hut graubraun und seidig faserig, Geruch und Geschmack stark mehlartig."

[[verwechslungen]]
slug = "maipilz"
unterschied = "Hut weiß bis cremeweiß und glatt, Lamellen bleiben weiß bis gelblich, Sporenpulver weiß, Geruch stark mehlig."

[[verwechslungen]]
slug = "riesenroetling"
unterschied = "Deutlich größer und kräftiger, Lamellen jung gelblich, Geruch unangenehm säuerlich mehlig, bei Eiche, Buche und Espe."

[[verwechslungen]]
slug = "schlehenroetling"
unterschied = "Hut sehr blass, Insektenfraßgänge laufen schnell orangebraun an, Fleisch verfärbt bei Verletzung braunrot bis safranfarben."

[[verwechslungen]]
slug = "ziegelroter-risspilz"
unterschied = "Hut ziegelrot bis ockerbraun, Fleisch verfärbt sich rot, Geruch spermatisch."

