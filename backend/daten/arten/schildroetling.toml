[merkmale]
hut = "2 bis 9, selten bis 12 cm breit, graubraun, blassbraun, horngrau, sepia-, dunkel-, silbrig- oder olivbraun. Jung kegelig gewölbt, später ausgebreitet mit stumpfem Buckel, radial eingewachsen faserig, kaum ausblassend. Rand rissig wie bei den Risspilzen und lange eingebogen."
lamellen = "Weißlich bis blassgrau, erst später rosa bis rosabräunlich, ausgebuchtet und mit Zähnchen angewachsen, mit Zwischenlamellen, Schneiden wellig und gekerbt."
stiel = "2 bis 5, selten bis 6 cm lang, 0,5 bis 0,8, selten bis 1,2 cm dick, weißlich, feinfaserig, zylindrisch, längsgerieft, zur Basis teils verdreht und verjüngt."
fleisch = "Weißlich bis etwas grau, fest und starr, im Scheitel dick. Insektenfraßgänge höchstens ockerlich, nie rotbraun wie beim Schlehenrötling."
geruch = "Mehlig oder gurkenartig."
geschmack = "Mild, mehlig oder gurkenartig."
sporenpulver = "Rosa."
vorkommen = "Symbiosepilz bei Rosengewächsen, in Parks, auf Wiesen und Obstwiesen, an Waldrändern und grasigen Stellen, büschelig. Regional selten, in Deutschland auf der Vorwarnliste."
zeit = "Frühjahr bis Frühsommer."

