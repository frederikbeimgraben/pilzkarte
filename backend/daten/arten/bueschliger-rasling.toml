[merkmale]
hut = "3 bis 9, selten bis 13 cm breit, ledergelb, blass braungrau bis orangebraun, leicht gebuckelt oder in der Mitte eingedrückt, jung mit feiner Radialfaserung. Rand wellig eingerollt, Huthaut gummiartig elastisch bis knorpelig."
lamellen = "Weißlich, breit angewachsen oder etwas herablaufend."
stiel = "5 bis 10, selten bis 13 cm lang, weißlich bis hellbräunlich, längsfaserig, Spitze bereift."
fleisch = "Weiß, fest, zäh und elastisch."
geruch = "Neutral bis etwas mehlartig."
geschmack = "Mild und angenehm."
sporenpulver = "Reinweiß."
vorkommen = "Folgezersetzer im Laubwald, auf Wegen, an Wegrändern und in Parks, meist büschelig aus einem Strunk."
zeit = "Spätsommer bis Spätherbst."

