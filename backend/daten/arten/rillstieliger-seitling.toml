[merkmale]
hut = "2 bis 11, selten bis 15 cm breit, hellbraun, graubraun, gelbbraun bis blass gelbgrau, im Alter fuchsigbraun. Anfangs etwas flockig, bald kahl, trichterförmig, Rand gebogen, oft eingerissen und wellig."
lamellen = "Schmutzigweiß bis weißlich cremefarben, oft mit rosa Schimmer, gegabelt, queradrig und netzig überzogen, eng stehend, bis zur Stielbasis herablaufend."
stiel = "2 bis 8, selten bis 9 cm lang, 1 bis 2, selten bis 3 cm dick, weißlich, hellbraun bis graubraun, längsrillig, schwach exzentrisch bis seitlich, Basis oft weißfilzig."
fleisch = "Weiß, alt gelblich, zäh."
geruch = "Mehlartig, oft mit Aniskomponente, teils leicht spermatisch."
geschmack = "Mild und mehlartig. Roh blutzersetzend."
sporenpulver = "Sehr veränderlich, weißlich, cremefarben, grau, graulila, hell lila bis lilabraun."
vorkommen = "Folgezersetzer an totem Laubholz, gern Weide, Ulme und Pappel. Selten."
zeit = "Frühjahr bis Spätherbst."

