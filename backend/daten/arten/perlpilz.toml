name = "Perlpilz"
lateinisch = "Amanita rubescens"
gruppe = "wulstling"
speisewert = "bedingtEssbar"
geschuetzt = false
jahreszeiten = ["sommer", "herbst"]
baeume = []
speisewertHinweis = "Roh giftig. Mindestens fünf Minuten garen, bis 90 °C Kerntemperatur erreicht sind. Nur junge Fruchtkörper nehmen, alte verderben schnell. Der stark geriefte Ring und das Röten sind Pflichtmerkmale; wer den Pantherpilz nicht sicher trennt, lässt ihn stehen."

