[[reagenzien]]
reagenz = "koh"
reaktion = "Auf dem Hut ohne Verfärbung."

[merkmale]
hut = "3 bis 12, selten bis 18 cm breit, rotbraun, fleischrötlich, braunrot, gelblich bis hell violettbraun, mit grauen und leicht abwischbaren Schüppchen. Huthaut abziehbar."
lamellen = "Weiß, im Alter rötlich fleckend, überwiegend frei, Schneiden feinstflockig."
stiel = "5 bis 15, selten bis 20 cm lang, 1 bis 4, selten bis 6 cm dick, weißlich bis hell braunrosa. Knolle rübenförmig mit Warzengürtel, oft etwas wurzelnd, ohne Scheide. Ring weiß, gelb bis rosa, häutig, herabhängend und stark gerieft."
fleisch = "Weiß, unter der Huthaut rotbraun, an Druckstellen und Schneckenfraßstellen rötend, zart und weich."
geruch = "Neutral."
geschmack = "Mild, später etwas kratzend, roh giftig."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz im Mischwald, bei Nadel- und Laubbäumen."
zeit = "Frühsommer bis Spätherbst."

