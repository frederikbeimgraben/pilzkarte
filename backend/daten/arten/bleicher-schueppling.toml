[merkmale]
hut = "5 bis 10, selten bis 15 cm breit, hellbraun bis gelbbraun auf sehr hellem, fast cremeweißem Grund, trocken, feucht schmierig, mit dunkleren, spitzen und sparrig abstehenden Schüppchen. Gewölbt bis halbkugelig, ohne Buckel, später etwas abgeflacht."
lamellen = "Jung blass gelblich, später gelbbraun, ausgebuchtet angewachsen und mit Zahn herablaufend, sehr gedrängt stehend."
stiel = "3 bis 9, selten bis 11 cm lang und 1 bis 2, selten bis 3 cm dick, hellbraun bis gelbbraun, voll und zylindrisch. Über der flüchtigen Ringzone cremeweiß, darunter blassgelb und dicht sparrig geschuppt, zur Basis dunkler. Oft mit mehreren Fruchtkörpern verwachsen."
fleisch = "Weißlich, im Stiel graugelb, in der unteren Stielhälfte orangebraun."
geruch = "Obstartig und würzig, etwas nach Fruchtbonbon, nicht rettichartig."
geschmack = "Bitter."
sporenpulver = "Rostbraun."
vorkommen = "Folgezersetzer und Weißfäuleerreger an Totholz. Meist relativ selten."
zeit = "Sommer bis Spätherbst."

