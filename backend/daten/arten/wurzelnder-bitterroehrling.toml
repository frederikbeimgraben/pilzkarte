hutBreiteCm = { von = 6.0, bis = 20.0, seltenBis = 25.0 }

[merkmale]
hut = "6 bis 20, selten bis 25 cm breit, grau, grauweiß bis braungrau, gefleckt, polsterförmig."
roehren = "Gelblich, jung leuchtend zitronen- bis chromgelb, im Alter olivgelb. Druckstellen verfärben intensiv lagunenblau."
stiel = "Gelblich mit gelbbräunlichem Netz, auf Druck rötlich oder braunrot fleckend. Basis wurzelartig verlängert und zugespitzt, etwas rosa bis rötlich."
fleisch = "Blass gelblich, stark blauend, die Blaufärbung kann abgeschwächt sein oder ganz fehlen. Später bräunend oder marmoriert rötend, schwammig."
geruch = "Unangenehm, etwas nach Maggi oder Tinte."
geschmack = "Sehr bitter, vereinzelt etwas schärflich."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz in Laubwald, Parks und Gärten, meist bei Eiche, Linde und Buche, gern auf kalkreichem Boden. In Deutschland in unbekanntem Ausmaß gefährdet."
zeit = "Sommer bis Spätherbst."

