[merkmale]
hut = "3 bis 14, selten bis 18 cm breit, weiß, alt graubraun bis gelbbraun, Mitte mit bräunlichen schuppigen Zonen. Beim Reiben gelblich verfärbend. Jung halbkugelig bis konvex, im Alter abgeflacht."
lamellen = "Rosa, alt braun, frei, gedrängt."
stiel = "3 bis 12, selten bis 15 cm lang und 1 bis 3, selten bis 3,5 cm dick, weiß und glatt, bei Berührung oder im Alter gelbfleckig, später bräunlich. Basis mit starker Gelbfärbung. Ring weiß, breit, hängend, mit doppeltem, teils bräunlichem Rand, teils vergänglich."
fleisch = "Weiß, in der Stielbasis und bei Verletzung gelblich verfärbend."
geruch = "Unangenehm tintenartig und karbolartig nach Phenol, urinartig, nicht pilzartig wie bei den Wiesenchampignons. Beim Kochen verstärkt er sich."
geschmack = "Mild, dabei widerlich, unangenehm und muffig."
sporenpulver = "Dunkelbraun bis purpurbraun."
vorkommen = "Folgezersetzer auf Wiesen, im Gebüsch, in Parkanlagen, gern auf Streuobstwiesen, seltener in Wäldern."
zeit = "Frühling bis Herbst."

