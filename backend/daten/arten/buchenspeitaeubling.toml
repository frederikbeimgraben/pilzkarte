[merkmale]
hut = "3 bis 9, selten bis 10 cm breit, rötlich, zinnoberrot bis karminrot, stellenweise weißfleckig. Huthaut matt samtig, kaum abziehbar, darunter rosa. Mitte bleicht aus, Rand im Alter etwas gerieft."
lamellen = "Weiß, im Alter gelblich, zerbrechlich, ausgebuchtet angewachsen, viele gegabelt, jung gedrängt."
stiel = "3 bis 9, selten bis 11 cm hoch und 1 bis 3 cm dick, weiß, fest, brüchig, ohne rötliche Töne."
fleisch = "Weiß, fest und spröde, unter der Huthaut rosa, neigt zum Gilben."
geruch = "Leicht obstartig, trocken honigartig."
geschmack = "Extrem scharf."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz im Laubwald, gern bei Buche auf Laubstreu, bevorzugt kalkhaltigen Boden."
zeit = "Frühsommer bis Spätherbst."

