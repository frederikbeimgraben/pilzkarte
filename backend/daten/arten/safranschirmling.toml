[merkmale]
hut = "4 bis 15, selten bis 20 cm breit, auf cremefarbenem bis hell ockerlichem Grund grob bräunlich geschuppt, zur Mitte hin dichter. Schuppen weich, wollig und abstehend, Rand flockig fransig. Jung eiförmig, später halbkugelig."
lamellen = "Weiß bis cremefarben, frei, weich, im Alter bräunend, bei Verletzung rötend."
stiel = "6 bis 22, selten bis 25 cm lang, 1 bis 6, selten bis 7 cm dick, weißlich bis hellbräunlich, ohne Natterung, bräunlich überfasert, zäh und faserig. Ring verschiebbar, wattig, abstehend und doppelt. Basis rübenartig verdickt, die Knolle ist nicht abgesetzt und nicht gerandet."
fleisch = "Weiß bis cremefarben, weich, bei Verletzung sofort safranrötlich anlaufend, später bräunend."
geruch = "Angenehm pilzig."
geschmack = "Angenehm pilzartig. Roh unverträglich."
sporenpulver = "Cremefarben."
vorkommen = "Folgezersetzer in Gärten, Heiden und an Waldrändern, in der Regel außerhalb der Wälder, auf nährstoffreichem Boden."
zeit = "Frühsommer bis Spätherbst."

