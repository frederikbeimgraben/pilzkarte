[merkmale]
fruchtkoerper = "6 bis 30, selten bis 50 cm breit, weißlich bis gelblich, später dunkler. Blumenkohlartig krause Struktur mit vielen breiten Verästelungen, elastisch, zäh und brüchig."
stiel = "Ein weißlicher Strunk, der am Boden aus dem Wurzelgeflecht eines Baumes entspringt."
fleisch = "Weiß bis hellgelb, elastisch, zäh, gummiartig, brüchig, jung marmoriert."
geruch = "Angenehm aromatisch, süßlich, teils etwas nach Haselnüssen."
geschmack = "Mild, im Alter bitterlich."
sporenpulver = "Farblos bis weiß."
vorkommen = "Parasit und Folgezersetzer am Wurzelgeflecht von Kiefern, seltener an anderem Nadelholz wie Fichte."
zeit = "Sommer bis Spätherbst."

