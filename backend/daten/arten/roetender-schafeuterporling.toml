[merkmale]
hut = "3 bis 18, selten bis 30 cm breit, weiss, spaeter gelblich, fleischrosa, rosa bis schmutzig weiss. Nach dem Reiben gelblich, teils etwas roetend, filzig, aufreissend, im Alter mit Schuppchen."
poren = "Weiss bis gruenweisslich, gilbend, rundlich bis eckig."
stiel = "Weisslich, bei Verletzung stark gilbend und etwas roetend, oft mit graubraunen, gelbbraunen bis orangeroten Flecken. Meist deutlich laenger als beim Semmelporling, voll, fein filzig, zur Basis verjuengt."
fleisch = "Weiss, fest und bruechig, Druckstellen roetend und gilbend. Er wird im Alter langsamer bitterlich als der Semmelporling."
geruch = "Angenehm pilzig."
geschmack = "Fast nur mild, erst im hohen Alter vereinzelt bitterlich."
sporenpulver = "Weiss, transparent."
vorkommen = "Im Mischwald ueberwiegend bei Nadelbaeumen, vor allem Fichte, auf Nadelstreu oder nacktem Boden, haeufiger auf saurem oder neutralem Boden. Vermutlich Symbiosepilz, nach einigen Autoren auch Folgezersetzer."
zeit = "Sommer bis Spaetherbst."

