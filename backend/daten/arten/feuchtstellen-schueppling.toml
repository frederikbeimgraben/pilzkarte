[merkmale]
hut = "2 bis 5, selten bis 7 cm breit, kastanienbraun bis gelbocker, Mitte rötlich ocker, Rand gelbocker, kahl bis eingewachsen faserig, jung mit wolligen Velumresten, im Alter rissig wie bei einem Risspilz, feucht schmierig."
lamellen = "Hell cremegelb, später zimtbraun, alt dunkel purpurbraun, ausgebuchtet angewachsen, dünn und gedrängt."
stiel = "3 bis 9, selten bis 12 cm lang, 0,4 bis 1,2, selten bis 1,7 cm dick, hell creme, Mitte und Basis rötlich braun, faserig schuppig, mit flüchtigen Schleierresten."
fleisch = "Hellgelb, wässrig, dünn und faserig."
geruch = "Unbedeutend bis grasig."
geschmack = "Mild."
sporenpulver = "Haselnussbraun."
vorkommen = "Folgezersetzer im Mischwald, gern im Auwald bei Weiden, in Gräsern, im Gebüsch und an vergrabenem verrottetem Holz, an sumpfigen, moosig feuchten Stellen. Oft büschelig, selten."
zeit = "Frühsommer bis Herbst."

