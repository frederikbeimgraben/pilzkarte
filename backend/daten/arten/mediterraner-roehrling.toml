[merkmale]
hut = "3 bis 10, selten bis 13 cm breit, gelbbraun, haselnussbraun bis olivbraun, schmierig klebrig, Haut zu drei Vierteln abziehbar, Mitte leicht gebuckelt."
roehren = "Weißlich bis gelblich, später gelbgrün, gelbbraun oder oliv, oft mit gelben Tröpfchen benetzt, kurz und nicht voneinander trennbar."
stiel = "3 bis 8, selten bis 12 cm lang, 1,3 bis 2,7 cm dick, weißlich bis chromgelb mit braunen Drüsenpunkten, robust. Basis leicht verdickt und gern rosaviolett, Myzelfäden rosa."
fleisch = "Zuerst weißlich bis cremegelb, schnell gelb, alt chromgelb, weich."
geruch = "Fruchtig, obstartig, angenehm."
geschmack = "Angenehm süßlich."
sporenpulver = "Ockerlich, olivbraun bis olivgelb."
vorkommen = "Symbiosepilz auf meist kalkreichem Boden in Nadelwäldern, bei Kiefern wie Aleppokiefer, Pinie und See-Kiefer, dazu bei Zypressen. Im Mittelmeerraum sehr häufig."
zeit = "Herbst bis Frühjahr."

[[verwechslungen]]
slug = "elfenbeinroehrling"
unterschied = "Hut weiß bis cremefarben, Röhren weiß, bei fünfnadeligen Kiefern wie Zirbe und Weymouthskiefer."

[[verwechslungen]]
slug = "ringloser-butterpilz"
unterschied = "Hut braun bis kastanienbraun, Röhren gelb, Stielbasis rosa, bei Fichte und Kiefer."

