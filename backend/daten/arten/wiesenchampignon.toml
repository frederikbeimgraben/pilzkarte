[merkmale]
hut = "4 bis 13, selten bis 16 cm breit, kleiner als der Schafchampignon. Haut weiß, alt grau bis graubraun, jung feinschuppig und über den Hutrand hinaus abziehbar. Alt von der Mitte her mit bräunlichen, flach anliegenden Schuppen. Rand meist weißlich und mit Velumresten behangen."
lamellen = "Rosa bis fleischrosa, später dunkelbraun, alt schokoladenbraun, frei."
stiel = "Weiß, brüchig, ohne Knolle und nicht verdickt. Die Spitze löst sich leicht vom Hutfleisch. Ring weiß, einfach und hängend, meist verkümmert und schnell vergänglich."
fleisch = "Weiß, teils gar nicht verfärbend, sonst an der Stielspitze oder im Stiel schwach bis mittelmäßig rötend, an der Basis leicht gelblich."
geruch = "Pilzig, angenehm, kein oder kaum wahrnehmbarer Anisgeruch."
geschmack = "Mild, nussartig."
sporenpulver = "Purpurbraun, dunkelbraun bis schokoladenbraun."
vorkommen = "Folgezersetzer in Gärten, auf Wiesen und Weiden und in Maisfeldern, selten auf Güllewiesen. Oft in Hexenringen."
zeit = "Frühsommer bis Spätherbst."

