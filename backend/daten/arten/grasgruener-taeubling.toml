[merkmale]
hut = "3 bis 10, selten bis 12 cm breit, graugrün bis grasgrün, Mitte meist dunkler. Feucht schmierig, Huthaut bis zur Hälfte abziehbar."
lamellen = "Weiß, im Alter gelblich und braunfleckig, angewachsen bis etwas herablaufend, dicht stehend, am Stiel oft gegabelt. Nur wenig brüchig, feucht recht weich."
stiel = "4 bis 16, selten bis 20 cm hoch und 1 bis 3, selten bis 4 cm dick, weiß, kurz, längsgerieft, zur Basis etwas braunfleckig, im Alter wattig hohl."
fleisch = "Weiß, fest, brüchig und spröde."
geruch = "Neutral."
geschmack = "Mild, nach etwas Kauen leicht schärflich."
sporenpulver = "Gelblich bis cremeweiß."
vorkommen = "Symbiosepilz im Mischwald, gern im Nadelwald unter Fichte oder Kiefer, im Laubwald unter Birke. Häufiger in kälteren Regionen."
zeit = "Frühsommer bis Spätherbst."

