[merkmale]
hut = "2 bis 8, selten bis 10 cm breit, weißlich, cremegelb bis graubräunlich, im Alter silbrig braun, kegelig gewölbt, später ausgebreitet und etwas gebuckelt. Oberfläche eingewachsen radialfaserig und fein behaart, nur schwach hygrophan, Rand lange eingerollt."
lamellen = "Weiß, später leicht rosa, ziemlich dicht, etwas ausgebuchtet angewachsen, mit Zwischenlamellen, zum Stiel vereinzelt gegabelt, manchmal rosa fleckig."
stiel = "3 bis 8, selten bis 14 cm lang und 0,5 bis 1,8, selten 3 cm dick, weißlich bis cremegelb, alt etwas bräunend, feinfaserig, zur Basis meist verdickt. Fraßgänge von Insekten verfärben leicht orangebraun."
fleisch = "Weiß bis grauweiß, faserig, fest, in der Hutmitte dick. Bei Verletzung braunrot, orangebraun bis safranfarben verfärbend."
geruch = "Süßlich obstartig, bei Verletzung mehlig."
geschmack = "Mild, mehlig."
sporenpulver = "Rosa bis hell braunrosa."
vorkommen = "Symbiosepilz von Rosengewächsen, an Waldrändern, in Gärten und Parks unter Schlehe, Weißdorn und Pflaumenbaum, büschelig gedrängt. Selten."
zeit = "Frühling bis Sommer."

