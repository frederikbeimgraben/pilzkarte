[merkmale]
hut = "3 bis 12, selten bis 16 cm breit, elfenbeinfarben, blassgelb, hell cremegelb, bleigrau bis silbrig ockerlich, oft unregelmäßig verbogen, etwas eingewachsen radialfaserig. Jung halbkugelig, alt breitkegelig bis ausgebreitet und gebuckelt, nicht ausbleichend."
lamellen = "Jung meist gelblich bis hellgelb, selten weißlich, später rotocker, rosaocker bis rostgelb, am Stiel ausgebuchtet und fast frei wirkend, praktisch nie herablaufend, am Grund queraderig, mit Zwischenlamellen."
stiel = "5 bis 13, selten bis 17 cm lang, 1 bis 4, selten bis 5 cm dick, weißlich, cremeweiß bis ockerbraun, längsfaserig mit feinen Rillen, dick und kernig. Basis bauchig verdickt bis knollig, Spitze oft heller bereift, im Alter schwammig bis hohl."
fleisch = "Weiß, dick und fest."
geruch = "Unangenehm, säuerlich, mehlig bis säuerlich rettichartig, manchmal etwas süßlich."
geschmack = "Mild, etwas mehlartig, aber unangenehm. Keine Kostversuche."
sporenpulver = "Fleischrötlich."
vorkommen = "Symbiosepilz bei Laubbäumen wie Eiche, Buche und Espe, gern auf lehmigem kalkreichem Boden. Bildet Hexenringe."
zeit = "Frühling bis Spätherbst, häufiger im Herbst."

