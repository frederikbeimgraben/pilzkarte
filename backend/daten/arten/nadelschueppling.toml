[merkmale]
hut = "2 bis 4, selten bis 6 cm breit, zitronengelb, orangegelb bis dunkelgelb, Scheitel fuchsigbraun bis rostbraun, mit Schüppchen besetzt, Rand lange gewölbt. Unter UV-Licht leuchtet er gelblich bis grünlich."
lamellen = "Jung hellgelb, sonst gelb bis hell orangegelb, alt bräunlich, angewachsen und leicht herablaufend, mit Zwischenlamellen."
stiel = "Gelblich bis weißlich, überfasert, oft mit faseriger Ringzone, hohl. Basis oft schmutzig braunschwarz bis olivschwarz."
fleisch = "Hellgelb, im Stiel rostgelb."
geruch = "Holzig, nicht unangenehm."
geschmack = "Bitter."
sporenpulver = "Bräunlich."
vorkommen = "Folgezersetzer im Nadelwald, meist am Boden auf Nadelholz, seltener an Stümpfen und Totholz. Oft büschelig, selten."
zeit = "Sommer bis Herbst."

