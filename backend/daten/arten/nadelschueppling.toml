speisewertHinweis = "Schüpplinge taugen meist nicht als Speisepilze, einige sind giftig. Dieser schmeckt bitter und wächst büschelig an Nadelholz, also dort, wo auch der tödlich giftige Gifthäubling steht."
haeufigkeit = "selten"
