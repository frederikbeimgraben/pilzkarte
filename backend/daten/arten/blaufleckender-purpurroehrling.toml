[merkmale]
hut = "6 bis 12, selten bis 18 cm breit, purpurrot, weinrosa, altrosa bis primelgelb auf gelblichem oder rosa Grund, oft bunt blaukörnig fleckend. Die Oberfläche blaut, Schneckenfraßstellen sind weinrot oder blau. Polsterförmig, samthaarig, filzig und körnig schuppig."
roehren = "Jung gelb bis gelborange, später purpurrot bis blutrot, auf Druck stark blauend. Röhrenboden gelb, am Stiel ausgebuchtet angewachsen und fast frei wirkend."
stiel = "Gelblich mit rötlichem Netz, Spitze gelb, auf Druck schnell blauend, zur Basis zunehmend karminrot bis himbeerrot."
fleisch = "Hellblau, später chromgelb, schnell stark blauend, alt schwammig."
geruch = "Jung säuerlich und angenehm, später aasartig und unangenehm stinkend."
geschmack = "Mild, roh giftig und unverträglich."
sporenpulver = "Rosabraun."
vorkommen = "Im Laubwald auf kalkreichem Boden. In der Schweiz verletzlich, in Deutschland extrem selten."
zeit = "Frühsommer bis Spätsommer."

[[verwechslungen]]
name = "Blasshütiger Purpurröhrling"
merkmal = "Huthaut weißlich bis olivgrau und nicht blauend, Fleisch blaut nur wenig im Hut und in der Stielspitze."
essbar = "giftig"

[[verwechslungen]]
name = "Falscher Satansröhrling"
merkmal = "Stiel kräftig rot mit rotem Netz, Geruch unbedeutend bis neutral."
