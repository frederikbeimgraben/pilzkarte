geschmack = "Mild und nussartig."
sporenpulver = "Purpurbraun bis dunkelbraun."
vorkommen = "Folgezersetzer auf Wiesen und Weiden, in Gärten, unter Hecken und am Straßenrand."
zeit = "Frühsommer bis Spätherbst."

