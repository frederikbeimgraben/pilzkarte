[merkmale]
hut = "3 bis 15, selten bis 18 cm breit, hellbraun, manchmal dunkelbraun wie beim Maronenröhrling, außergewöhnlich selten mit rötlicher Kappe."
roehren = "Jung weiß, später rosa, auf Druck teils etwas dunkler rosa."
stiel = "Hellbraun bis braun, mit grobem braunem Netz überzogen, zur Spitze heller."
fleisch = "Weiß, kaum verfärbend, selten leicht blauend, im Hut und über den Röhren etwas rosa."
geruch = "Säuerlich, pilzartig."
geschmack = "Immer sehr bitter."
sporenpulver = "Rosa."
vorkommen = "Symbiosepilz von Nadelbäumen in Misch- und Nadelwald auf saurem Boden, gern in Trockenperioden."
zeit = "Frühjahr bis Spätherbst."

