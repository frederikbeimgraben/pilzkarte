jahreszeiten = ["fruehling", "sommer", "herbst"]
baeume = []
karte = "schopftintling"
speisewertHinweis = "Roh etwas unverträglich. Nur junge, ganz weiße Fruchtkörper nehmen und rasch verarbeiten; rötliche oder schwarze Teile sind nicht mehr brauchbar."

[quelle]
url = "https://www.123pilzsuche.de/daten/details/Schopftintling.htm"
geprueftAm = "2026-09-10"

[merkmale]
hut = "2 bis 9, selten bis 15 cm breit, weißlich und geschuppt, am Scheitel mit glattem bräunlichem Häubchen. Lang gezogen eiförmig bis walzenförmig, später schwarz zerfließend."
lamellen = "Weiß, bald rosa, zuletzt schwarz zerfließend, frei."
stiel = "4 bis 17, selten bis 22 cm lang, 1 bis 1,3, selten bis 1,6 cm dick, weiß, später rötend, im Alter schwarz zerfließend. Mit vergänglichem, tief sitzendem, lockerem weißem Ring, Basis etwas knollig."
fleisch = "Weiß, später rötend, im Alter schwarz zerfließend."
geruch = "Angenehm pilzig bis neutral."
geschmack = "Pilzig, mild, süßlich. Roh etwas unverträglich."
sporenpulver = "Schwarz."
vorkommen = "Folgezersetzer in Parks, Gärten, auf Wiesen sowie an Waldwegen und Waldrändern, auf nährstoffreichem Boden, feuchtigkeitsliebend. Er fängt zusätzlich Fadenwürmer und zersetzt sie."
zeit = "Frühling bis Spätherbst."

