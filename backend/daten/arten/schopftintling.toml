zeit = "Frühling bis Spätherbst."

[[verwechslungen]]
slug = "faltentintling"
unterschied = "Hut grauweiß bis graubraun, gerieft und faltig, Lamellen angewachsen statt frei, Stielbasis mit scheidenartigem Wulst."

[[verwechslungen]]
slug = "flockiger-tintling"
unterschied = "Hut graubraun bis ockerbräunlich mit weißlichen Velumflocken, Stielbasis oft mit Volva."

[[verwechslungen]]
slug = "perlhuhn-tintling"
unterschied = "Hut ungerieft, mit abwischbaren grauweißen Schuppen, Stielbasis mit dunkelbraunem Mycel, Geruch unangenehm, wächst auf Holz."

[[verwechslungen]]
slug = "spechttintling"
unterschied = "Hut braun mit weißen flockigen Schuppen, Stiel bis 25 cm lang und etwas genattert, Geruch muffig."

[[verwechslungen]]
slug = "spitzkegeliger-tintling"
unterschied = "Hut grauweiß mit braunen Schuppen, gerieft, Scheitel stumpf zugespitzt, Stielbasis mit ringartigem Wulst."

