[merkmale]
hut = "3 bis 15, selten bis 20 cm breit, braun, violett bis blau, stark schmierig und schleimig, oft mit schwarzbraunen Flecken. Die Huthaut lässt sich leicht abziehen."
lamellen = "Jung weißlich, später grau bis graubraun, dick, wachsartig, herablaufend, leicht ablösbar. Jung von einer Schleimschicht überzogen."
stiel = "Weißlich, zur Spitze abnehmend gelblich, Basis kanariengelb, sehr schleimig."
fleisch = "Weißlich, alt grau, unter der Huthaut bräunlich, in der Stielbasis kanariengelb."
geruch = "Neutral."
geschmack = "Mild."
sporenpulver = "Schwarzbraun."
vorkommen = "Symbiosepilz im Nadelwald bei Fichte, auf saurem Boden."
zeit = "Frühsommer bis Herbst."

