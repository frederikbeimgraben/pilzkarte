[[reagenzien]]
reagenz = "koh"
reaktion = "Rasch rosa bis rot, unter der Huthaut orange, an den Poren nur schwach. Ganz junge Fruchtkörper reagieren teils nicht."

[merkmale]
hut = "4 bis 12, selten bis 20 cm breit, gelbgrün, olivgrün bis gelbbraun. Rand wellig und unregelmäßig verbogen, Oberfläche samtig, lederig bis schuppig aufgerissen."
poren = "Weiß, später gelblich, herablaufend, sehr kurz, eckig-rundlich bis eckig, etwa 1 bis 4 je Millimeter."
stiel = "3 bis 7, selten bis 9 cm lang und 1 bis 4, selten bis 5 cm dick. Weißlich bis gelbgrünlich, strunkartig und sehr kurz, mittig bis seitlich angesetzt."
fleisch = "Jung weiß, innen blass oliv, später gelb, zäh, lederig und trocken."
geruch = "Unangenehm, stinkend, teils mit leichtem Pilzgeruch."
geschmack = "Unangenehm und bitterlich."
sporenpulver = "Weiß, durchscheinend."
vorkommen = "Symbiosepilz im Mischwald, meist mit Laubbäumen, gern bei Buche, Eiche und Kastanie, seltener bei Tanne, Lärche oder Fichte. Selten."
zeit = "Sommer bis Spätherbst."

