[merkmale]
hut = "2 bis 9, selten bis 12 cm breit, rotbraun, kastanienbraun bis ziegelrotbraun, meist mit kleinem Buckel, spaeter abgeflacht und trichterfoermig. Rand eingerollt und meist heller, Haut manchmal blass bereift und uneben."
lamellen = "Jung cremefarbig, spaeter ockerlich fleischroetlich, leicht bogig, Schneiden glatt."
milch = "Weiss, ohne Verfaerbung."
stiel = "2 bis 7, selten bis 9 cm lang und 0,6 bis 1,3, selten bis 1,6 cm dick, jung weisslich mit rosa bis rotbraunem Ton, spaeter zunehmend rotbraun bis ziegelrotbraun und heller als der Hut, im Alter hohl."
fleisch = "Blass bis rotbraeunlich, in der Stielrinde rotbraun."
geruch = "Harzig."
geschmack = "Zuerst mild, nach etwa einer Minute extrem scharf."
sporenpulver = "Cremeweiss mit leichtem lachsrosa Ton."
vorkommen = "Symbiosepilz im Mischwald, bevorzugt bei Nadelholz wie Kiefer und Fichte, seltener bei Birke und Buche, gern an moosigen Stellen."
zeit = "Sommer bis Spaetherbst."

