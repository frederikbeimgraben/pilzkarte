geschmack = "Unbedeutend."
sporenpulver = "Weiß, transparent."
vorkommen = "Folgezersetzer und Weißfäuleerreger an Totholz von Laubbäumen, bevorzugt Esche, Pappel, Buche und Birke, an Stümpfen und an Baumrinde. In Wäldern und Parkanlagen, gern in Auwäldern und Flussniederungen."
zeit = "Ganzjährig."

