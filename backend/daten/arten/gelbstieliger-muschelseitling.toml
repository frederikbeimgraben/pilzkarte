[merkmale]
hut = "3 bis 15, selten bis 22 cm breit, grünbraun, grünocker, schwarzbraun, grau bis graubraun, muschelförmig und fein braunfilzig. Die Farben sind veränderlich, Rand jung eingerollt."
lamellen = "Jung weißlich, später cremegelb bis ockerlich, gedrängt, gerade angewachsen und am Stiel herablaufend, dort aber nach unten scharf abgegrenzt. Auf Druck und im Alter gelbbraun verfärbend."
stiel = "1 bis 4, selten bis 5 cm lang und 1 bis 5, selten bis 6 cm dick. Ockergelblich, grüngelb bis gelbbraun mit bräunlichen Schüppchen, kurz, zur Anwachsstelle zugespitzt."
fleisch = "Weißlich bis ockerlich, zäh."
geruch = "Leicht pilzig."
geschmack = "Mild bis etwas bitterlich."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer, teils parasitisch, auf Laubholz, gern zusammen mit dem Austernseitling am selben Stamm."
zeit = "Herbst bis Frühling."

