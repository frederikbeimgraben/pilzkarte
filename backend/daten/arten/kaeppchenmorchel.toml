[merkmale]
fruchtkoerper = "2 bis 4,5, selten bis 6 cm breit, hellbraun, dunkelbraun bis gelbbraun. Wabenartiges Käppchen, innen hohl, meist zugespitzt. Es ist nur zu etwa einem Drittel mit dem Stiel verwachsen, der übrige Rand steht frei ab."
stiel = "Weißlich bis gelblich oder gelbbraun, dünnfleischig, runzelig furchig, hohl. Die Außenhaut trägt große körnige weiße Schüppchen."
fleisch = "Weißlich bis gelblich, dünn, wachsartig, sehr zerbrechlich."
geruch = "Angenehm."
geschmack = "Mild. Roh giftig, nicht kosten."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer in Mischwald und Auwald, gern bei Pappeln und Espen oder im Rindenmulch. Oft zusammen mit Spitzmorcheln. Funde aus Rindenmulch schmecken schwächer als die aus dem Auwald."
zeit = "Februar bis Juni, in kälteren Lagen nicht vor Anfang April."

[[verwechslungen]]
