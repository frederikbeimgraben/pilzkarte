[merkmale]
hut = "4 bis 16, selten bis 20 cm breit, braun bis gelbbraun, mit gelblichen pyramidalen, abwischbaren grauweißen Velumflocken, selten nackt. Oberfläche glänzend, feucht schmierig, Haut bis zur Mitte abziehbar."
lamellen = "Weiß bis hellgelblich, dicht stehend, wellig und uneben, frei bis leicht angewachsen, Schneiden flockig."
stiel = "7 bis 16, selten bis 20 cm lang und 2 bis 4, selten bis 6 cm dick, hellgelb, jung voll, alt hohl. Basis knollig und warzig, bräunlich gegürtelt mit grob flockigen Velumzonen. Ring weiß mit jung gelbem, warzigem Rand, schlapp herabhängend."
fleisch = "Weiß, unter der Huthaut mit gelber, gelbbrauner bis gelbgrüner Übergangszone."
geruch = "Angenehm pilzig bis neutral."
geschmack = "Mild, angenehm."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz im Nadelwald, gern bei Fichte, auf saurem Boden."
zeit = "Frühsommer bis Spätherbst."

