name = "Erdritterling"
lateinisch = "Tricholoma terreum"
gruppe = "ritterling"
speisewert = "essbar"
geschuetzt = false
jahreszeiten = ["herbst"]
baeume = ["kiefer"]
speisewertHinweis = "Nur für Kenner der Gattung. Die grauen Ritterlinge sind schwer zu trennen und einige machen Muskelschäden."

[merkmale]
hut = "3 bis 8 cm, mausgrau, dicht filzig bis feinschuppig, trocken, mit stumpfem Buckel."
lamellen = "Weißlich bis grau, ausgebuchtet, ziemlich entfernt."
stiel = "Weißlich, faserig, ohne Ring, brüchig."
fleisch = "Weiß, dünn, unveränderlich."
geruch = "Unauffällig, nicht mehlig."
geschmack = "Mild."
sporenpulver = "Weiß."
vorkommen = "Mykorrhiza mit Kiefer, auf Kalk, an Wegrändern und in lichten Forsten, in Trupps."
zeit = "September bis November."

[[verwechslungen]]
name = "Andere graue Ritterlinge"
merkmal = "Geruch oder Geschmack mehlig oder scharf. Mehrere Arten sind giftig."
essbar = "giftig"

[[verwechslungen]]
name = "Schwarzfaseriger Ritterling"
merkmal = "Hut glatt und schmierig, mit gelblichem Ton."
essbar = "speisepilz"

