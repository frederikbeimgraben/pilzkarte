sporenpulver = "Weiß."
vorkommen = "Symbiosepilz mit Nadelbäumen, gern Kiefer, Fichte, Tanne und Douglasie, auf nährstoffreichen und oft kalkhaltigen Böden. In Mischwald, Nadelwald, Wiesen und Parks."
zeit = "Frühsommer bis Spätherbst, im Herbst häufiger."

