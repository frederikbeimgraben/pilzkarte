name = "Böhmische Verpel"
lateinisch = "Verpa bohemica"
gruppe = "morchel"
speisewert = "speisepilz"
geschuetzt = false
jahreszeiten = ["winter", "fruehling"]
baeume = ["pappel", "weide"]
speisewertHinweis = "Roh giftig wie alle Morcheln. Durchgaren. Riecht der Fund fischartig, ist er verdorben."
schutzHinweis = "Die Verordnung nennt die Morcheln (Morchella). Die Verpeln stehen nicht darin, werden aber leicht mit ihnen verwechselt."

[quelle]
url = "https://www.123pilzsuche.de/daten/details/BoehmischeVerpel.htm"
geprueftAm = "2026-09-10"

[merkmale]
fruchtkoerper = "Käppchen 2 bis 4, selten bis 5 cm breit und 1 bis 8 cm hoch, hellbeige bis dunkelbraun, runzelig labyrinthartig mit hochgestellten Längs- und Querrillen. Der Rand ist heller und nach oben gebogen."
stiel = "7,5 bis 14,5 cm lang, 1 bis 2 cm breit, weißlich bis gelbbraun, flockig genattert, gekammert wattig hohl. Nur an der Spitze flach mit dem Käppchen verwachsen."
fleisch = "Weißlich, zum Stielrand gelblich, dünn, wachsartig, zerbrechlich."
geruch = "Angenehm pilzartig bis spermatisch."
geschmack = "Mild."
sporenpulver = "Kräftig ockergelb."
vorkommen = "Folgezersetzer in Misch- und Auwald, gern in Rindenmulch, oft zusammen mit Spitzmorcheln. In Deutschland gefährdet."
zeit = "Februar bis Juni, in kälteren Lagen nicht vor Anfang April."

