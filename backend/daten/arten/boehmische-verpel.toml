name = "Böhmische Verpel"
lateinisch = "Verpa bohemica"
gruppe = "morchel"
speisewert = "nichtEmpfohlen"
geschuetzt = false
jahreszeiten = ["fruehling"]
baeume = ["pappel", "weide"]
speisewertHinweis = "Wird nicht empfohlen. Es sind Vergiftungen mit Störungen der Bewegungssteuerung beschrieben."
schutzHinweis = "Die Verordnung nennt die Morcheln (Morchella). Die Verpeln stehen nicht darin, werden aber leicht mit ihnen verwechselt."

[merkmale]
hut = "2 bis 5 cm, glockig, ockerbraun, längs runzelig gefaltet, ohne Kammern. Er hängt wie ein Fingerhut nur am Scheitel des Stiels."
stiel = "Lang, weiß, hohl, kleiig bereift."
fleisch = "Dünn, brüchig."
geruch = "Unauffällig."
geschmack = "Nicht kosten."
sporenpulver = "Cremeweiß."
vorkommen = "In Auwäldern unter Pappel und Weide, auf feuchtem Kalkboden. Sehr früh im Jahr."
zeit = "März bis April."

