[merkmale]
hut = "1 bis 8, selten bis 11 cm breit, dunkelbraun, olivumbrabraun, olivschwarz, kastanienbraun, schwarzbraun bis rußbraun, jung leicht radialfaserig. Huthaut kahl, mit einer dicken knorpeligen Schicht wie gepanzert. Rand lange eingerollt."
lamellen = "Weiß bis gelblich oder cremefarben, nahe am Stiel oft mit fleischfarbenem Hauch, breit angewachsen."
stiel = "Weißlich, hellbraun bis gelbbraun, längsfaserig, Spitze mehlig weißlich, Basis wurzelnd."
fleisch = "Weiß bis grauweiß, unter der Huthaut stark bräunlich durchfärbt, knorpelig, zäh und elastisch, alt bräunlich wässrig."
geruch = "Neutral bis obstartig süßlich."
geschmack = "Mild, angenehm, süßlich."
sporenpulver = "Rein weiß."
vorkommen = "Folgezersetzer auf grasigen Wegen, an Wegrändern und in Parks, kalkliebend. Meist büschelig aus einem Strunk."
zeit = "Frühsommer bis Spätherbst."

