sporenpulver = "Rein weiß."
vorkommen = "Folgezersetzer auf grasigen Wegen, an Wegrändern und in Parks, kalkliebend. Meist büschelig aus einem Strunk."
zeit = "Frühsommer bis Spätherbst."

