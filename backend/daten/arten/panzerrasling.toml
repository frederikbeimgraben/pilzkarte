hut = "1 bis 8, selten bis 11 cm breit, dunkelbraun, olivumbrabraun, olivschwarz, kastanienbraun, schwarzbraun bis rußbraun, jung leicht radialfaserig. Huthaut kahl, mit einer dicken knorpeligen Schicht wie gepanzert. Rand lange eingerollt."
