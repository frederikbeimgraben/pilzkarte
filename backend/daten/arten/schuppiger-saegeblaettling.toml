name = "Schuppiger Sägeblättling"
lateinisch = "Neolentinus lepideus"
gruppe = "seitling"
speisewert = "ungeniessbar"
geschuetzt = false
sammelbar = false
jahreszeiten = ["fruehling", "sommer", "herbst"]
baeume = ["laerche", "kiefer"]
speisewertHinweis = "Ungenießbar, weil das Fleisch rasch zäh wird. Nur ganz junge Fruchtkörper gelten als essbar."

[quelle]
url = "https://www.123pilzsuche.de/daten/details/SchuppigerSaegeblaettling.htm"
