[merkmale]
hut = "3 bis 10, selten bis 16 cm breit, auf gelblichem Grund mit rotbraunen bis kastanienbraunen Schuppen, die von der Mitte zum Rand stehen. Rand lange eingerollt und scharfkantig."
lamellen = "Weiß, später gelblich, herablaufend, Schneiden stark gesägt, jung mit Guttationstropfen."
stiel = "5 bis 10, selten bis 15 cm lang und 1 bis 4, selten 5 cm dick, weißlich, unter der vergänglichen Ringzone gelbschuppig, zur Basis zunehmend braun- bis rotschuppig."
fleisch = "Weiß, jung weich, später zäh, besonders im Stiel."
geruch = "Nach Anis, pilzig, nach Perubalsam oder gärendem Obst."
geschmack = "Mild, pilzig."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer an Nadelholz und Totholz, gern bei Lärche und Kiefer, auch an Eisenbahnschwellen, Pfählen und Holzbrücken. Löst deutliche Würfelbraunfäule aus und gilt als Gebäudeschädling."
zeit = "Selten schon im Frühling, meist Sommer bis Herbst."

