karte = "flaschenbovist"
speisewertHinweis = "Nur jung, solange das Innere rein weiß ist. Jedes Stück durchschneiden."

[merkmale]
fruchtkoerper = "3 bis 7 cm, flaschen- bis birnenförmig mit einem verjüngten Fuß, weiß bis cremefarben, mit abwischbaren Stacheln und Warzen besetzt."
fleisch = "Jung rein weiß und fest, dann gelb, zuletzt olivbraun und pulverig. Am Scheitel öffnet sich ein Loch."
geruch = "Jung angenehm pilzig."
geschmack = "Mild."
sporenpulver = "Olivbraun."
vorkommen = "Zersetzer in Wäldern aller Art, an Wegrändern und auf Lichtungen, meist in Gruppen."
zeit = "Juli bis November."

