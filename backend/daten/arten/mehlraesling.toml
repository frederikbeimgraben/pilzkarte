[[reagenzien]]
reagenz = "koh"
reaktion = "Auf dem Hut ohne Reaktion."

[merkmale]
hut = "2 bis 15, selten bis 20 cm breit, weiß, grauweiß bis braungrau, fein bereift und samtig. Mitte unregelmäßig vertieft, teils mit leichten Buckeln, Rand eingerollt und wellig mit brüchigen Kanten. Ein Fingerdruck bleibt oft sichtbar."
lamellen = "Weiß mit leichtem Gelb- oder Rotton, angewachsen und herablaufend, biegsam und weich, mit verkürzten Zwischenlamellen, leicht verschiebbar und ablösbar."
stiel = "2 bis 10, selten bis 18 cm lang, bis 1,5, selten bis 2 cm dick, weiß, dick, voll, Basis weißfilzig."
fleisch = "Weiß, fest, zart und brüchig."
geruch = "Stark mehlartig, bei Verletzung sehr stark gurkig, beim Abtrocknen eher käsig mehlig. Am besten wahrnehmbar, wenn man die Lamellen verschiebt."
geschmack = "Stark mehlartig, mild."
sporenpulver = "Rosa, rosabraun bis hell braunrosa."
vorkommen = "Im Mischwald. Die Seite führt ihn als Symbiosepilz, als Parasit und vermutlich auch als Folgezersetzer. Er gilt als Zeiger für Steinpilze am selben Ort."
zeit = "Frühsommer bis Spätherbst."

[[verwechslungen]]
name = "Bleiweißer Trichterling"
merkmal = "Sporenpulver weiß bis leicht gelblich statt rosa, Geruch süßlich aromatisch ohne Mehlnote, dünnfleischiger und wässrig zäh."
essbar = "toedlichGiftig"
slug = "bleiweisser-trichterling"

