fruchtkoerper = "2 bis 6, selten bis 8 cm breit, kugelig bis birnenförmig und kopfig gestielt, bräunlich, selten mit Lilaton, mit dunkelbraunen kleiigen bis flockigen Warzen. Oben mit Sporenöffnung, Basisteil steril und stark im Substrat wurzelnd. Oft büschelig."
