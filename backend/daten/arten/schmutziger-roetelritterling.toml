[merkmale]
hut = "2 bis 6, selten bis 7 cm breit, der kleinste Rötelritterling, blass bis stark lila oder rosaviolett, hygrophan und beim Trocknen heller werdend, Haut glatt, Rand lange eingerollt."
lamellen = "Schmutzig weiß, graurosa bis blass lila, am Stiel ausgebuchtet angewachsen bis herablaufend, leicht ablösbar, Schneiden fein gekerbt und gleichfarbig."
stiel = "Kahl, blass blaulila bis rötlich lila, Oberfläche etwas weißlich überfasert."
fleisch = "Helllila bis hellgrau, im Zentrum weiß, im Alter bräunlich."
geruch = "Leicht parfümiert, etwas pilzig bis nussartig, schwächer als beim Violetten Rötelritterling. Bei feuchtem Wetter den Fruchtkörper in der Hand zerkrümeln und anwärmen: dann fast unauffällig, teils etwas staubartig. Alte Stücke riechen unangenehm bis fischig."
geschmack = "Mild, dumpf, eventuell etwas süßlich."
sporenpulver = "Blassrosa."
vorkommen = "Folgezersetzer auf Wiesen, in Mischwäldern und Fichtenwäldern sowie auf Kompost, einzeln oder büschelig."
zeit = "Frühling bis Winteranfang."

