geruch = "Säuerlich bis krautartig, nach Totholz, selten neutral."
geschmack = "Mild, etwas moderig, nach totem Holz."
sporenpulver = "Hellgelb."
vorkommen = "Folgezersetzer im Nadelwald auf Nadelstreu, seltener im Laubwald an Strünken oder vergrabenem Holz."
zeit = "Sommer bis Winter."

