[merkmale]
hut = "2 bis 12, selten bis 15 cm breit, leuchtend orange, feinfilzig, Rand lange eingerollt."
lamellen = "Gelb bis orangegelb, herablaufend, vielfach gegabelt, dicht untereinander, ablösbar und leicht verschiebbar. Bei den Leistlingen sind die Leisten fest mit dem Fleisch verwachsen und nur selten gegabelt."
stiel = "2 bis 10, selten bis 15 cm lang, 5 bis 10, selten bis 15 mm dick, orangegelb bis braunorange, vereinzelt weißlich, biegsam, knorpelig weich, meist hohl und zäh."
