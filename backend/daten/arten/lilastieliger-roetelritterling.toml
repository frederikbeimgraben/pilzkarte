[merkmale]
hut = "4 bis 12, selten bis 15 cm breit, grauviolett, beigebräunlich, graubräunlich bis graublau, nie ganz braun ohne rotviolette Töne. Hygrophan, Huthaut glatt und leicht bereift, manchmal etwas fleckend, Rand lange eingerollt, später scharfkantig."
lamellen = "Weißlich lila bis blass violettblau, am Stiel ausgebuchtet angewachsen, leicht ablösbar."
stiel = "Blass blaulila bis rötlichlila, etwas überfasert, kahl, voll. Basis verdickt und manchmal etwas gilbend."
fleisch = "Weißlich lila bis hellgrau, alt graubraun, im Zentrum lange weiß bleibend."
geruch = "Leicht fruchtig, parfümiert, nicht so kräftig wie beim Violetten Rötelritterling."
geschmack = "Mild, leicht süßlich."
sporenpulver = "Blassrosa."
vorkommen = "Folgezersetzer auf Wiesen und Weiden, in Laubwäldern und Parkanlagen, meist gesellig in Reihen oder Hexenringen. In Deutschland gefährdet."
zeit = "Herbst bis Winteranfang, selten im Frühling."

