fleisch = "Weißlich lila bis hellgrau, alt graubraun, im Zentrum lange weiß bleibend."
geruch = "Leicht fruchtig, parfümiert, nicht so kräftig wie beim Violetten Rötelritterling."
geschmack = "Mild, leicht süßlich."
sporenpulver = "Blassrosa."
vorkommen = "Folgezersetzer auf Wiesen und Weiden, in Laubwäldern und Parkanlagen, meist gesellig in Reihen oder Hexenringen. In Deutschland gefährdet."
zeit = "Herbst bis Winteranfang, selten im Frühling."

