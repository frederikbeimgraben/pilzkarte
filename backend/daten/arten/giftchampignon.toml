name = "Giftchampignon"
lateinisch = "Amanita phalloides (var. amanita phalloides f. citrina, amanita phalloides f. dunensis, amanita phalloides var. umbrina, amanita phalloides var. euphalloides, amanita phalloides var. larroquei, amanita phalloides var. pulla, amanita phalloides var. verna, amanita phalloides var. striatula)"
gruppe = "wulstling"
speisewert = "toedlichGiftig"
geschuetzt = false
marktfaehig = false
sammelbar = false
jahreszeiten = ["sommer", "herbst"]
baeume = ["eiche", "buche"]
speisewertHinweis = "Absolut tödlich giftig, schon etwa 20 Gramm genügen und das Gift schädigt die Leber. Zu erkennen an der häutigen, eierschalenartigen Volva an der Stielknolle, am hängenden Ring, an den stets weißen Lamellen und am nicht gerieften Hutrand. Niemals kosten."
haeufigkeit = "haeufig"
weitereNamen = ["Grüner Knollenblätterpilz", "Grüner Mörder"]

[quelle]
url = "https://www.123pilzsuche.de/daten/details/GruenerKnollenblaetterpilz0904.htm"
geprueftAm = "2026-09-10"

[[reagenzien]]
reagenz = "koh"
reaktion = "Fleisch und Huthaut ohne Verfärbung, anders als beim Kegelhütigen Knollenblätterpilz, der gelb wird."

[masse]
hutBreiteCm = { von = 3.0, bis = 15.0, seltenBis = 17.0 }
stielLaengeCm = { von = 5.0, bis = 12.0, seltenBis = 15.0 }
sporenLaengeUm = { von = 7.0, bis = 12.0 }
sporenBreiteUm = { von = 6.0, bis = 10.0 }

[merkmale]
hut = "3 bis 15, selten bis 17 cm breit, grünlich, gelb, ocker, bräunlich, olivgrün, olivbraun bis grüngrau, ganz jung auch weiß. Jung eiförmig-halbkugelig mit weißer Gesamthülle, später aufschirmend. Huthaut fein radialfaserig eingewachsen, feucht etwas klebrig, Rand nicht gerieft."
lamellen = "Weiß, eng stehend, frei bis fein angewachsen, oft mit Zahn herablaufend."
stiel = "5 bis 12, selten bis 15 cm lang und 1 bis 4, selten bis 6 cm dick. Weiß bis gelbgrünlich, faserig, oft genattert. Basis zwiebelknollig mit häutiger, eierschalenartiger Volva. Ring weiß bis gelblich, häutig, hängend, oben meist leicht gerieft."
fleisch = "Weiß, unter der Huthaut gelbgrünlich, beim Schneiden unveränderlich."
geruch = "Jung geruchlos, nach Kleeheu, süßlich oder kunsthonigartig, alt widerlich, aasartig bis nach Ammoniak."
geschmack = "Mild, süßlich und angenehm. Kostproben sind wegen der Leberschädigung lebensgefährlich."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz meist bei Laubbäumen, vor allem Eiche und Buche, selten bei Nadelbäumen, auch in Parks und Gärten. Häufig."
zeit = "Frühsommer bis Spätherbst."

[[verwechslungen]]
slug = "weisser-knollenblaetterpilz"
unterschied = "Hut rein weiß statt grünlich, sonst gleich gebaut und ebenso tödlich."

[[verwechslungen]]
slug = "frauentaeubling"
unterschied = "Fleisch spröde, Lamellen brechen, ohne Ring und ohne Volva."

