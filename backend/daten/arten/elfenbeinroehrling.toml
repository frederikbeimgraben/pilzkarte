[merkmale]
hut = "2 bis 11, selten bis 15 cm breit, weiß bis cremefarben, alt gelbbraun, schleimig und abziehbar, im Alter trocken. Jung halbkugelig, später abgeflacht und teils etwas gebuckelt."
roehren = "Weiß, später gelblich, ein bis zwei je Millimeter, bis 1 cm tief, eckig, herablaufend."
stiel = "5 bis 10, selten bis 12 cm lang und 5 bis 11, selten bis 15 mm dick, zylindrisch, weiß, cremegelb bis gelb, mit braunen Pünktchen, die sich leicht harzig anfühlen. Myzel weißlich."
fleisch = "Weißlich bis cremegelb, später gelblich, etwas faserig brüchig."
geruch = "Pilzig und angenehm."
geschmack = "Mild und angenehm."
sporenpulver = "Gelboliv."
vorkommen = "Symbiosepilz bei fünfnadeligen Kiefern, nämlich Zirbelkiefer und Weymouthskiefer. Im Bayerischen Wald zunehmend häufiger, in Deutschland gefährdet."
zeit = "Frühsommer bis Herbst."

[[verwechslungen]]
