fleisch = "Weißlich, im Alter hell bräunlich."
geruch = "Mehlartig, nicht parfümiert wie bei der Nebelkappe."
geschmack = "Leicht mehlartig, mild, dumpf."
sporenpulver = "Rosabraun."
vorkommen = "Folgezersetzer in Parks, auf Wiesen, an Waldrändern und Waldwegen."
zeit = "Spätsommer bis Spätherbst."

