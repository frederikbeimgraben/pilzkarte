[merkmale]
hut = "2 bis 8, selten bis 11 cm breit, graubraun mit konzentrischen Wasserflecken, faserig. Rand wellig, verbogen und meist hochgebogen."
lamellen = "Weißlich, später cremerosa bis graurosa, etwas herablaufend, vor dem Stiel kaum ausgebuchtet. Sie lassen sich leicht ablösen und stark am Fleisch verschieben."
