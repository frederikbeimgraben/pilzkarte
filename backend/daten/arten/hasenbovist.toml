[merkmale]
fruchtkoerper = "3 bis 16, selten bis 18 cm breit, weiß, später grau, ballon-, sack- oder kreiselförmig. Jung mit plattenartigen, etwas spitzkegeligen Erhebungen, die im Alter verschwinden."
fleisch = "Zuerst weiß und schwammig, jung zweigeteilt, später gelbgrün, alt eine olivbraune pulverige Sporenmasse."
geruch = "Angenehm."
geschmack = "Mild und angenehm, im Alter unangenehm karbolartig."
sporenpulver = "Olivbraun bis dunkelbraun."
vorkommen = "Folgezersetzer auf Wiesen, Weiden, Rasen, in Hecken und Obstgärten, besonders in Gebirgslagen."
zeit = "Frühsommer bis Herbst."

[[verwechslungen]]
slug = "weisser-knollenblaetterpilz"
unterschied = "Jung kugelig, im Schnitt aber mit Hut, Lamellen und Stiel angelegt, Basis in einer häutigen Scheide."

[[verwechslungen]]
slug = "riesenbovist"
unterschied = "Deutlich größer, kugelig, Haut glatt und lederartig, Geruch unangenehm."

[[verwechslungen]]
slug = "flaschenbovist"
unterschied = "Kleiner, keulig bis birnenförmig mit stielartigem Fuß, mit körnigen Stacheln besetzt."

[[verwechslungen]]
slug = "beutelstaeubling"
unterschied = "Kleiner, bis 25 cm hoch, Außenhaut mit spitzen ablösbaren Warzen, Fleisch alt purpurbraun."

[[verwechslungen]]
slug = "wiesenstaeubling"
unterschied = "Kleiner, kugel- bis birnenförmig, Basis mit weißem Myzelfilz und kräftigen Strängen."

