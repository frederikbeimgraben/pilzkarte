[merkmale]
hut = "3 bis 25, selten bis 40 cm breit, blassbraun bis weißlich hellgelb, konzentrisch mit erst hellbraunen, im Alter dunkelbraunen Schuppen besetzt, normalerweise ohne Wimpern am Rand. Rand lange eingerollt."
poren = "Weißlich bis blassgelb, eckig, herablaufend, ein bis zwei Poren je Millimeter."
stiel = "Dickfleischig, weißlich bis hellbräunlich mit netzartiger Zeichnung, exzentrisch bis seitlich angesetzt. Basis zuerst gelblich, im Alter schwarz."
fleisch = "Weiß bis cremeweiß, jung wässrig weich, im Alter sehr zäh."
geruch = "Gurkenartig, mehlig, honigartig."
geschmack = "Mild, mehl- bis nussartig."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer an Laubholz, gern büschelig zusammenwachsend, löst Weißfäule aus."
zeit = "Frühjahr bis Sommer, Fruchtkörper sind ganzjährig zu finden."

