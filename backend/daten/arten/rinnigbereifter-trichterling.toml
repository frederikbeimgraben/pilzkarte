[merkmale]
hut = "2 bis 10, selten bis 13 cm breit, weisslich, elfenbeinweiss bis etwas ockerlich. Rand jung heller, eingerollt und weiss bereift, spaeter mit konzentrisch angeordneten ockerlichen Flecken. Glatt und wachsartig, feucht nicht schleimig, Huthaut nicht abziehbar."
lamellen = "Weiss, cremegrau, hellbraun bis beige, fast gerade angewachsen, sporadisch minimal herablaufend, sehr gedraengt, mit Zwischenlamellen, teils gegabelt."
stiel = "2 bis 3, selten bis 4 cm lang und 0,4 bis 0,7, selten bis 0,9 cm dick, weisslich, faserig, blass ockerrosa, Spitze bereift, im Alter rosabraeunlich und hohl werdend. Zylindrisch und gleich dick."
fleisch = "Weisslich bis blass ockerbraeunlich, duenn, Stielrinde etwas heller."
geruch = "Suesslich-pilzartig, saeuerlich fruchtig, nicht mehlartig und nicht nach Anis."
geschmack = "Mild, oft angenehm pilzartig, etwas adstringierend."
sporenpulver = "Weiss bis hell cremeweiss."
vorkommen = "Folgezersetzer an pflanzlichen Abfaellen auf Wiesen, Feldern, in Parks sowie an Weg- und Waldraendern, auf saurem Boden."
zeit = "Sommer bis Spaetherbst."

