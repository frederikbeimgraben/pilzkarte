lamellen = "Hellbraun, nussbraun bis zimtbraun, angeheftet, schmal, gedrängt, leicht herablaufend, mit Zwischenlamellen."
stiel = "1 bis 10, selten bis 15 cm lang, 3 bis 12, selten bis 18 mm dick. Oberhalb des Rings hellgelb und glatt, darunter mit abstehenden gelbbraunen bis kastanienbraunen Schüppchen auf gelbweißem Grund, zur Basis dunkler braun, überwiegend hohl. Ring häutig, aufsteigend, bräunlich und vergänglich."
