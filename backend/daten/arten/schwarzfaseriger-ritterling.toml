[merkmale]
hut = "4 bis 12, selten bis 15 cm breit, dunkelgrau bis graubraun mit schwarzen Radialstreifen, teils mit gelbem oder violettem Einschlag. Schmierig und klebrig, trocken glänzend. Jung halbkugelig bis glockig, später gewölbt bis flach oder stumpf gebuckelt."
lamellen = "Weißlich, später gelbgrünlich, alt mit gelblichen Flecken, weich, ausgebuchtet angewachsen, gedrängt stehend, mit Zwischenlamellen."
stiel = "6 bis 9, selten bis 11 cm lang, etwa 2 bis 3 cm dick, weiß, später grüngelblich, faserig, kahl, im Alter hohl."
fleisch = "Weiß, faserig."
geruch = "Frisch leicht melonen- und gurkenartig, etwas mehlig."
geschmack = "Mehlig, beim längeren Kauen melonenartig oder nach Austern."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz im Nadelwald, gern bei Fichte, Kiefer und Weißtanne, selten bei Espe und Birke. Regional häufiger, sonst selten, in Deutschland gefährdet."
zeit = "Herbst bis Winter, nach den ersten Frösten."

