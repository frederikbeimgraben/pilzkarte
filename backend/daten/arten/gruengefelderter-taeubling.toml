[merkmale]
hut = "4 bis 15, selten bis 20 cm breit, ganz jung oft weißlich, dann grün, grasgrün, spangrün bis lagunenblau, nie violett. Kenntlich an den grünen Feldern, die felderig auf weißlichem bis blassgrünem Grund aufreißen, im Alter mit schmutzig gelben Rissen. Huthaut zur Hälfte abziehbar."
lamellen = "Weiß, cremefarben, später gelblich, alt braunfleckig, jung eng stehend, ausgebuchtet angewachsen, an der Basis queradrig verbunden."
stiel = "3 bis 10, selten bis 12 cm hoch, 1 bis 5, selten bis 6 cm dick, weiß, manchmal leicht bräunlich, unter den Lamellen weißlich bereift, auf Druck oft braun verfärbend, zylindrisch."
fleisch = "Weiß, im Alter leicht bräunlich, fest, spröde und brüchig."
geruch = "Neutral bis leicht mehlig, nussig, etwas marzipanartig, alt nach Käse."
geschmack = "Mild."
sporenpulver = "Weiß bis hellgelblich."
vorkommen = "Symbiosepilz meist im Laubwald, gern bei Buche, Eiche und Hainbuche. Wächst auch nach längerer Trockenheit noch."
zeit = "Frühsommer bis Herbst."

[[verwechslungen]]
