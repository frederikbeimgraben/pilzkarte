name = "Klapperschwamm"
lateinisch = "Grifola frondosa"
gruppe = "porling"
speisewert = "speisepilz"
geschuetzt = false
jahreszeiten = ["herbst"]
baeume = ["eiche"]

[merkmale]
fruchtkoerper = "20 bis 50 cm, ein Busch aus vielen grau- bis olivbraunen, spatelförmigen Hütchen auf einem verzweigten weißen Strunk."
poren = "Weiß bis cremefarben, fein, laufen am Strunk herab."
fleisch = "Weiß, fest, faserig."
geruch = "Kräftig würzig."
geschmack = "Mild, würzig."
sporenpulver = "Weiß."
vorkommen = "Schwächeparasit am Stammfuß alter Eichen, seltener Buchen. Kehrt jahrelang an denselben Baum zurück."
zeit = "September bis November."

[[verwechslungen]]
name = "Riesenporling"
merkmal = "Hüte viel größer und wenige, Fleisch schwärzt auf Druck."
essbar = "ungeniessbar"

[[verwechslungen]]
name = "Eichhase"
merkmal = "Hütchen rund mit mittigem Stielchen, im Sommer."
essbar = "essbar"

