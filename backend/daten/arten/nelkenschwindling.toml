speisewertHinweis = "Nur die Hüte, die Stiele sind zäh. Auf Wiesen wachsen giftige Trichterlinge daneben."

[merkmale]
hut = "2 bis 5 cm, ledergelb bis blass beige, mit stumpfem Buckel, bei Trockenheit blass, bei Nässe dunkler."
lamellen = "Blass creme, breit, entfernt stehend, am Stiel frei."
stiel = "Dünn, sehr zäh, lässt sich verdrehen ohne zu brechen."
fleisch = "Blass, dünn, ledrig."
geruch = "Kräftig, nach Bittermandel."
geschmack = "Mild, süßlich."
sporenpulver = "Weiß."
vorkommen = "Zersetzer auf Rasen, Wiesen und Weiden, in auffälligen Hexenringen."
zeit = "Mai bis November."

