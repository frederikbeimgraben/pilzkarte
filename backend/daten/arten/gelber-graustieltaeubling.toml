hut = "2 bis 8, selten bis 11 cm breit, gelb, chromgelb bis zitronengelb. Huthaut feucht glänzend und etwas schmierig, trocken matt, zur Hälfte abziehbar. Mitte später vertieft, Rand im Alter gerieft bis leicht gefurcht."
lamellen = "Weißlich, oft mit gelblicher Schneide, später grauend."
stiel = "2 bis 8, selten bis 11 cm lang, 1 bis 2, selten bis 3 cm dick, weiß, nach Berührung rötend und später graufleckig, hart und fest, voll."
fleisch = "Weiß, bei Verletzung meist rötend, danach grauend bis schwärzend, fest."
geruch = "Meist unbedeutend, schwach obstartig."
geschmack = "Mild, leicht schärflich."
sporenpulver = "Hellocker."
vorkommen = "Symbiosepilz auf moorigem, saurem Boden im Laubwald, häufig bei Birke, vereinzelt bei Espe und Erle. In Deutschland gefährdet."
zeit = "Sommer bis Herbst."

