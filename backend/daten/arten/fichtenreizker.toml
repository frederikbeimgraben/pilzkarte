[merkmale]
hut = "4 bis 10, selten bis 15 cm breit, orange bis orangerot, ausblassend, bald mit kräftigen grünen Flecken vor allem in der Mitte, dunkler gezont. Feucht stark schleimig, später flach trichterförmig vertieft."
lamellen = "Orangeocker bis blassorange, bogig angewachsen und etwas herablaufend, brüchig, in Stielnähe gegabelt, mit kürzeren Zwischenlamellen."
