stiel = "5 bis 15, selten bis 17 cm lang, rötlich bis orange, etwas weißlich bereift, sofort hohl, ohne Grübchen."
fleisch = "Rötlich, im Stiel weißlich bis hellorange, brüchig."
geruch = "Süßlich, obstartig."
geschmack = "Bitterlich, leicht scharf."
sporenpulver = "Blassocker."
vorkommen = "Symbiosepilz, wie alle Reizker nur bei Nadelholz, hier bei Fichte."
zeit = "Sommer bis Spätherbst."

