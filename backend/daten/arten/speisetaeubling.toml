name = "Speisetäubling"
lateinisch = "Russula vesca"
gruppe = "taeubling"
speisewert = "essbar"
wertigkeit = 1
marktfaehigSchweiz = true
marktfaehig = true
jahreszeiten = ["fruehling", "sommer", "herbst"]
baeume = ["eiche", "buche", "fichte", "hainbuche"]
speisewertHinweis = "Das beste Merkmal ist die verkürzte Huthaut, die die Lamellen am Rand frei lässt. Sie kann auch bei anderen Täublingen auftreten, deshalb zusätzlich auf den milden Geschmack achten."
haeufigkeit = "sehrHaeufig"
weitereNamen = ["Fleischroter Speisetäubling", "Fleischroter Täubling"]
synonyme = ["Russula heterophylla var. vesca", "Russula vesca var. major", "Russula vesca var. romellii", "Russula vesca f. viridata", "Russula vesca var. neglecta", "Russula vesca f. montana"]

[quelle]
url = "https://www.123pilzsuche.de/daten/details/Speisetaubling.htm"
geprueftAm = "2026-09-12"

[[reagenzien]]
reagenz = "guajak"
reaktion = "Fleisch lagunenblau bis blaugrün."

[[reagenzien]]
reagenz = "ammoniak"
reaktion = "Fleisch rosaorange."

[[reagenzien]]
reagenz = "feso4"
reaktion = "Fleisch fleischrosa bis orangerosa."

[[reagenzien]]
reagenz = "anilin"
reaktion = "Lamellen gelb bis zitronengelb."

[masse]
hutBreiteCm = { von = 4.0, bis = 12.0, seltenBis = 15.0, einheit = "cm" }
stielLaengeCm = { von = 3.0, bis = 11.0, seltenBis = 12.0, einheit = "cm" }
stielDickeCm = { von = 1.0, bis = 3.0, seltenBis = 4.0, einheit = "cm" }
sporenLaengeUm = { von = 5.5, bis = 8.5, einheit = "um" }
sporenBreiteUm = { von = 4.7, bis = 6.5, einheit = "um" }

[zeitraum]
vonMonat = 3
bisMonat = 11

[farben]
hut = [{ name = "purpurbraun", hex = "#5f3346" }, { name = "braun", hex = "#7a5230" }, { name = "grau", hex = "#8a8a8a" }, { name = "grün", hex = "#4f8a3a" }, { name = "lila", hex = "#8a5fa8" }]
sporenlager = [{ name = "weiß", hex = "#ffffff" }, { name = "gelb", hex = "#e8c33a" }, { name = "braun", hex = "#7a5230" }]
stiel = [{ name = "gelbbraun", hex = "#a3813f" }, { name = "weiß", hex = "#ffffff" }]
fleisch = [{ name = "weiß", hex = "#ffffff" }]
sporenpulver = [{ name = "weiß", hex = "#ffffff" }]

[farben.verfaerbung]
von = []
nach = [{ name = "braun", hex = "#7a5230" }]
dauer = "schnell"

[geruch]
tags = ["angenehm"]
text = "Angenehm."

[geschmack]
tags = ["mild", "nussig"]
text = "Mild, nussig."

[schutz]
status = "keiner"
quelle = "Bundesartenschutzverordnung, Anlage 1"

[merkmale]
hut = "4 bis 12, selten bis 15 cm breit, bräunlich, fleischfarben, weinbraun, graulila, haselnuss-, stein- oder purpurbraun, kaum bunt und dabei ausblassend, selten grün. Die Huthaut deckt die Lamellen nicht ganz, diese stehen am Rand etwas vor. Sie lässt sich zu etwa einem Drittel abziehen."
lamellen = "Weiß, später etwas gelblich, schnell braunfleckig, alte Schneiden bräunend, am Stielansatz gegabelt. Sie ragen über den Hutrand."
stiel = "3 bis 11, selten bis 12 cm hoch, 1 bis 3, selten bis 4 cm dick, weiß, nie rötlich überhaucht, alt meist gelbbraun fleckend, Basis oft verdickt."
fleisch = "Weiß, fest, brüchig, kompakt."
geruch = "Angenehm."
geschmack = "Mild, nussig."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz im Mischwald, gern im sauren Laub- oder Nadelwald bei Eiche, Buche, Fichte und Hainbuche, auf sandigen, leicht lehmigen, sauren bis neutralen Böden. Sehr häufig."
zeit = "Frühling bis Herbst."

[[verwechslungen]]
slug = "birkenspeitaeubling"
unterschied = "Hut weißlich, blass rosa bis rosenrot, Lamellen sehr zerbrechlich, Stiel weiß und brüchig."

[[verwechslungen]]
slug = "buchenspeitaeubling"
unterschied = "Hut zinnoberrot bis karminrot, Lamellen weiß, im Alter gelblich, ausgebuchtet angewachsen."

[[verwechslungen]]
slug = "flammstieltaeubling"
unterschied = "Hut blut- bis kirschrot, Stiel weiß und rot geflammt."

[[verwechslungen]]
slug = "kiefernspeitaeubling"
unterschied = "Hut blut- bis kirschrot, alt mattrot, Stiel weiß ohne Rottöne."

