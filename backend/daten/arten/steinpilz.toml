[merkmale]
hut = "4 bis 20, selten bis 25 cm breit, wildlederartig braun bis haselnussbraun. Der Rand bleibt lange eingerollt und ist meist weiß."
roehren = "Weißlich, gelblich, gelbgrün, später olivgrün, vereinzelt auf Druck bläulich bis grünlich. Ganz jung sind sie verschlossen wie Bienenwaben, beim Gallenröhrling ist das nicht so."
stiel = "Weißlich, bräunlich überfasert, mit weißem, im Alter bräunlichem Netz."
fleisch = "Weißlich, nicht verfärbend, unter der Huthaut mit einer kurzen rotbräunlichen Zone, anders als beim weißen Sommersteinpilz. Der Kiefernsteinpilz zeigt dieselbe Zone."
geruch = "Sehr angenehm, pilzig."
geschmack = "Mild, angenehm pilzig."
sporenpulver = "Olivbraun."
vorkommen = "Symbiosepilz im Mischwald, gern bei Fichte, Tanne und Kiefer, seltener bei Eiche, Hainbuche, Linde, Kastanie, Buche, Birke und anderen Laubbäumen."
zeit = "Frühsommer bis Spätherbst."

