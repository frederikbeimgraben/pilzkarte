name = "Steinpilz"
lateinisch = "Boletus edulis"
gruppe = "roehrling"
speisewert = "speisepilz"
geschuetzt = true
jahreszeiten = ["sommer", "herbst"]
baeume = ["fichte", "kiefer", "buche", "eiche"]
karte = "boletus_edulis"

[merkmale]
hut = "6 bis 25 cm, hell- bis dunkelbraun, jung halbkugelig, später polsterförmig. Rand oft heller, Haut trocken, bei Nässe leicht klebrig."
roehren = "Jung weiß und fest, später gelb bis olivgrün. Mündungen fein, am Stiel ausgebuchtet, auf Druck ohne Farbwechsel."
stiel = "5 bis 20 cm, dick und bauchig, blass beige, im oberen Teil mit feinem weißem Netz."
fleisch = "Weiß, fest, unter der Huthaut oft bräunlich. Verfärbt sich beim Anschnitt nicht."
geruch = "Angenehm pilzig, im Alter etwas süßlich."
geschmack = "Mild und nussig, auch roh nicht bitter."
sporenpulver = "Olivbraun."
vorkommen = "Mykorrhiza mit Fichte, Kiefer, Buche und Eiche. Auf sauren bis neutralen Böden, gern an Wegrändern, Lichtungen und Waldrändern."
zeit = "Juni bis November, Schwerpunkt September und Oktober."

[[verwechslungen]]
name = "Gallenröhrling"
merkmal = "Röhren jung weiß, bald rosa. Netz am Stiel dunkel und grob. Schon ein Krümel schmeckt bitter."
essbar = "ungeniessbar"

[[verwechslungen]]
name = "Sommersteinpilz"
merkmal = "Hut heller, oft felderig rissig, Netz feiner und über den ganzen Stiel. Ebenso essbar."
essbar = "speisepilz"

[[verwechslungen]]
name = "Satansröhrling"
merkmal = "Hut kreidig hellgrau, Stiel dick mit rotem Netz, Fleisch blaut. Auf Kalk unter Eiche und Buche."
essbar = "giftig"

