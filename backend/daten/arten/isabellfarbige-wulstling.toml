[[reagenzien]]
reagenz = "koh"
reaktion = "Keine Reaktion."

[merkmale]
hut = "2 bis 8, selten bis 12 cm breit, cremeweiß, cremegelb, hellgelb, isabellfarben, ocker, blass nussbraun, rotbraun, rosa oder weinbraun, Mitte dunkler. Glatt und matt, Haut grobschuppig und oft mit weißen filzigen Hüllresten. Der Rand ist kammförmig gerieft, vereinzelt mit Teilvelum. Die Lamellen treten unter der Huthaut deutlich hervor."
lamellen = "Weiß bis cremeweiß, alt hell cremefarben, gedrängt, meist frei, selten ausgebuchtet angewachsen, mit Zwischenlamellen."
stiel = "10 bis 12, selten bis 15 cm lang und 1 bis 2, selten bis 3 cm dick, weiß bis hellgelb, rübenartig, schnell hohl werdend. Basis knollig verdickt und warzig. Keine häutige Scheide, sondern ein warziger Gürtel. Ring grauweiß bis hellgelb, dünn, hängend und vergänglich."
fleisch = "Weiß, nicht verfärbend, zäh und elastisch."
geruch = "Unbedeutend, neutral."
geschmack = "Mild."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz bei Laubbäumen, gern Buche, Hasel, Eiche und Birke, vereinzelt im Nadelwald bei Kiefer. Überwiegend saurer Boden, wärmeliebend. Sehr selten, in Deutschland auf der Roten Liste."
zeit = "Sommer bis Herbst."

