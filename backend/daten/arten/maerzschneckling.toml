[merkmale]
hut = "3 bis 8, selten bis 12 cm breit, weißlich bis grauschwarz oder braunschwarz, zum Rand grauer, fleckig, klebrig, radial streifig und wellig gebogen. Die Huthaut färbt das Fleisch etwas durch."
lamellen = "Weiß, später etwas grau, nicht verfärbend, weit stehend, angewachsen bis etwas herablaufend, gegabelt, mit Zwischenlamellen."
stiel = "Weiß, später grauweiß, Spitze grau und leicht schuppig."
fleisch = "Weiß bis grau, fest und dick."
geruch = "Angenehm."
geschmack = "Mild."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz im Mischwald, gern bei Tanne und Fichte, seltener bei Buche und anderen Laubbäumen, auf kalkreichem Boden. In Deutschland stark gefährdet und nur regional zu finden."
zeit = "Frühling."

