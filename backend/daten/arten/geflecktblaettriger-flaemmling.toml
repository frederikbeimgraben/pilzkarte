[merkmale]
hut = "2 bis 8, selten bis 12 cm breit, einzelne auch unter 2 oder über 12 cm, sehr größenvariabel. Gelbfuchsig, gelbbraun, fuchsigorange bis zimtbraun, kahl und matt. Rand kann gerieft sein und ist meist heller gelblich-orange."
lamellen = "Jung hellgelb, bald orange und rostfleckig, dünn, gedrängt, angewachsen bis herablaufend, mit Zwischenlamellen."
stiel = "4 bis 8, selten bis 12 cm lang und 0,4 bis 0,9, selten bis 1,2 cm dick. Weißlich bis gelblich, weißlich-rotbräunlich überfasert, oft mit faseriger, angedeuteter Ringzone. Basis oft verdickt und mit Myzelfilz."
fleisch = "Orangegelb, braunocker bis rostbraun, wässrig und faserig."
geruch = "Nicht unangenehm, holzig."
geschmack = "Stark bitter."
sporenpulver = "Gelbbraun."
vorkommen = "Folgezersetzer an Totholz, meist auf Nadelholzstümpfen und dicken Ästen, oft büschelig wachsend."
zeit = "Frühsommer bis Herbst."

