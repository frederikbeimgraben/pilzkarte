[merkmale]
hut = "2 bis 8, selten bis 12 cm breit, einzelne auch unter 2 oder über 12 cm, sehr größenvariabel. Gelbfuchsig, gelbbraun, fuchsigorange bis zimtbraun, kahl und matt. Rand kann gerieft sein und ist meist heller gelblich-orange."
