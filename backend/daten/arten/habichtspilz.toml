name = "Habichtspilz"
lateinisch = "Sarcodon imbricatus"
gruppe = "stachelpilz"
speisewert = "bedingtEssbar"
geschuetzt = false
jahreszeiten = ["sommer", "herbst"]
baeume = ["fichte"]
speisewertHinweis = "Nur junge Fruchtkörper. Im Alter wird er bitter und ist dann ungenießbar; eine Geschmacksprobe klärt das. Gelegentlich kommen Magen-Darm-Beschwerden vor. Gut zum Trocknen als Würzpilz."

[quelle]
url = "https://www.123pilzsuche.de/daten/details/Habichtspilz.htm"
geprueftAm = "2026-09-10"

[merkmale]
hut = "6 bis 15, selten bis 30 cm breit, grauweißlich, braunweißlich bis hellbraun, dunkelbraun gefeldert, mit groben aufgerichteten Schuppen."
stacheln = "Weißbraun, brüchig, wenig herablaufend."
stiel = "Graubraun, Basis keulig."
fleisch = "Weißlich bis schmutzig weiß, später hell graubraun, zäh und fest."
geruch = "Würzig."
geschmack = "Mild, im Alter bitterlich."
sporenpulver = "Dunkelbraun."
vorkommen = "Symbiosepilz, gern im Nadelwald, auch in Parks und Gärten. Die Form bei Kiefer wird als eigene Art abgetrennt. Regional häufig, in Deutschland gefährdet."
zeit = "Sommer bis Spätherbst."

[[verwechslungen]]
name = "Gallenstacheling"
merkmal = "Hut dunkelbraun und feiner braunschuppig, Stielbasis bläulich grünlich, Fleisch dort schwarzblau, Geschmack extrem scharf und bitter."
essbar = "ungeniessbar"
slug = "gallenstacheling"

