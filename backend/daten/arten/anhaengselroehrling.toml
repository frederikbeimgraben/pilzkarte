hut = "4 bis 15, selten bis 18 cm breit, ocker-, kastanien- bis rotbraun, trocken, filzig bis lederartig, uneben. Fraßstellen gelblich bis orangerosa. Huthaut steht am scharfen Rand meist über."
roehren = "Gelblich, am Stiel ausgebuchtet angewachsen."
stiel = "Gelblich, zur Basis hell bräunend, Spitze gelb, mit feinmaschigem gelblichem bis bräunlichem Netz. Basis verdickt und mit einem wurzelnden Anhängsel im Boden."
fleisch = "Zitronengelb, später ausblassend und nur am Stielrand noch zitronengelb, fest bis hart, meist nur leicht blauend."
geruch = "Angenehm säuerlich pilzig, etwas nussig bis mandelartig."
geschmack = "Mild."
sporenpulver = "Dunkel olivbraun."
vorkommen = "Symbiosepilz in Laubwäldern bei Buche, Eiche und Hasel, vereinzelt bei Fichte, auf kalkreichem Boden. In Deutschland gefährdet."
zeit = "Frühsommer bis Herbst."

