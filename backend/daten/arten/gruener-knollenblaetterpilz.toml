[farben.verfaerbung]
von = []
nach = [{ name = "blau", hex = "#3a5f9e" }]

[geruch]
tags = ["suesslich", "unangenehm"]
text = "Jung fast geruchlos, nach Kleeheu, süßlich oder hornartig, alt widerlich nach Ammoniak."

[geschmack]
tags = ["mild", "suesslich"]
text = "Mild und süßlich. Niemals kosten, es droht eine Leberschädigung."

[schutz]
status = "keiner"
quelle = "Bundesartenschutzverordnung, Anlage 1"

[merkmale]
hut = "3 bis 15, selten bis 17 cm breit, grünlich, olivgrün, olivbraun, olivgelb, ocker, gelb bis fast weiß. Jung eiförmig-halbkugelig mit weißer Gesamthülle, später aufschirmend. Rand nicht gerieft, Huthaut fein radialfaserig eingewachsen, feucht etwas klebrig und wie ein Tortenstück abziehbar."
lamellen = "Weiß, eng stehend, frei bis fein angewachsen, mit Zahn etwas herablaufend."
stiel = "5 bis 12, selten bis 15 cm lang und 1 bis 4, selten bis 6 cm dick, weiß bis gelbgrünlich, faserig, oft genattert. Basis zwiebelknollig mit häutiger, eierschaliger Volva. Ring weiß bis gelblich, häutig, hängend, oben leicht gerieft, nicht verschiebbar."
fleisch = "Weiß, unter der Huthaut gelbgrünlich, beim Schneiden unverändert."
geruch = "Jung fast geruchlos, nach Kleeheu, süßlich oder hornartig, alt widerlich nach Ammoniak."
geschmack = "Mild und süßlich. Niemals kosten, es droht eine Leberschädigung."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz meist bei Laubbäumen wie Eiche und Buche, selten bei Nadelbäumen, auch in Parks und Gärten. Häufig."
zeit = "Frühsommer bis Spätherbst."

[[verwechslungen]]
slug = "frauentaeubling"
unterschied = "Ohne Ring, ohne Knolle und ohne Scheide, Lamellen und Fleisch brüchig."

[[verwechslungen]]
slug = "kegelhuetiger-knollenblaetterpilz"
unterschied = "Hut weiß bis cremefarben und kegelig, Huthaut wird mit KOH gelb."
eigenerUnterschied = "Hut olivgrün, gelbgrün bis ocker statt weiß."

[[verwechslungen]]
slug = "weisser-knollenblaetterpilz"
unterschied = "Ganz weiß, Hut ohne Grün- oder Olivton."
eigenerUnterschied = "Hut grünlich, oliv bis gelbgrün statt rein weißlich."

