speisewertHinweis = "Absolut tödlich, schon 20 Gramm genügen. Das Gift schädigt die Leber. Die wichtigsten Merkmale sind weiße Lamellen, ein häutiger Ring, ein radialfaserig eingewachsener Hut mit wie ein Tortenstück abziehbarer Haut und eine abgerundete Knolle mit häutiger Scheide."
haeufigkeit = "haeufig"
weitereNamen = ["Grüner Mörder", "Giftchampignon"]
synonyme = ["Amanita phalloides f. citrina", "Amanita phalloides f. dunensis", "Amanita phalloides var. umbrina", "Amanita phalloides var. euphalloides", "Amanita phalloides var. larroquei", "Amanita phalloides var. pulla", "Amanita phalloides var. verna", "Amanita phalloides var. striatula"]
fruchtschicht = { art = "lamellen", ansatz = "frei", stand = "eng" }
