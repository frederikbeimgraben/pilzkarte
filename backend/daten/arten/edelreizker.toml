[merkmale]
hut = "4 bis 10, selten bis 15 cm breit, orange, weißlich bereift, mit konzentrisch getropften Flecken. Glatt, feucht etwas schleimig, Rand lange eingebogen. Verletzte Stellen laufen später grün an."
lamellen = "Orangeocker bis blassocker."
milch = "Karottenrot bis orangerot, kaum veränderlich."
stiel = "2 bis 5, selten bis 7 cm lang, orange bis weißlich bereift, mit orangefarbenen Grübchen, innen wattig, später hohl."
fleisch = "Rötlich bis orange, an der Luft grünlich verfärbend, fest und brüchig."
geruch = "Süßlich, obstartig."
geschmack = "Mild, nach Weißkraut, kaum bitterlich."
sporenpulver = "Hell ockergelb."
vorkommen = "Symbiosepilz, wie alle Reizker nur bei Nadelholz, hier bei Kiefer."
zeit = "Sommer bis Spätherbst."

