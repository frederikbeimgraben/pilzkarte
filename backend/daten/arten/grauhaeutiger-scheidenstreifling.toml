name = "Grauhäutiger Scheidenstreifling"
lateinisch = "Amanita submembranacea"
gruppe = "wulstling"
speisewert = "speisepilz"
geschuetzt = false
sammelbar = false
jahreszeiten = ["sommer", "herbst"]
baeume = ["fichte", "tanne", "laerche", "birke", "buche", "hasel"]
speisewertHinweis = "Roh giftig, also keine Kostversuche. Er kann so grün aussehen wie der Grüne Knollenblätterpilz. Scheidenstreiflinge haben aber keinen Ring und einen stark gerieften Hutrand."

[quelle]
url = "https://www.123pilzsuche.de/daten/details/GrauhautigerSS.htm"
geprueftAm = "2026-09-10"

[merkmale]
hut = "3 bis 10, selten bis 13 cm breit, graubraun, rötlichbraun, braunoliv, grauocker bis olivgrün, oft mit grauen Hüllresten. Rand blasser und auf etwa einem Drittel des Radius stark gerieft. Flach ausgebreitet, aber immer mit kleinem Buckel."
lamellen = "Weiß, frei bis fein angewachsen."
stiel = "5 bis 12, selten bis 14 cm lang und 5 bis 12, selten bis 15 mm dick, weiß bis graubraun genattert, flockig, nach oben verjüngt, im Alter hohl. Volva grauweiß, später grau, gleichmäßig zylindrisch."
fleisch = "Weiß bis leicht gelblich."
geruch = "Unbedeutend, neutral."
geschmack = "Mild. Roh giftig, keine Kostversuche."
sporenpulver = "Weiß."
vorkommen = "Symbiosepilz im Mischwald bei Heidelbeere, meist bei Nadelbäumen wie Fichte, Tanne und Lärche, seltener bei Birke, Buche und Hasel. Gern auf saurem Boden."
zeit = "Frühsommer bis Herbst."

