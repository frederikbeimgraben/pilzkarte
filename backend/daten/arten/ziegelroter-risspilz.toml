[merkmale]
hut = "2 bis 7, selten bis 9 cm breit, jung geschlossen und weißlich, später gelbbraun, ockerbraun, rotbraun bis ziegelrot, kegelig gebuckelt und radialfaserig. Erst beim Öffnen reißt die Huthaut auf."
lamellen = "Weißlich bis schmutzigweiß, dann rosa und später rötlich verfärbend, alt olivbraun, Schneiden heller."
stiel = "3 bis 10, selten bis 12 cm lang, 0,8 bis 2,2, selten bis 2,6 cm dick, weiß, schmutzigweiß bis graubraun, später rötlich anlaufend, zylindrisch, zur Basis leicht verdickt."
fleisch = "Weiß, rot verfärbend."
geruch = "Spermatisch oder obstartig."
geschmack = "Mild und fruchtig, aber eher unangenehm."
sporenpulver = "Dunkelbraun."
vorkommen = "In Laubwald, Parks, an Waldwegen und auf Ruderalflächen, gern bei Linde und Buche auf kalk- und nährstoffreichem Boden."
zeit = "Frühling bis Spätherbst."

