[merkmale]
hut = "5 bis 11, selten bis 13 cm breit, fleischrosa, bräunlich, kastanienbraun bis purpurbraun. Mitte eingedrückt bis genabelt oder trichterförmig, Haut abziehbar, Rand lange eingebogen."
lamellen = "Blassgelb, später ockergelb, angewachsen bis etwas herablaufend, gedrängt, mit Zwischenlamellen."
milch = "Weiß und unveränderlich, anfangs mild, schnell brennend scharf."
stiel = "Blassbraun bis blassocker, alt rotbraun, oft mit dunkleren Gruben, Spitze meist heller."
fleisch = "Weiß, unter der Huthaut bräunlich."
geruch = "Obstartig, nach Zichorien und Maggi, ähnlich dem Kampfermilchling."
geschmack = "Extrem scharf."
sporenpulver = "Hellocker."
vorkommen = "Symbiosepilz im Mischwald, gern in Bergregionen, auf saurem grasigem Boden. Sehr selten, in Deutschland stark gefährdet."
zeit = "Sommer bis Herbst."

