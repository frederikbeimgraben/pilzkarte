[project]
name = "pilze"
version = "0.1.0"
description = "Fruiting-body occurrence prediction for German macrofungi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
grids = ["xarray>=2024.3", "netCDF4>=1.6", "numpy>=1.26"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Die Kette importiert ihre Module flach, ueber sys.path. Die Tests tun
# dasselbe, statt die Kette auf ein Paket umzubauen.
pythonpath = ["src/pilze"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilze"]
