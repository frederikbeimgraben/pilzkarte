 *{box-sizing:border-box}
 body{margin:0;background:#c7ccc8;font-family:'Archivo','Segoe UI',system-ui,sans-serif;color:#141815;-webkit-font-smoothing:antialiased}
 a{color:#004225} a:hover{color:#00351e}
 .tel{width:390px;height:844px;position:relative;overflow:hidden;background:#f7f8f7}
 .desk{width:1440px;height:900px;position:relative;overflow:hidden;background:#f7f8f7;display:grid;grid-template-columns:400px 1fr;grid-template-rows:64px 1fr}
 .karte{position:absolute;inset:0;background:
   radial-gradient(120px 90px at 22% 18%, #dfe8d6 0, transparent 100%),
   radial-gradient(160px 120px at 78% 30%, #d3dfcb 0, transparent 100%),
   radial-gradient(200px 140px at 40% 62%, #d8e3d0 0, transparent 100%),
   linear-gradient(180deg,#eef2ea,#e4ebe0)}
 .karte svg{position:absolute;inset:0;width:100%;height:100%}
 .heat{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.92}
 .tab-nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:#ffffff;border-top:1px solid #e0e3e0;display:flex;padding:6px 8px 8px}
 .tab-nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:#666c67}
 .tab-nav div.on{color:#004225}
 .tab-nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .blatt{position:absolute;left:0;right:0;bottom:64px;background:#ffffff;border-radius:18px 18px 0 0;box-shadow:0 8px 28px rgba(0,38,21,.14);display:flex;flex-direction:column}
 .griff{height:24px;display:flex;align-items:center;justify-content:center}
 .griff i{display:block;width:40px;height:4px;border-radius:2px;background:#e0e3e0}
 .kopf{padding:0 16px 12px;border-bottom:1px solid #e0e3e0}
 .kopfzeile{display:flex;align-items:center;justify-content:space-between;height:44px}
 .kopfzeile b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
 .kopfzeile b span{color:#666c67;font-weight:500;margin-right:6px}
 .kopfzeile b em{font-style:normal;color:#8c1c16}
 .knoepfe{display:flex;gap:0;border:1px solid #828a84;border-radius:8px;overflow:hidden;flex:0 0 auto;margin-left:12px}
 .knoepfe i{display:flex;align-items:center;justify-content:center;width:38px;height:36px;background:#ffffff;border-left:1px solid #828a84}
 .knoepfe i:first-child{border-left:0}
 .knoepfe i svg{width:12px;height:12px;fill:#141815}
 .leiste{display:flex;gap:6px;overflow:hidden;padding:10px 16px 2px;margin:0 -16px}
 .woche{flex:0 0 auto;width:48px;height:56px;border:1px solid #e0e3e0;border-radius:8px;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#666c67}
 .woche small{font-size:10px;letter-spacing:.06em}
 .woche b{font-size:15px;color:#141815;font-variant-numeric:tabular-nums}
 .woche u{position:absolute;bottom:6px;left:8px;right:8px;height:3px;border-radius:2px;background:#e0e3e0;text-decoration:none}
 .woche u i{display:block;height:100%;border-radius:2px;background:#c8a25a}
 .woche.on{background:#004225;border-color:#004225}
 .woche.on b,.woche.on small{color:#ffffff}
 .woche.prog{border-style:dashed}
 .woche.jahr::before{content:attr(data-jahr);position:absolute;top:3px;font-size:8px;font-weight:700;color:#8c6820}
 .inhalt{padding:16px 16px 24px;display:flex;flex-direction:column;gap:24px;flex:1 1 auto;min-height:0;overflow:hidden}
 .seg{display:flex;gap:4px;background:#eef0ee;border:1px solid #e0e3e0;border-radius:12px;padding:4px}
 .seg div{flex:1;text-align:center;padding:9px 4px;font-size:15px;font-weight:600;color:#666c67;border-radius:8px}
 .seg div.on{background:#ffffff;color:#141815;box-shadow:0 1px 2px rgba(0,38,21,.06),0 1px 3px rgba(0,38,21,.08)}
 .h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#666c67;font-weight:600;margin-bottom:10px}
 .chips{display:flex;gap:8px;overflow:hidden;padding-bottom:2px}
 .chip{flex:0 0 auto;height:40px;display:flex;align-items:center;padding:0 16px;border:1px solid #828a84;border-radius:999px;font-size:14px;font-weight:600;color:#141815;background:#ffffff;white-space:nowrap}
 .chip.on{background:#004225;border-color:#004225;color:#ffffff}
 .rampe{display:flex;height:12px;border-radius:6px;overflow:hidden}
 .rampe i{flex:1}
 .enden{display:flex;justify-content:space-between;font-size:13px;color:#666c67;font-variant-numeric:tabular-nums;margin-top:6px}
 .schalter{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border:1px solid #e0e3e0;border-radius:10px;font-size:15px}
 .schalter i{width:20px;height:20px;border:1px solid #828a84;border-radius:4px;background:#ffffff;display:flex;align-items:center;justify-content:center}
 .schalter i.on{background:#004225;border-color:#004225}
 .schalter i svg{width:12px;height:12px;stroke:#ffffff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
 .schalter em{font-style:normal;color:#666c67;margin-left:auto;font-size:13px}
 .knopf{height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;border-radius:10px;font-size:15px;font-weight:600;border:1px solid transparent;white-space:nowrap}

 .knopf.sekundaer{background:#ffffff;color:#141815;border-color:#828a84}
 .knopf.geist{color:#004225}
 .knopf.gefahr{background:#ffffff;color:#8c1c16;border-color:#8c1c16}
 .knopf.gross{height:48px}
 .knopf.breit{width:100%}
 .knopf svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
 .feld{height:44px;display:flex;align-items:center;padding:0 16px;border:1px solid #828a84;border-radius:10px;background:#ffffff;font-size:16px}
 .feld.leer{color:#666c67}
 .feld.mehrzeilig{height:80px;align-items:flex-start;padding-top:10px}
 .label{font-size:14px;font-weight:500;margin-bottom:8px}
 .badge{display:inline-flex;align-items:center;padding:4px 12px;font-size:12.5px;font-weight:600;line-height:1.4;border-radius:999px;background:#eef0ee;color:#666c67;white-space:nowrap}

 .badge.w{background:#f7eed8;color:#876010}

 .fuss{margin-top:auto;padding:12px 16px 16px;border-top:1px solid #e0e3e0;background:#ffffff;display:flex;flex-direction:column;gap:10px}
