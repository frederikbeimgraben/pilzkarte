name: CI

# Jeder Job prüft zuerst, ob sein Ordner da ist. Fehlt er, endet der Job grün
# mit einem Hinweis: ein Job mit `if` auf Job-Ebene wäre übersprungen und
# meldete dem Branch-Schutz nichts. setup-uv führt oberhalb von v7 keinen
# mitlaufenden Major-Tag, darum die genaue Version. Dependabot hebt sie an.

on:
  pull_request:
  push:
    branches: [main]

# Ein neuer Push macht den laufenden Test desselben Branches wertlos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

jobs:
  be-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ordner
        name: Backend vorhanden
        run: .github/scripts/ordner.sh backend/pyproject.toml backend A0
      - if: steps.ordner.outputs.da == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - if: steps.ordner.outputs.da == 'true'
        working-directory: backend
        run: uv sync --all-extras
      - if: steps.ordner.outputs.da == 'true'
        working-directory: backend
        run: uv run ruff check .
      - if: steps.ordner.outputs.da == 'true'
        working-directory: backend
        run: uv run ruff format --check .
      - if: steps.ordner.outputs.da == 'true'
        working-directory: backend
        run: uv run python -m tools.check_comments
      - if: steps.ordner.outputs.da == 'true'
        working-directory: backend
        run: uv run python -m tools.check_size

  be-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ordner
        name: Backend vorhanden
        run: .github/scripts/ordner.sh backend/pyproject.toml backend A0
      - if: steps.ordner.outputs.da == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - if: steps.ordner.outputs.da == 'true'
        working-directory: backend
        run: uv sync --all-extras
      - if: steps.ordner.outputs.da == 'true'
        working-directory: backend
        run: uv run basedpyright

  be-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ordner
        name: Backend vorhanden
        run: .github/scripts/ordner.sh backend/pyproject.toml backend A0
      - if: steps.ordner.outputs.da == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - if: steps.ordner.outputs.da == 'true'
        working-directory: backend
        run: uv sync --all-extras
      # Die Abdeckungsgrenze steht in backend/pyproject.toml, nicht hier.
      - if: steps.ordner.outputs.da == 'true'
        working-directory: backend
        run: uv run pytest --cov

  fe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ordner
        name: Frontend vorhanden
        run: .github/scripts/ordner.sh frontend/package.json frontend A1
      - if: steps.ordner.outputs.da == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.ordner.outputs.da == 'true'
        working-directory: frontend
        run: npm ci
      - if: steps.ordner.outputs.da == 'true'
        working-directory: frontend
        run: npm run lint

  fe-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ordner
        name: Frontend vorhanden
        run: .github/scripts/ordner.sh frontend/package.json frontend A1
      - if: steps.ordner.outputs.da == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.ordner.outputs.da == 'true'
        working-directory: frontend
        run: npm ci
      - if: steps.ordner.outputs.da == 'true'
        working-directory: frontend
        run: npm run typecheck

  fe-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ordner
        name: Frontend vorhanden
        run: .github/scripts/ordner.sh frontend/package.json frontend A1
      - if: steps.ordner.outputs.da == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.ordner.outputs.da == 'true'
        working-directory: frontend
        run: npm ci
      # test:ci läuft einmal durch und misst die Abdeckung. npm test bleibt
      # der Wachmodus für die Entwicklung.
      - if: steps.ordner.outputs.da == 'true'
        working-directory: frontend
        run: npm run test:ci

  fe-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ordner
        name: Frontend vorhanden
        run: .github/scripts/ordner.sh frontend/package.json frontend A1
      - if: steps.ordner.outputs.da == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.ordner.outputs.da == 'true'
        working-directory: frontend
        run: npm ci
      # Die Budgets stehen in frontend/angular.json und brechen den Build.
      - if: steps.ordner.outputs.da == 'true'
        working-directory: frontend
        run: npm run build

  mo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ordner
        name: Modell vorhanden
        run: .github/scripts/ordner.sh modell/flake.nix modell C2
      # Die Kette hängt an numpy, pandas und pillow aus nixpkgs.
      # modell/flake.nix legt diese Versionen als einzige Stelle fest, und
      # pip-Räder finden auf NixOS kein libstdc++. Darum Nix statt pip.
      # Die Shell #test trägt nur, was die Tests laden.
      - if: steps.ordner.outputs.da == 'true'
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          diagnostic-endpoint: ""
      # Ohne Store-Cache: magic-nix-cache lud den Abschluss der Shell gemessene
      # 5 min 25 s in den Actions-Cache, bei 3 min 05 s Testlauf. cache.nixos.org
      # liefert dieselben Pfade schneller, und der Actions-Cache bleibt für npm
      # und uv frei.
      - if: steps.ordner.outputs.da == 'true'
        run: nix develop ./modell#test -c python -m pytest modell/tests -q

  fe-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run build
      - name: Flüsse
        working-directory: frontend
        run: npm run e2e:flows
      - name: Boards
        working-directory: frontend
        run: npm run e2e:boards
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diffs
          path: |
            frontend/e2e/ergebnisse
            frontend/e2e/bericht
          if-no-files-found: ignore
          retention-days: 7

  fe-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      # Kategorie PWA ist scharf. Kategorie Leistung warnt, bis U12 sie hebt.
      - name: Lighthouse
        working-directory: frontend
        run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: frontend/lighthouse-bericht
          if-no-files-found: ignore
          retention-days: 7

  fe-contract-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run api:generate
      - name: Der erzeugte Client ist auf dem Stand des Vertrags
        run: git diff --exit-code -- frontend/src/app/core/api/contract.d.ts

  be-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - working-directory: backend
        run: uv sync --all-extras
      - working-directory: backend
        run: uv run python -m tools.sync_contract
      - name: Jeder Pfad des Vertrags hat eine Route
        working-directory: backend
        run: uv run pytest -m contract --no-cov -q
      - name: Datenbank anlegen
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Dienst starten
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8111 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8111/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::Backend antwortet nicht"
          exit 1
      - name: Schemathesis
        working-directory: backend
        run: >
          uv run schemathesis run openapi.yaml
          --url http://127.0.0.1:8111/api
          --phases examples,coverage
          --max-failures 25
          --report junit
          --report-dir schemathesis-report
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: schemathesis
          path: backend/schemathesis-report
          if-no-files-found: ignore
          retention-days: 7
